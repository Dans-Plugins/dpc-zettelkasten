name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Validate notes
        run: python3 tools/validate.py

      - name: Check docs/SOURCES.md is current
        run: python3 tools/sources_index.py --check

      - name: Check generated artifacts match the notes
        run: |
          cp site/index.html /tmp/committed.html
          cp site/dataset.json /tmp/committed.json
          python3 tools/build.py
          for f in index.html:/tmp/committed.html dataset.json:/tmp/committed.json; do
            name="${f%%:*}"; old="${f##*:}"
            if ! diff -q "$old" "site/$name" > /dev/null; then
              echo "::error::site/$name is out of date — run 'python3 tools/build.py' and commit the result"
              exit 1
            fi
          done
          echo "site/index.html and site/dataset.json are up to date"

      # dpc-mcp-server consumes lib/zk-graphql.js directly. If it stops loading
      # outside a browser, that server breaks without this repo's tests failing.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the GraphQL engine runs headless
        run: |
          node -e "
            const { createEngine } = require('./lib/zk-graphql.js');
            const engine = createEngine(require('./site/dataset.json'));
            const { data, notes } = engine.execute('{ stats { noteCount citationCount } notes(first: 3) { title degree } }');
            if (data.stats.noteCount < 1) throw new Error('empty dataset');
            if (!notes.length) throw new Error('no notes tracked during execution');
            if (engine.sdl().indexOf('type Note') === -1) throw new Error('schema missing Note type');
            console.log('engine ok —', data.stats.noteCount, 'notes,', data.stats.citationCount, 'citations');
          "

  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # Citations are checked against the live GitHub API. Drift is reported but
      # never fails the build — code moving on is expected and is a signal to
      # re-verify a note, not a reason to block an unrelated change. Only an
      # invalid citation (missing file at the pinned commit, or a line range past
      # the end of the file) is a failure.
      - name: Check citations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_sources.py

  # The gateway builds this service from the Dockerfile in this repository, so a
  # broken image is only discovered at deploy time unless it is built here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the image
        run: docker build -t dpc-zettelkasten:ci .

      # An unusual host port on purpose: a check that silently talks to
      # something already listening proves nothing, and that failure looks
      # exactly like a broken image.
      - name: Serve the explorer and check what comes back
        run: |
          docker run -d --name zk -p 18080:8080 dpc-zettelkasten:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/healthz > /dev/null \
            || { echo "::error::container never became ready"; docker logs zk; exit 1; }

          # Content type is what a static server gets wrong, and the graph and
          # GraphQL tabs fail silently when it does.
          curl -sf -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:18080/ \
            | grep -q '^200 text/html' || { echo "::error::/ is not served as text/html"; exit 1; }
          curl -sf -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:18080/dataset.json \
            | grep -q '^200 application/json' || { echo "::error::/dataset.json is not served as application/json"; exit 1; }

          # The dataset must survive the trip intact — the engine parses it.
          curl -sf http://127.0.0.1:18080/dataset.json > /tmp/served.json
          diff -q /tmp/served.json site/dataset.json \
            || { echo "::error::served dataset.json differs from the committed one"; exit 1; }

          # And gzip must not corrupt it, since that is how a browser asks.
          curl -sf --compressed http://127.0.0.1:18080/dataset.json > /tmp/served.gz.json
          diff -q /tmp/served.gz.json site/dataset.json \
            || { echo "::error::gzipped dataset.json does not decode to the committed one"; exit 1; }

          node -e "
            const { createEngine } = require('./lib/zk-graphql.js');
            const e = createEngine(require('/tmp/served.json'));
            const { data } = e.execute('{ stats { noteCount } }');
            if (data.stats.noteCount < 1) throw new Error('served dataset is empty');
            console.log('served dataset parses —', data.stats.noteCount, 'notes');
          "

          # The engine is published for browser consumers, and it is worth
          # nothing if it is not the file this repository tests.
          curl -sf http://127.0.0.1:18080/lib/zk-graphql.js > /tmp/served-engine.js
          diff -q /tmp/served-engine.js lib/zk-graphql.js \
            || { echo "::error::served zk-graphql.js differs from the committed one"; exit 1; }

          # CORS: a cross-origin consumer needs both the header on the GET and a
          # correct preflight, and neither is visible from a same-origin test.
          for path in dataset.json lib/zk-graphql.js; do
            curl -sf -D- -o /dev/null -H 'Origin: https://dansplugins.com' \
              "http://127.0.0.1:18080/$path" | grep -qi '^access-control-allow-origin: \*' \
              || { echo "::error::$path is missing Access-Control-Allow-Origin"; exit 1; }

            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://dansplugins.com' -H 'Access-Control-Request-Method: GET' \
              "http://127.0.0.1:18080/$path")
            test "$code" = "204" || { echo "::error::preflight for $path returned $code, expected 204"; exit 1; }
          done

          # The headers the server block sets must survive in the CORS location:
          # nginx drops inherited add_header as soon as a nested level sets one.
          curl -sf -D- -o /dev/null http://127.0.0.1:18080/dataset.json \
            | grep -qi '^cache-control: public' \
            || { echo "::error::dataset.json lost Cache-Control in the CORS location"; exit 1; }

          # Compare against the expected uid rather than "not root": a failed
          # exec returns an empty string, which passes any "!= 0" test.
          uid="$(docker exec zk id -u)"
          test "$uid" = "101" || { echo "::error::expected uid 101, got '${uid:-<exec failed>}'"; exit 1; }
          docker rm -f zk
