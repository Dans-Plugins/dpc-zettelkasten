<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — DPC Zettelkasten</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="DPC Zettelkasten">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{ogImageWidth}}">
<meta property="og:image:height" content="{{ogImageHeight}}">
<meta property="og:image:alt" content="{{ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:image:alt" content="{{ogImageAlt}}">
<style>
  :root {
    --bg: #fbfbfa; --fg: #2a2b2e; --fg-dim: #62646b; --line: #dcdcd6;
    --accent: #6d43d4; --code-bg: #f0efec;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171d; --fg: #d6d9e0; --fg-dim: #8b91a0; --line: #2f333d;
      --accent: #a78bfa; --code-bg: #12131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 var(--sans); -webkit-text-size-adjust: 100%;
  }
  main, header, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline;
           padding-top: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 650; color: var(--fg); text-decoration: none; }
  header .open { margin-left: auto; }
  a { color: var(--accent); }
  h1 { line-height: 1.25; margin: 22px 0 6px; }
  .summary { color: var(--fg-dim); margin-top: 0; }
  code, pre { font-family: var(--mono); font-size: 0.9em; background: var(--code-bg); border-radius: 4px; }
  code { padding: 1px 4px; }
  pre { padding: 10px 12px; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--fg-dim); }
  .wl.broken { color: var(--fg-dim); text-decoration: line-through; }
  .meta { border-top: 1px solid var(--line); margin-top: 28px; }
  .meta li { margin: 4px 0; }
  .meta .claim { color: var(--fg-dim); }
  footer { color: var(--fg-dim); font-size: 13px; padding-top: 18px; padding-bottom: 28px; }
  footer a { color: var(--fg-dim); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">DPC Zettelkasten</a>
  <a class="open" href="/#/{{id}}">Open in the explorer</a>
</header>
<main>
<article>
<h1>{{title}}</h1>
<p class="summary">{{summary}}</p>
{{body}}
</article>
{{sources}}
{{backlinks}}
</main>
<footer>
  <a href="{{sourceUrl}}" rel="noopener noreferrer">This note on GitHub</a> ·
  More by Daniel Stephenson → <a href="https://danielstephenson.dev" rel="noopener noreferrer">danielstephenson.dev</a>
</footer>
</body>
</html>
