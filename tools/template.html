<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPC Zettelkasten</title>
<style>
  :root {
    --bg: #16171d;
    --bg-2: #1c1e26;
    --bg-3: #23262f;
    --line: #2f333d;
    --fg: #d6d9e0;
    --fg-dim: #8b91a0;
    --fg-faint: #656b7a;
    --accent: #a78bfa;
    --accent-dim: #7c5cf0;
    --moc: #f0a868;
    --code-bg: #12131a;
    --header-h: 46px;
    --radius: 6px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    --bg: #fbfbfa; --bg-2: #f2f2ef; --bg-3: #e8e8e4; --line: #dcdcd6;
    --fg: #2a2b2e; --fg-dim: #62646b; --fg-faint: #8b8d94;
    --accent: #6d43d4; --accent-dim: #5730b8; --moc: #b06a1a; --code-bg: #f0efec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--sans);
    display: grid; grid-template-rows: auto 1fr;
    overflow: hidden;
    /* dvh, not vh: a phone's URL bar collapses and vh does not follow it. */
    height: 100%; height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px; height: var(--header-h); flex: none; z-index: 70;
    background: var(--bg-2); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; letter-spacing: -0.2px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  header nav { display: flex; gap: 4px; }
  .tab {
    background: none; border: 0; color: var(--fg-dim); cursor: pointer;
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: var(--radius);
  }
  .tab:hover { background: var(--bg-3); color: var(--fg); }
  .tab.on { background: var(--bg-3); color: var(--fg); }
  .spacer { flex: 1; }
  #search {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--fg); font: inherit; font-size: 13px; padding: 5px 10px; width: 260px;
  }
  #search:focus { outline: none; border-color: var(--accent-dim); }
  .icon-btn {
    align-items: center; background: none; border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--fg-dim); cursor: pointer;
    display: inline-flex; flex: none; font: inherit; font-size: 13px;
    justify-content: center; min-height: 30px; padding: 4px 9px;
  }
  .icon-btn:hover { color: var(--fg); border-color: var(--fg-faint); }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: 262px minmax(0,1fr) 274px; min-height: 0; position: relative; }
  main.wide { grid-template-columns: 262px minmax(0,1fr); }
  main.wide aside.right { display: none; }
  aside { background: var(--bg-2); overflow-y: auto; padding: 14px 0 40px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); padding: 18px 16px 40px; }
  #content { overflow-y: auto; padding: 0; min-width: 0; }

  .sec-title {
    color: var(--fg-faint); font-size: 11px; font-weight: 650;
    letter-spacing: 0.09em; text-transform: uppercase;
    padding: 14px 16px 6px;
  }
  .sec-title.sub { padding-top: 16px; }
  .sec-title.sub::before {
    background: var(--line); content: ""; display: block;
    height: 1px; margin: 0 0 12px; width: 100%;
  }
  .sec-title a.sec-link { color: var(--moc); text-decoration: none; }
  .sec-title a.sec-link:hover { text-decoration: underline; }
  aside.left ul { list-style: none; margin: 0; padding: 0; }
  aside.left li a {
    color: var(--fg-dim); display: block; font-size: 13.5px;
    padding: 4px 16px 4px 20px; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  aside.left li a:hover { background: var(--bg-3); color: var(--fg); }
  aside.left li a.on {
    background: var(--bg-3); color: var(--fg);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  aside.left li a.moc { color: var(--moc); }
  .count { color: var(--fg-faint); font-size: 11px; float: right; }
  .empty { color: var(--fg-faint); font-size: 13px; padding: 6px 16px; font-style: italic; }

  /* ---------- note ---------- */
  article { max-width: 760px; margin: 0 auto; padding: 34px 40px 90px; }
  .kicker { color: var(--fg-faint); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  article h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.5px; }
  .summary { color: var(--fg-dim); font-size: 16px; margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .chip {
    background: var(--bg-3); border-radius: 999px; color: var(--fg-dim);
    font-size: 11.5px; padding: 2px 10px; text-decoration: none;
  }
  a.chip:hover { color: var(--fg); }
  .chip.type-moc { background: color-mix(in srgb, var(--moc) 22%, transparent); color: var(--moc); }
  .prose { border-top: 1px solid var(--line); padding-top: 22px; }
  .prose h2 { font-size: 20px; margin: 30px 0 8px; letter-spacing: -0.2px; }
  .prose h3 { font-size: 16px; margin: 22px 0 6px; color: var(--fg); }
  .prose p { margin: 0 0 13px; }
  .prose ul, .prose ol { margin: 0 0 13px; padding-left: 22px; }
  .prose li { margin-bottom: 4px; }
  .prose li > ul, .prose li > ol { margin-top: 4px; }
  .prose code {
    background: var(--code-bg); border-radius: 4px; font-family: var(--mono);
    font-size: 0.87em; padding: 1px 5px;
  }
  .prose pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius);
    margin: 0 0 14px; overflow-x: auto; padding: 12px 14px;
  }
  .prose pre code { background: none; font-size: 12.5px; padding: 0; }
  .prose blockquote {
    border-left: 3px solid var(--accent-dim); color: var(--fg-dim);
    margin: 0 0 14px; padding: 2px 0 2px 14px;
  }
  .prose hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .table-scroll { overflow-x: auto; margin-bottom: 14px; }
  .prose table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .prose th { background: var(--bg-2); font-weight: 600; }
  .prose a { color: var(--accent); text-decoration: none; }
  .prose a:hover { text-decoration: underline; }
  a.wl { border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .wl.broken { color: #e06c75; border-bottom: 1px dashed #e06c75; cursor: help; }

  /* ---------- right rail ---------- */
  .rail-h {
    color: var(--fg-faint); font-size: 11px; font-weight: 650;
    letter-spacing: 0.09em; text-transform: uppercase; margin: 20px 0 8px;
  }
  .rail-h:first-child { margin-top: 0; }
  .rail-sec .rail-h { margin-top: 0; }
  .rail-sec + .rail-sec { margin-top: 22px; }
  .rail-list { list-style: none; margin: 0; padding: 0; }
  .rail-list li { margin-bottom: 5px; }
  .rail-list a { color: var(--fg-dim); font-size: 13px; text-decoration: none; }
  .rail-list a:hover { color: var(--accent); }
  .rail-list a.moc { color: var(--moc); }
  .rail-empty { color: var(--fg-faint); font-size: 12.5px; font-style: italic; }
  .src {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
    display: block; margin-bottom: 8px; padding: 9px 11px; text-decoration: none;
  }
  .src:hover { border-color: var(--accent-dim); }
  .src .claim { color: var(--fg); display: block; font-size: 12.5px; line-height: 1.45; }
  .src .loc {
    color: var(--fg-faint); display: block; font-family: var(--mono);
    font-size: 10.5px; margin-top: 5px; overflow-wrap: anywhere;
  }
  .src .sha { color: var(--accent); }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc a { color: var(--fg-dim); font-size: 12.5px; text-decoration: none; }
  .toc a:hover { color: var(--fg); }
  .toc li.lvl-3 { padding-left: 12px; }

  /* ---------- graph ---------- */
  #graph-view { display: none; height: 100%; position: relative; }
  #graph-view.on { display: block; }
  #graph { display: block; height: 100%; width: 100%; cursor: grab; touch-action: none; }
  #graph:active { cursor: grabbing; }
  .graph-legend {
    background: color-mix(in srgb, var(--bg-2) 92%, transparent);
    border: 1px solid var(--line); border-radius: var(--radius);
    font-size: 12px; left: 16px; padding: 10px 12px; position: absolute; top: 16px;
  }
  .graph-legend .row { align-items: center; display: flex; gap: 7px; margin-bottom: 4px; }
  .graph-legend .row.hint { margin: 6px 0 0; color: var(--fg-faint); }
  .graph-legend .row:last-child { margin-bottom: 0; }
  #graph-fit { font-size: 11.5px; padding: 5px 12px; width: 100%; }
  .dot { border-radius: 50%; height: 9px; width: 9px; }
  #content.hidden { display: none; }

  /* ---------- graphql ---------- */
  #gql-view { display: none; grid-template-columns: minmax(320px, 42%) 1fr; min-height: 0; }
  #gql-view.on { display: grid; }
  .gql-left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .gql-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane-h {
    align-items: center; background: var(--bg-2); border-bottom: 1px solid var(--line);
    color: var(--fg-faint); display: flex; flex: none; font-size: 11px; font-weight: 650; gap: 10px;
    letter-spacing: 0.09em; padding: 9px 14px; text-transform: uppercase;
  }
  .pane-h .hint { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: 0.75; }
  .seg { display: flex; gap: 2px; margin-left: auto; }
  .seg button {
    background: none; border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--fg-dim); cursor: pointer; font: inherit; font-size: 10.5px;
    letter-spacing: 0.06em; padding: 3px 9px; text-transform: uppercase;
  }
  .seg button.on { background: var(--bg-3); border-color: var(--accent-dim); color: var(--fg); }
  #gql-editor {
    background: var(--code-bg); border: 0; border-bottom: 1px solid var(--line);
    color: var(--fg); flex: none; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.6; min-height: 210px; padding: 14px; resize: vertical; tab-size: 2; width: 100%;
  }
  #gql-editor:focus { outline: none; }
  .gql-actions { border-bottom: 1px solid var(--line); flex: none; padding: 10px 14px; }
  #gql-run {
    background: var(--accent-dim); border: 0; border-radius: var(--radius); color: #fff;
    cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 15px;
  }
  #gql-run:hover { background: var(--accent); }
  #gql-examples { display: flex; flex: none; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .gql-ex {
    background: var(--bg-3); border: 1px solid var(--line); border-radius: 999px;
    color: var(--fg-dim); cursor: pointer; font: inherit; font-size: 11.5px; padding: 3px 11px;
  }
  .gql-ex:hover { border-color: var(--accent-dim); color: var(--fg); }
  #gql-schema {
    color: var(--fg-dim); font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    margin: 0; padding: 12px 14px 40px; white-space: pre; overflow-x: auto;
  }
  #gql-json {
    color: var(--fg); flex: 1; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    margin: 0; min-height: 0; overflow: auto; padding: 14px; white-space: pre;
  }
  #gql-json.error { color: #e06c75; }
  #gql-graph { display: block; flex: 1; min-height: 0; width: 100%; cursor: grab; touch-action: none; }
  .hidden { display: none !important; }

  .stats { color: var(--fg-faint); font-size: 12px; padding: 14px 16px 0; line-height: 1.7; }
  .stats b { color: var(--fg-dim); font-weight: 600; }

  /* ---------- responsive chrome ---------- */
  /* Off-canvas nav, the bottom tab bar and the mobile-only controls are all
     inert until a media query below turns them on. */
  .nav-toggle, .search-toggle, .drawer-head, .gql-panes, .toc-mobile { display: none; }
  #scrim { display: none; }
  /* `contents` so the search box is a direct flex child of the bar it sits in,
     wherever relayout() has parked it. */
  .search-slot { display: contents; }

  /* The right rail is a column on a wide screen and a section of the note on a
     narrow one. Hiding it would take the citations, backlinks and links out —
     the only way to walk the graph without the sidebar — with it. */
  aside.right.inline {
    background: none; border-left: 0; overflow: visible; width: 100%;
    max-width: 760px; margin: 0 auto; padding: 0 40px 90px;
  }
  aside.right.inline .rail-sec {
    border-top: 1px solid var(--line); margin-top: 0; padding-top: 16px;
  }
  aside.right.inline .rail-sec + .rail-sec { margin-top: 22px; }
  /* A table of contents printed below the prose it indexes is a dead control. */
  aside.right.inline .rail-sec[data-sec="toc"] { display: none; }
  #content.rail-inline article { padding-bottom: 12px; }

  @media (min-width: 761px) {
    aside.right.inline { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px; }
    aside.right.inline .rail-sec { margin-top: 0; }
    aside.right.inline .rail-sec + .rail-sec { margin-top: 0; }
    aside.right.inline .rail-sec[data-sec="sources"] { grid-column: 1 / -1; }
  }

  /* --- tablet: the rail moves inline, the sidebar stays --- */
  @media (max-width: 1100px) {
    main, main.wide, main.inline-rail { grid-template-columns: 240px minmax(0,1fr); }
  }

  /* --- stacked GraphQL: the result pane used to be display:none here --- */
  @media (max-width: 900px) {
    #gql-view.on { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); }
    .gql-panes {
      background: var(--bg-2); border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .gql-panes button {
      background: none; border: 0; border-bottom: 2px solid transparent; color: var(--fg-dim);
      cursor: pointer; font: inherit; font-size: 13px; padding: 12px 4px;
    }
    .gql-panes button.on { border-bottom-color: var(--accent); color: var(--fg); }
    .gql-left { border-right: 0; }
    #gql-view.pane-query .gql-right { display: none; }
    #gql-view.pane-result .gql-left { display: none; }
  }

  /* --- phone --- */
  @media (max-width: 760px) {
    :root { --header-h: 50px; }
    main, main.wide, main.inline-rail { grid-template-columns: minmax(0,1fr); }
    /* Room for the fixed tab bar, so nothing ever scrolls under it. */
    main { padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }

    header { gap: 8px; padding: 0 max(8px, env(safe-area-inset-left)) 0 max(8px, env(safe-area-inset-right)); }
    .brand { font-size: 15px; }
    .nav-toggle, .search-toggle { display: inline-flex; font-size: 17px; min-width: 42px; min-height: 38px; }
    #theme { min-width: 42px; min-height: 38px; font-size: 16px; }

    /* Tabs become a thumb-reachable bottom bar rather than competing with the
       brand and the search box for a 360px-wide top bar. */
    header nav {
      background: var(--bg-2); border-top: 1px solid var(--line);
      bottom: 0; display: grid; gap: 0; grid-template-columns: repeat(3, 1fr);
      left: 0; padding-bottom: env(safe-area-inset-bottom, 0px); position: fixed;
      right: 0; z-index: 40;
    }
    .tab { border-radius: 0; font-size: 12.5px; padding: 13px 4px; }
    .tab:hover { background: none; }
    .tab.on { background: none; box-shadow: inset 0 2px 0 var(--accent); color: var(--accent); }

    /* Sidebar as an off-canvas drawer: the whole index used to be display:none
       here, which left search filtering a list nobody could see. */
    aside.left {
      border-right: 1px solid var(--line); bottom: 0; left: 0;
      box-shadow: 2px 0 22px rgba(0, 0, 0, 0.4);
      padding: 0 0 calc(60px + env(safe-area-inset-bottom, 0px));
      position: fixed; top: var(--header-h); transform: translateX(-100%);
      transition: transform 0.22s ease; width: min(88vw, 330px); z-index: 60;
    }
    body.nav-open aside.left { transform: none; }
    #scrim {
      background: rgba(0, 0, 0, 0.5); display: block; inset: var(--header-h) 0 0 0;
      opacity: 0; pointer-events: none; position: fixed;
      transition: opacity 0.22s ease; z-index: 50;
    }
    body.nav-open #scrim { opacity: 1; pointer-events: auto; }
    .drawer-head {
      align-items: center; border-bottom: 1px solid var(--line); display: flex;
      gap: 10px; padding: 10px 12px 10px 16px;
    }
    .drawer-head .sec-title { flex: 1; padding: 0; }
    /* Overrides the `contents` the header slot needs, so this one can box. */
    #slot-drawer { display: block; padding: 12px 14px 4px; }
    #slot-drawer:empty { display: none; }
    #slot-drawer #search { width: 100%; }
    /* 16px or iOS Safari zooms the whole page on focus. */
    #search { font-size: 16px; padding: 9px 12px; }

    aside.left li a { font-size: 15px; padding: 11px 16px 11px 20px; }
    .sec-title { font-size: 11.5px; padding: 16px 16px 6px; }
    .count { font-size: 12px; }
    .stats { font-size: 12.5px; padding: 18px 16px 0; }

    article { padding: 20px 16px 26px; }
    article h1 { font-size: 25px; letter-spacing: -0.3px; }
    .summary { font-size: 15px; }
    .chips { margin-bottom: 18px; }
    .chip { font-size: 12.5px; padding: 4px 11px; }
    .prose { padding-top: 18px; }
    .prose h2 { font-size: 19px; margin-top: 26px; }
    .prose h3 { font-size: 16px; }
    .prose pre code { font-size: 12px; }
    .prose code { overflow-wrap: anywhere; }
    aside.right.inline { padding: 0 16px 30px; }
    .rail-list a, .toc a { font-size: 14.5px; }
    .rail-list li { margin-bottom: 9px; }
    .src { padding: 11px 13px; }
    .src .claim { font-size: 13.5px; }

    /* A jump list is only useful above the prose, so the inline rail drops its
       copy and the article carries a collapsed one instead. */
    .toc-mobile {
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); display: block; margin: 0 0 18px;
    }
    .toc-mobile > summary {
      color: var(--fg-dim); cursor: pointer; font-size: 13.5px;
      list-style: none; padding: 11px 13px;
    }
    .toc-mobile > summary::-webkit-details-marker { display: none; }
    .toc-mobile > summary::after { content: "▾"; float: right; }
    .toc-mobile[open] > summary::after { content: "▴"; }
    .toc-mobile ul.toc { padding: 0 13px 10px; }
    .toc-mobile .toc a { display: block; padding: 7px 0; }

    #gql-editor { font-size: 16px; min-height: 168px; }
    #gql-json { font-size: 12.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .gql-ex { font-size: 13px; padding: 6px 13px; }
    #gql-run { font-size: 14px; padding: 10px 18px; width: 100%; }

    .graph-legend { font-size: 11.5px; left: 10px; padding: 9px 11px; top: 10px; }
  }
</style>
</head>
<body>
<header>
  <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Browse notes"
          aria-expanded="false" aria-controls="sidebar">☰</button>
  <div class="brand">DPC <span>Zettelkasten</span></div>
  <nav>
    <button class="tab on" id="tab-notes">Notes</button>
    <button class="tab" id="tab-graph">Graph</button>
    <button class="tab" id="tab-gql">GraphQL</button>
  </nav>
  <div class="spacer"></div>
  <div class="search-slot" id="slot-header">
    <input id="search" type="search" placeholder="Search notes…  (/)" autocomplete="off">
  </div>
  <button class="icon-btn search-toggle" id="search-toggle" aria-label="Search notes">⌕</button>
  <button class="icon-btn" id="theme" aria-label="Switch theme">◐</button>
</header>

<div id="scrim"></div>

<main>
  <aside class="left" id="sidebar">
    <div class="drawer-head">
      <div class="sec-title">Browse</div>
      <button class="icon-btn" id="nav-close" aria-label="Close navigation">✕</button>
    </div>
    <div class="search-slot" id="slot-drawer"></div>
    <div id="nav"></div>
    <div class="stats" id="stats"></div>
  </aside>

  <div id="content"><article id="note"></article></div>

  <div id="graph-view">
    <canvas id="graph"></canvas>
    <div class="graph-legend">
      <div class="row"><span class="dot" style="background:var(--moc)"></span> Map of Content</div>
      <div class="row"><span class="dot" style="background:var(--accent)"></span> Concept note</div>
      <div class="row hint" id="graph-hint">drag to pan · scroll to zoom · click a node</div>
      <div class="row"><button class="icon-btn" id="graph-fit">Fit to screen</button></div>
    </div>
  </div>

  <div id="gql-view" class="pane-query">
    <div class="gql-panes" id="gql-panes">
      <button class="on" data-pane="query">Query</button>
      <button data-pane="result">Result</button>
    </div>
    <div class="gql-left">
      <div class="pane-h">Query <span class="hint">⌘/Ctrl + ⏎</span></div>
      <textarea id="gql-editor" spellcheck="false" autocomplete="off"></textarea>
      <div class="gql-actions"><button id="gql-run">▶&nbsp; Run query</button></div>
      <div class="pane-h">Examples</div>
      <div id="gql-examples"></div>
      <div class="pane-h">Schema</div>
      <pre id="gql-schema"></pre>
    </div>
    <div class="gql-right">
      <div class="pane-h">
        Result <span class="hint" id="gql-count"></span>
        <span id="gql-toggle" class="seg">
          <button class="on" data-view="json">JSON</button>
          <button data-view="graph">Graph</button>
        </span>
      </div>
      <pre id="gql-json"></pre>
      <canvas id="gql-graph" class="hidden"></canvas>
    </div>
  </div>

  <aside class="right" id="rail"></aside>
</main>

<script>
/*__ZKGRAPHQL__*/

const NOTES = /*__NOTES__*/null;
const META = /*__META__*/null;

const $ = (sel) => document.querySelector(sel);
const ids = Object.keys(NOTES);
const byTitle = (a, b) => NOTES[a].title.localeCompare(NOTES[b].title);

/* ------------------------------------------------------------------ nav */
function renderNav(filter) {
  const q = (filter || "").trim().toLowerCase();
  const hit = q ? new Set(ids.filter((id) => NOTES[id].text.includes(q))) : null;
  const keep = (id) => !hit || hit.has(id);

  const item = (id) => {
    const cls = (NOTES[id].type === "moc" ? "moc " : "") + (id === current ? "on" : "");
    return `<li><a class="${cls}" href="#/${id}">${esc(NOTES[id].title)}</a></li>`;
  };
  const group = (label, list, opts) => {
    if (!list.length) return "";
    const sub = opts && opts.sub ? " sub" : "";
    const href = opts && opts.href ? ` href="#/${opts.href}"` : "";
    const head = href
      ? `<a class="sec-link"${href}>${label}</a>`
      : label;
    return `<div class="sec-title${sub}">${head}<span class="count">${list.length}</span></div>` +
           `<ul>${list.map(item).join("")}</ul>`;
  };

  // Maps first, then one group per cluster — the same order as the root map.
  let html = group("Maps of Content", META.mocOrder.filter(keep));
  let shown = META.mocOrder.filter(keep).length;
  for (const c of META.clusters) {
    const list = c.notes.filter(keep);
    shown += list.length;
    html += group(esc(c.title), list, { sub: true, href: c.moc || null });
  }
  if (!shown) html = `<div class="empty">No notes match “${esc(q)}”.</div>`;
  $("#nav").innerHTML = html;
}

function renderStats() {
  $("#stats").innerHTML =
    `<b>${META.noteCount}</b> notes · <b>${META.linkCount}</b> links<br>` +
    `<b>${META.citationCount}</b> citations from <b>${META.repos.length}</b> repos<br>` +
    `content as of ${esc(META.updated)}`;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ----------------------------------------------------------------- note */
let current = null;

function renderNote(id) {
  const n = NOTES[id];
  if (!n) {
    $("#note").innerHTML = `<h1>Not found</h1><p>No note with id <code>${esc(id)}</code>.</p>`;
    $("#rail").innerHTML = "";
    return;
  }
  current = id;

  const chips = [`<span class="chip type-${n.type}">${n.type === "moc" ? "Map of Content" : "Concept"}</span>`]
    .concat((n.tags || []).map((t) => `<a class="chip" href="#" data-tag="${esc(t)}">#${esc(t)}</a>`))
    .join("");

  const toc = n.toc.filter((h) => h.level <= 3);
  const tocItems = toc
    .map((h) => `<li class="lvl-${h.level}"><a href="#${h.slug}">${esc(h.text)}</a></li>`)
    .join("");

  $("#note").innerHTML =
    `<div class="kicker">${esc(n.id)}</div>` +
    `<h1>${esc(n.title)}</h1>` +
    (n.summary ? `<p class="summary">${esc(n.summary)}</p>` : "") +
    `<div class="chips">${chips}</div>` +
    // Phone-only: the rail's jump list is no use once it has been pushed below
    // the prose, so the article carries a collapsed copy above it instead.
    (toc.length > 1
      ? `<details class="toc-mobile"><summary>On this page · ${toc.length}</summary>` +
        `<ul class="toc">${tocItems}</ul></details>`
      : "") +
    `<div class="prose">${n.html}</div>`;

  const sources = n.sources.length
    ? n.sources.map((s) =>
        `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">` +
        `<span class="claim">${esc(s.claim)}</span>` +
        `<span class="loc">${esc(s.repo)} · ${esc(s.path).replace(/\//g, "/<wbr>")}${s.lines ? ":" + esc(s.lines) : ""} @ <span class="sha">${esc(s.shortRef)}</span></span></a>`
      ).join("")
    : `<div class="rail-empty">No citations.</div>`;

  const linkList = (list) => list.length
    ? `<ul class="rail-list">${list.map((t) => {
        const target = NOTES[t];
        const cls = target && target.type === "moc" ? ' class="moc"' : "";
        return `<li><a href="#/${t}"${cls}>${esc(target ? target.title : t)}</a></li>`;
      }).join("")}</ul>`
    : `<div class="rail-empty">None.</div>`;

  // Sectioned rather than a flat run of headings: when the rail is inlined
  // under the note on a narrow screen, each section needs its own box, and the
  // jump list needs to be droppable on its own.
  const railSec = (key, head, body) =>
    `<section class="rail-sec" data-sec="${key}"><div class="rail-h">${head}</div>${body}</section>`;

  $("#rail").innerHTML =
    railSec("sources", `Sources of truth <span class="count">${n.sources.length}</span>`, sources) +
    (toc.length > 1 ? railSec("toc", "On this page", `<ul class="toc">${tocItems}</ul>`) : "") +
    railSec("backlinks", `Backlinks <span class="count">${n.backlinks.length}</span>`, linkList(n.backlinks)) +
    railSec("links", `Links out <span class="count">${n.links.length}</span>`, linkList(n.links)) +
    railSec("file", "Source file",
      `<ul class="rail-list"><li><a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">${esc(n.sourcePath)}</a></li></ul>`);

  $("#content").scrollTop = 0;
  renderNav($("#search").value);
}

/* ---------------------------------------------------------------- graph */
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

/* A self-contained force-directed view over a set of note ids. Used twice: once
   for the whole collection, once for whatever a GraphQL query returned. */
function makeGraph(canvas, opts) {
  opts = opts || {};
  const ctx = canvas.getContext("2d");
  let nodes = [], edges = [], index = {};
  let view = { x: 0, y: 0, k: 1 };
  // Wider than the old 0.25–3: a 50-node graph on a phone has to zoom further
  // out than that before it fits at all.
  const clampK = (k) => Math.max(0.1, Math.min(4, k));
  let hover = null, ticks = 0, seeded = false, autoFit = true;

  function setData(noteIds) {
    const set = new Set(noteIds.filter((id) => NOTES[id]));
    nodes = [...set].map((id) => ({
      id,
      moc: NOTES[id].type === "moc",
      deg: NOTES[id].links.length + NOTES[id].backlinks.length,
    }));
    index = {};
    nodes.forEach((n, i) => { index[n.id] = i; });
    edges = [];
    for (const n of nodes) for (const t of NOTES[n.id].links) {
      if (index[t] !== undefined) edges.push([index[n.id], index[t]]);
    }
    seeded = false; ticks = 0; autoFit = true;
    view = { x: 0, y: 0, k: 1 };
  }

  function seed() {
    const w = canvas.clientWidth || 800, h = canvas.clientHeight || 600;
    nodes.forEach((n, i) => {
      // Deterministic spiral seed: same layout every load, no RNG.
      const a = i * 2.399963;
      const r = 38 * Math.sqrt(i + 1);
      n.x = w / 2 + r * Math.cos(a);
      n.y = h / 2 + r * Math.sin(a);
      n.vx = 0; n.vy = 0;
    });
    seeded = true;
  }

  function step() {
    // Ideal edge length, scaled by node count so the graph keeps breathing room
    // as the set grows rather than collapsing into a denser ball.
    const K = 78 + Math.sqrt(Math.max(nodes.length, 4)) * 11;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy || 0.01;
        if (d2 > 1000000) continue;
        const f = (K * K) / d2;
        const d = Math.sqrt(d2);
        const fx = (dx / d) * f, fy = (dy / d) * f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for (const [i, j] of edges) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - K) * 0.045;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;
    for (const n of nodes) {
      n.vx += (cx - n.x) * 0.0022;
      n.vy += (cy - n.y) * 0.0022;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += Math.max(-18, Math.min(18, n.vx));
      n.y += Math.max(-18, Math.min(18, n.vy));
    }
  }

  function radius(n) { return 4.5 + Math.min(8, n.deg * 0.62); }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr; canvas.height = h * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (!nodes.length) {
      ctx.fillStyle = css("--fg-faint");
      ctx.font = `13px ${css("--sans") || "sans-serif"}`;
      ctx.textAlign = "center";
      ctx.fillText(opts.emptyText || "Nothing to show.", w / 2, h / 2);
      return;
    }

    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.k, view.k);

    const line = css("--line"), accent = css("--accent"), moc = css("--moc"), fg = css("--fg-dim");
    const near = hover === null ? null : new Set([hover].concat(
      edges.filter(([i, j]) => i === hover || j === hover).map(([i, j]) => (i === hover ? j : i))
    ));

    ctx.lineWidth = 1;
    for (const [i, j] of edges) {
      const lit = near && near.has(i) && near.has(j);
      ctx.strokeStyle = lit ? accent : line;
      ctx.globalAlpha = near ? (lit ? 0.9 : 0.18) : 0.55;
      ctx.beginPath();
      ctx.moveTo(nodes[i].x, nodes[i].y);
      ctx.lineTo(nodes[j].x, nodes[j].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const r = radius(n);
      const dim = near && !near.has(i);
      ctx.globalAlpha = dim ? 0.25 : 1;
      ctx.fillStyle = n.moc ? moc : accent;
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
      if (n.id === current) {
        ctx.strokeStyle = fg; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 3.5, 0, Math.PI * 2); ctx.stroke();
      }
      if (view.k > 0.62 || n.moc || i === hover || nodes.length <= 40) {
        ctx.globalAlpha = dim ? 0.3 : 1;
        ctx.fillStyle = fg;
        ctx.font = `${i === hover ? 700 : 400} ${11 / Math.max(1, view.k * 0.85)}px ${css("--sans") || "sans-serif"}`;
        ctx.textAlign = "center";
        ctx.fillText(NOTES[n.id].title, n.x, n.y + r + 12);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* Fit every node into the canvas. Without this the layout is sized in
     absolute pixels around the canvas centre, so on a phone most of the graph
     settles outside the viewport and the view looks empty or half-drawn. */
  function fit() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!nodes.length || !w || !h) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of nodes) {
      const r = radius(n) + 34; // the label sits below the node, inside this
      if (n.x - r < minX) minX = n.x - r;
      if (n.x + r > maxX) maxX = n.x + r;
      if (n.y - r < minY) minY = n.y - r;
      if (n.y + r > maxY) maxY = n.y + r;
    }
    const m = 14;
    const k = clampK(Math.min((w - m * 2) / (maxX - minX || 1), (h - m * 2) / (maxY - minY || 1)));
    view.k = k;
    view.x = (w - (maxX - minX) * k) / 2 - minX * k;
    view.y = (h - (maxY - minY) * k) / 2 - minY * k;
  }

  function tick(active) {
    if (!active) return;
    if (!seeded) seed();
    if (ticks < 700) {
      step(); ticks++;
      // Re-frame while the simulation is still spreading out, but stop the
      // moment the reader pans or zooms — their view wins from then on.
      if (autoFit && (ticks % 12 === 0 || ticks === 700)) fit();
    }
    draw();
  }

  function toCoords(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left - view.x) / view.k,
      y: (ev.clientY - rect.top - view.y) / view.k,
    };
  }
  function pick(pt) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i], r = radius(n) + 4;
      if ((pt.x - n.x) ** 2 + (pt.y - n.y) ** 2 < r * r) return i;
    }
    return null;
  }

  /* Pointer events, not mouse events: a phone fires neither mousedown nor
     wheel, which left the graph a picture you could not pan, zoom or aim at. */
  const pointers = new Map();
  let dragging = false, last = null, moved = 0, pinch = null, penType = "mouse";

  function zoomAt(k, sx, sy) {
    k = clampK(k);
    const rect = canvas.getBoundingClientRect();
    const mx = sx - rect.left, my = sy - rect.top;
    view.x = mx - (mx - view.x) * (k / view.k);
    view.y = my - (my - view.y) * (k / view.k);
    view.k = k;
    autoFit = false;
  }

  function pinchState() {
    const [a, b] = [...pointers.values()];
    if (!a || !b) return null;
    return {
      dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    penType = e.pointerType;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { dragging = true; moved = 0; last = { x: e.clientX, y: e.clientY }; }
    else { dragging = false; pinch = pinchState(); }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size >= 2) {
      const now = pinchState();
      if (pinch && now) {
        // Scale about the midpoint, then follow the midpoint itself so a
        // two-finger drag pans at the same time.
        zoomAt(view.k * (now.dist / pinch.dist), pinch.cx, pinch.cy);
        view.x += now.cx - pinch.cx;
        view.y += now.cy - pinch.cy;
        moved += 20;
      }
      pinch = now;
      return;
    }

    if (dragging && last) {
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      view.x += dx; view.y += dy;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 6) autoFit = false;
      last = { x: e.clientX, y: e.clientY };
    } else if (e.pointerType === "mouse") {
      const h = pick(toCoords(e));
      if (h !== hover) { hover = h; canvas.style.cursor = h === null ? "grab" : "pointer"; }
    }
  });

  function release(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!pointers.size) { dragging = false; last = null; }
  }
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  canvas.addEventListener("click", (e) => {
    if (moved > 8) return; // the tail of a pan, not a tap
    const i = pick(toCoords(e));
    if (penType !== "mouse") {
      // Touch has no hover, so a blind tap would open a node whose label may
      // not even be drawn. First tap names it and lights its edges, second
      // tap opens it.
      if (i === null) { hover = null; return; }
      if (hover !== i) { hover = i; return; }
    }
    // Setting the hash is enough — route() switches back to the note view.
    if (i !== null) location.hash = "#/" + nodes[i].id;
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(view.k * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
  }, { passive: false });

  return {
    setData, tick,
    reheat: () => { seeded = false; ticks = 0; autoFit = true; },
    refit: () => { if (autoFit) fit(); },
    fitNow: () => { autoFit = true; hover = null; fit(); },
    size: () => nodes.length,
  };
}

const mainGraph = makeGraph($("#graph"));
mainGraph.setData(ids);

/* --------------------------------------------------------------- graphql */
/* A small GraphQL engine over the note graph. Supports the query subset this
   page needs: named or anonymous queries, nested selection sets, field
   arguments, aliases, and variables declared inline. No mutations,
   subscriptions, fragments, or directives — the schema is read-only. */

const GQL = ZKGraphQL.createEngine({ notes: NOTES, meta: META });

const GQL_EXAMPLES = [
  { label: "The map of maps", q:
`# Every Map of Content and what lives under it
{
  mocs {
    title
    summary
    concepts: backlinks { id }
  }
}` },
  { label: "One cluster", q:
`# Every concept that calls the domain model home
{
  notes(moc: "moc-faction-domain-model") {
    title
    summary
    degree
  }
}` },
  { label: "Most connected", q:
`# The hubs of the graph
{
  notes(orderBy: degree, first: 8) {
    title
    degree
    linkCount
    backlinkCount
  }
}` },
  { label: "Follow the links", q:
`# Two hops out from faction power
{
  note(id: "faction-power") {
    title
    links { title links { title } }
    backlinks { title }
  }
}` },
  { label: "Citations", q:
`# What proves the claims about power
{
  note(id: "demesne-limit") {
    title
    sources { repo path lines claim url }
  }
}` },
  { label: "By repository", q:
`# Which repos the collection is grounded in
{
  repositories {
    name
    citationCount
    noteCount
    pinnedRefs
  }
}` },
  { label: "Whole graph", q:
`# Every note and its outgoing edges — draw this one
{
  notes {
    id
    title
    type
    links { id }
  }
}` },
  { label: "Stats", q:
`{
  stats {
    noteCount mocCount conceptCount
    citationCount linkCount repositoryCount
    updated
  }
}` },
];

const gqlGraph = makeGraph($("#gql-graph"), { emptyText: "Run a query that returns notes." });
let gqlResultView = "json";

function gqlRun(fromUser) {
  const src = $("#gql-editor").value;
  const out = $("#gql-json");
  try {
    const { data, notes } = GQL.execute(src);
    out.classList.remove("error");
    out.textContent = JSON.stringify({ data }, null, 2);
    gqlGraph.setData(notes);
    $("#gql-count").textContent = notes.length
      ? `${notes.length} note${notes.length === 1 ? "" : "s"} — see Graph`
      : "no notes in result";
  } catch (e) {
    out.classList.add("error");
    out.textContent = "✕ " + e.message + (e.at !== undefined ? `\n\n  at character ${e.at}` : "");
    gqlGraph.setData([]);
    $("#gql-count").textContent = "error";
  }
  // Stacked layout: running a query and staying on the editor would hide the
  // result the reader just asked for.
  if (fromUser && MQ_GQL.matches) gqlSetPane("result");
}

/* Which of the two stacked panes is showing. Inert on a wide screen, where
   both are side by side and the classes match nothing. */
function gqlSetPane(pane) {
  const view = $("#gql-view");
  view.classList.toggle("pane-query", pane === "query");
  view.classList.toggle("pane-result", pane === "result");
  document.querySelectorAll("#gql-panes button").forEach((b) =>
    b.classList.toggle("on", b.dataset.pane === pane));
  if (pane === "result" && gqlResultView === "graph") gqlGraph.reheat();
}

function gqlSetResultView(v) {
  gqlResultView = v;
  $("#gql-json").classList.toggle("hidden", v !== "json");
  $("#gql-graph").classList.toggle("hidden", v !== "graph");
  document.querySelectorAll("#gql-toggle button").forEach((b) =>
    b.classList.toggle("on", b.dataset.view === v));
  if (v === "graph") gqlGraph.reheat();
}

function gqlInit() {
  $("#gql-schema").textContent = GQL.sdl();
  $("#gql-examples").innerHTML = GQL_EXAMPLES
    .map((e, i) => `<button class="gql-ex" data-ex="${i}">${esc(e.label)}</button>`).join("");
  $("#gql-examples").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ex]");
    if (!b) return;
    $("#gql-editor").value = GQL_EXAMPLES[+b.dataset.ex].q;
    gqlRun(true);
  });
  $("#gql-run").onclick = () => gqlRun(true);
  $("#gql-panes").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pane]");
    if (b) gqlSetPane(b.dataset.pane);
  });
  $("#gql-toggle").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (b) gqlSetResultView(b.dataset.view);
  });
  $("#gql-editor").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); gqlRun(true); }
    if (e.key === "Tab") {
      e.preventDefault();
      const el = e.target, p = el.selectionStart;
      el.value = el.value.slice(0, p) + "  " + el.value.slice(el.selectionEnd);
      el.selectionStart = el.selectionEnd = p + 2;
    }
  });
  $("#gql-editor").value = GQL_EXAMPLES[0].q;
  gqlRun();
}

/* ----------------------------------------------------- responsive layout */
/* Two controls have no room of their own on a phone, so they are moved rather
   than hidden: the search box lives in the drawer, and the right rail becomes
   a section of the note. Both used to be display:none below their breakpoint,
   which is what made the collection unnavigable on a phone — search filtered
   an invisible list, and citations and backlinks simply vanished. */
const MQ_PHONE = window.matchMedia("(max-width: 760px)");
const MQ_RAIL = window.matchMedia("(max-width: 1100px)");
const MQ_GQL = window.matchMedia("(max-width: 900px)");

function relayout() {
  const search = $("#search");
  const slot = MQ_PHONE.matches ? $("#slot-drawer") : $("#slot-header");
  if (search.parentNode !== slot) slot.appendChild(search);
  if (!MQ_PHONE.matches) closeNav();

  const rail = $("#rail"), content = $("#content"), main = document.querySelector("main");
  const home = MQ_RAIL.matches ? content : main;
  if (rail.parentNode !== home) home.appendChild(rail);
  rail.classList.toggle("inline", MQ_RAIL.matches);
  content.classList.toggle("rail-inline", MQ_RAIL.matches);
  main.classList.toggle("inline-rail", MQ_RAIL.matches);

  if (!MQ_GQL.matches) gqlSetPane("query");
}

/* ---------------------------------------------------------------- drawer */
function setNav(open) {
  document.body.classList.toggle("nav-open", open);
  $("#nav-toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
const openNav = () => setNav(true);
const closeNav = () => setNav(false);

$("#nav-toggle").onclick = () => setNav(!document.body.classList.contains("nav-open"));
$("#nav-close").onclick = closeNav;
$("#scrim").onclick = closeNav;
$("#search-toggle").onclick = () => { openNav(); $("#search").focus(); };
// Re-picking the note already open changes no hash, so route() never fires.
$("#nav").addEventListener("click", (e) => { if (e.target.closest("a")) closeNav(); });

/* ----------------------------------------------------------------- tabs */
let tab = "notes";
function showTab(which) {
  tab = which;
  $("#content").classList.toggle("hidden", which !== "notes");
  $("#graph-view").classList.toggle("on", which === "graph");
  $("#gql-view").classList.toggle("on", which === "gql");
  // Both full-width views reclaim the right rail's space.
  document.querySelector("main").classList.toggle("wide", which !== "notes");
  for (const [id, name] of [["#tab-notes", "notes"], ["#tab-graph", "graph"], ["#tab-gql", "gql"]]) {
    $(id).classList.toggle("on", which === name);
  }
  if (which === "graph") mainGraph.reheat();
  if (which === "gql") { gqlInitOnce(); gqlGraph.reheat(); }
}
const showNotes = () => showTab("notes");
const showGraph = () => showTab("graph");

let gqlReady = false;
function gqlInitOnce() { if (!gqlReady) { gqlReady = true; gqlInit(); } }

$("#tab-notes").onclick = showNotes;
$("#tab-graph").onclick = showGraph;
$("#tab-gql").onclick = () => showTab("gql");

/* --------------------------------------------------------------- wiring */
function route() {
  closeNav();
  const hash = location.hash.replace(/^#\/?/, "");
  const id = hash.split("#")[0] || META.home;
  const anchor = hash.split("#")[1];
  if (NOTES[id]) {
    const changed = id !== current;
    if (changed) renderNote(id);
    if (changed || tab === "notes") showNotes();
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } else if (hash && !document.getElementById(hash)) {
    renderNote(id);
  }
}
window.addEventListener("hashchange", route);

$("#search").addEventListener("input", (e) => renderNav(e.target.value));
// The results render inside the drawer, so searching has to open it.
$("#search").addEventListener("focus", () => { if (MQ_PHONE.matches) openNav(); });
// A jump list that stays open after the jump just covers the heading it moved to.
$("#note").addEventListener("click", (e) => {
  const link = e.target.closest(".toc-mobile a");
  if (link) link.closest("details").open = false;
});
$("#graph-fit").onclick = () => mainGraph.fitNow();
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA"].includes((document.activeElement || {}).tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#search").focus(); }
  if (e.key === "Escape") { closeNav(); $("#search").value = ""; $("#search").blur(); renderNav(""); }
  if (typing) return;
  if (e.key === "g") showGraph();
  if (e.key === "q") showTab("gql");
  if (e.key === "n") showNotes();
});
document.addEventListener("click", (e) => {
  const tag = e.target.closest("[data-tag]");
  if (tag) { e.preventDefault(); $("#search").value = tag.dataset.tag; renderNav(tag.dataset.tag); showNotes(); }
});

for (const mq of [MQ_PHONE, MQ_RAIL, MQ_GQL]) {
  const on = mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq);
  on(relayout);
}
// A rotation or a keyboard opening changes the canvas size, and a graph framed
// for the old one is off-centre in the new.
window.addEventListener("resize", () => { mainGraph.refit(); gqlGraph.refit(); });

// Touch devices get no hover and no wheel, so the legend must not promise them.
if (window.matchMedia("(hover: none)").matches) {
  $("#graph-hint").textContent = "drag to pan · pinch to zoom · tap a node twice";
}

$("#theme").onclick = () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
  try { localStorage.setItem("zk-theme", light ? "dark" : "light"); } catch (_) {}
};
// Dark is the default regardless of the OS preference; only an explicit choice
// made with the toggle overrides it.
try {
  const saved = localStorage.getItem("zk-theme");
  document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
} catch (_) {
  document.documentElement.setAttribute("data-theme", "dark");
}

function loop() {
  mainGraph.tick(tab === "graph");
  gqlGraph.tick(tab === "gql" && gqlResultView === "graph");
  requestAnimationFrame(loop);
}

renderStats();
relayout();
renderNote(location.hash.replace(/^#\/?/, "").split("#")[0] || META.home);
route();
loop();
</script>
</body>
</html>
