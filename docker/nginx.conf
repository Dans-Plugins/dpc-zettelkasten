server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html carries its own <meta charset>, but dataset.json is fetched by
    # script and the graph and GraphQL tabs both break on mis-decoded text.
    charset utf-8;

    # Roughly 370 KB of HTML and 280 KB of JSON, both highly compressible.
    # text/html is compressed by nginx unconditionally and naming it here only
    # produces a duplicate-MIME-type warning.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # The explorer is regenerated whenever a note changes and the filenames
    # never change with it, so a long immutable max-age would strand readers on
    # a stale collection. Short, and revalidated.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cheap endpoint for the container healthcheck. Fetching / would work, but
    # it would pull the whole 370 KB explorer every 30 seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # dataset.json and the query engine are published for other origins to
    # consume — dansplugins.com is to grow a knowledge-base section on them.
    #
    # The policy is "*" deliberately. Both files are public artifacts of a
    # public repository, served without credentials, and CORS governs what a
    # *reader's* browser will hand to a script rather than protecting the data
    # itself. There are no credentials to leak and nothing here is writable, so
    # an allowlist would buy nothing and would need editing every time a
    # consumer appeared. This is a decision, not a missing setting.
    location ~ ^/(dataset\.json|lib/zk-graphql\.js)$ {
        # nginx does not inherit add_header once a nested level sets any of its
        # own, so the two headers from the server block are repeated here
        # rather than inherited. Dropping them would silently un-set them.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Length "0";
            return 204;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
