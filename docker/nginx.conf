server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html carries its own <meta charset>, but dataset.json is fetched by
    # script and the graph and GraphQL tabs both break on mis-decoded text.
    charset utf-8;

    # Roughly 370 KB of HTML and 280 KB of JSON, both highly compressible.
    # text/html is compressed by nginx unconditionally and naming it here only
    # produces a duplicate-MIME-type warning.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # The explorer is regenerated whenever a note changes and the filenames
    # never change with it, so a long immutable max-age would strand readers on
    # a stale collection. Short, and revalidated.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cheap endpoint for the container healthcheck. Fetching / would work, but
    # it would pull the whole 370 KB explorer every 30 seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
