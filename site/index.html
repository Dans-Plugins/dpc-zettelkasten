=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> can gain and lose fields without anyone having to reason about whether a change breaks the reading of a five-year-old JSON file. The legacy classes are frozen by definition, because the format they describe will never change again.</p>\n<h2 id=\"related\">Related</h2>\n<p>The migrator writes through the same repositories as everything else, so migrated data goes through the same validation and gets the same <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> version columns as data created today.</p>", "id": "legacy-data-migration", "links": ["jooq-persistence", "faction", "optimistic-locking"], "sourcePath": "notes/concepts/legacy-data-migration.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/legacy-data-migration.md", "sources": [{"claim": "When the stored config version starts with v4, the plugin takes a backup, writes migrateMf4 into the config, logs instructions, and shuts the server down instead of migrating immediately.", "label": "Medieval-Factions/MedievalFactions.kt:126-141", "lines": "126-141", "path": "src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt#L126-L141"}, {"claim": "A dedicated migrator class exposes backup and migrate entry points and has private per-record methods for config, players, factions, claimed chunks and locked blocks.", "label": "Medieval-Factions/MfLegacyDataMigrator.kt:37-47", "lines": "37-47", "path": "src/main/kotlin/com/dansplugins/factionsystem/legacy/MfLegacyDataMigrator.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/legacy/MfLegacyDataMigrator.kt#L37-L47"}], "summary": "Version 4's flat JSON files are backed up and read once into the database, behind a deliberate server shutdown that forces the operator to configure storage first.", "tags": ["medieval-factions", "architecture", "persistence"], "text": "legacy data migration version 4's flat json files are backed up and read once into the database, behind a deliberate server shutdown that forces the operator to configure storage first. \nmedieval factions 4 stored its data in flat json files. version 5 stores it in a\ndatabase (see [[jooq-persistence]]). the `legacy` package exists to carry a\nversion 4 server across that gap exactly once.\n\n## the deliberate shutdown\n\nthe interesting decision is what happens on first boot after the upgrade. on\ndetecting a `v4.` version string in the config, the plugin does *not* migrate.\nit:\n\n1. backs up the old data files.\n2. writes fresh defaults and sets `migratemf4: true`.\n3. logs that the server is shutting down for migration, and that a database\n   should be configured now if one is wanted.\n4. calls `server.shutdown()`.\n\nmigration then runs on the *next* start. this costs the operator a restart and\nbuys something worth more: a chance to point `database.url` at mysql before any\ndata is written. migrating first and asking later would strand every server on\nthe default embedded h2 file, and there is no second migration to move them.\n\nthe forced stop is also honest about risk. migration is irreversible; a server\nthat hits it unaware would otherwise discover the change mid-session with\nplayers connected.\n\n## legacy records are separate types\n\n`mflegacyfaction`, `mflegacyclaimedchunk`, `mflegacygate`,\n`mflegacylockedblock`, `mflegacypowerrecord`, `mflegacyactivityrecord`,\n`mflegacylocation` mirror the version 4 json shapes rather than reusing the\ncurrent domain classes.\n\nkeeping them separate is what lets the current model evolve freely — [[faction]]\ncan gain and lose fields without anyone having to reason about whether a change\nbreaks the reading of a five-year-old json file. the legacy classes are frozen by\ndefinition, because the format they describe will never change again.\n\n## related\n\nthe migrator writes through the same repositories as everything else, so\nmigrated data goes through the same validation and gets the same\n[[optimistic-locking]] version columns as data created today.\n", "title": "Legacy Data Migration", "toc": [{"level": 2, "slug": "the-deliberate-shutdown", "text": "The deliberate shutdown"}, {"level": 2, "slug": "legacy-records-are-separate-types", "text": "Legacy records are separate types"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "locked-block": {"backlinks": ["medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "optimistic-locking"], "html": "<p>A lock protects one block — typically a chest or door — for one player, with an explicit list of other players allowed to use it.</p>\n<h2 id=\"owned-by-a-player-not-a-faction\">Owned by a player, not a faction</h2>\n<p>This is the notable thing about the design: a locked block belongs to an <code>MfPlayerId</code>, not an <code>MfFactionId</code>. Protection is personal and survives changes of faction. A member can secure their own chest inside their faction's <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">claim</a> against their own faction-mates, and keep it when they leave.</p>\n<p>Land ownership and container ownership are therefore two independent protection systems that both run on every block interaction. <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> governs the first; the accessor list governs the second.</p>\n<h2 id=\"chunk-coordinates-are-denormalised\">Chunk coordinates are denormalised</h2>\n<p>The record stores <code>chunkX</code> and <code>chunkZ</code> alongside the full block position, even though both are derivable from it by integer division. This is an index: the common query is &quot;which locks exist in this chunk?&quot;, asked whenever a chunk's ownership changes or a player interacts within it. Storing the chunk lets that be a lookup rather than a scan over every lock in the world.</p>\n<h2 id=\"typed-unlock-result\">Typed unlock result</h2>\n<p><code>MfUnlockResult</code> gives unlocking a typed outcome — <code>SUCCESS</code>, <code>NOT_LOCKED</code>, or <code>FAILURE</code> — so a caller can tell &quot;there was nothing to unlock&quot; apart from &quot;the unlock was refused&quot; and produce the right message for each. Compare the broader <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> failure model, which reaches for <code>Result4k</code> to make the same distinction.</p>\n<h2 id=\"related\">Related</h2>\n<p>Locks are among the records carried over by <a class=\"wl\" href=\"#/legacy-data-migration\" data-id=\"legacy-data-migration\">Legacy Data Migration</a>.</p>", "id": "locked-block", "links": ["claimed-chunk", "faction-permission", "service-layer", "legacy-data-migration"], "sourcePath": "notes/concepts/locked-block.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/locked-block.md", "sources": [{"claim": "A locked block records an id, version, block position, chunk x and z, the owning player id, and a list of accessor player ids.", "label": "Medieval-Factions/MfLockedBlock.kt:6-17", "lines": "6-17", "path": "src/main/kotlin/com/dansplugins/factionsystem/locks/MfLockedBlock.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/locks/MfLockedBlock.kt#L6-L17"}, {"claim": "The unlock result is an enum of SUCCESS, NOT_LOCKED and FAILURE rather than a boolean.", "label": "Medieval-Factions/MfUnlockResult.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/locks/MfUnlockResult.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/locks/MfUnlockResult.kt"}], "summary": "Per-player protection on a single block, with an explicit accessor list — independent of faction land ownership.", "tags": ["medieval-factions", "domain-model", "protection"], "text": "locked block per-player protection on a single block, with an explicit accessor list — independent of faction land ownership. \na lock protects one block — typically a chest or door — for one player, with an\nexplicit list of other players allowed to use it.\n\n## owned by a player, not a faction\n\nthis is the notable thing about the design: a locked block belongs to an\n`mfplayerid`, not an `mffactionid`. protection is personal and survives changes\nof faction. a member can secure their own chest inside their faction's\n[[claimed-chunk|claim]] against their own faction-mates, and keep it when they\nleave.\n\nland ownership and container ownership are therefore two independent protection\nsystems that both run on every block interaction. [[faction-permission]] governs\nthe first; the accessor list governs the second.\n\n## chunk coordinates are denormalised\n\nthe record stores `chunkx` and `chunkz` alongside the full block position, even\nthough both are derivable from it by integer division. this is an index: the\ncommon query is \"which locks exist in this chunk?\", asked whenever a chunk's\nownership changes or a player interacts within it. storing the chunk lets that\nbe a lookup rather than a scan over every lock in the world.\n\n## typed unlock result\n\n`mfunlockresult` gives unlocking a typed outcome — `success`, `not_locked`, or\n`failure` — so a caller can tell \"there was nothing to unlock\" apart from \"the\nunlock was refused\" and produce the right message for each. compare the broader\n[[service-layer]] failure model, which reaches for `result4k` to make the same\ndistinction.\n\n## related\n\nlocks are among the records carried over by [[legacy-data-migration]].\n", "title": "Locked Block", "toc": [{"level": 2, "slug": "owned-by-a-player-not-a-faction", "text": "Owned by a player, not a faction"}, {"level": 2, "slug": "chunk-coordinates-are-denormalised", "text": "Chunk coordinates are denormalised"}, {"level": 2, "slug": "typed-unlock-result", "text": "Typed unlock result"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "mailboxes": {"backlinks": ["dpc-mc-server", "moc-medieval-factions", "moc-plugin-ecosystem", "notification"], "html": "<p>Mailboxes is a standalone plugin: persistent player-to-player mail, with items attachable to a message. It has no dependency on <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a>. The relationship runs the other way — the flagship uses it when it is present.</p>\n<h2 id=\"a-deliberate-api-package\">A deliberate API package</h2>\n<p>The <code>externalapi</code> package is the notable design choice. Rather than letting other plugins reach into <code>Mailbox</code> and <code>Message</code> directly, Mailboxes exposes <code>MailboxesAPI</code> plus wrapper types <code>M_Mailbox</code> and <code>M_Message</code>.</p>\n<p>The <code>M_</code> prefix marks the boundary: those are the types other plugins are allowed to hold. <code>getMailbox</code> and <code>getMessage</code> wrap the internal object on the way out, so internal classes can be refactored without breaking consumers.</p>\n<p>The class also reports its own <code>APIVersion</code>, separate from the plugin version — so a consumer can check whether the <em>contract</em> changed rather than merely whether the plugin did.</p>\n<h2 id=\"how-the-flagship-uses-it\">How the flagship uses it</h2>\n<p><code>MailboxesNotificationService</code> implements the flagship's <a class=\"wl\" href=\"#/notification\" data-id=\"notification\">Notification</a> interface by calling <code>sendPluginMessageToPlayer</code>, using the <code>UUID</code> overload — which matters, because the recipient is by definition offline and there is no <code>Player</code> object to pass. That is the entire integration: a faction announcement to an absent member becomes a piece of mail waiting when they next log in.</p>\n<p>Because the flagship resolves the plugin by name and returns quietly if it is absent, Mailboxes remains genuinely optional.</p>\n<h2 id=\"item-attachments\">Item attachments</h2>\n<p>Attachments make mail an item-transfer channel, not just a message channel — with configurable limits and permissions, since an unbounded one would be a duplication and storage problem.</p>\n<h2 id=\"related\">Related</h2>\n<p>Mailboxes ships in the curated plugin set on <a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a>, which is where its interaction with the flagship is exercised.</p>", "id": "mailboxes", "links": ["medieval-factions", "notification", "dpc-mc-server"], "sourcePath": "notes/concepts/mailboxes.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/mailboxes.md", "sources": [{"claim": "Mailboxes lets players and plugins send persistent messages that survive server restarts, supports item attachments, and documents a public API for other plugins.", "label": "Mailboxes/README.md", "lines": "", "path": "README.md", "ref": "3f8fb186bbdd067ae893d911b26d065d8f3fdaf8", "repo": "Dans-Plugins/Mailboxes", "shortRef": "3f8fb18", "url": "https://github.com/Dans-Plugins/Mailboxes/blob/3f8fb186bbdd067ae893d911b26d065d8f3fdaf8/README.md"}, {"claim": "MailboxesAPI returns wrapper types M_Mailbox and M_Message rather than internal objects, reports its own APIVersion, and offers sendPluginMessageToPlayer overloads taking either a Player or a UUID.", "label": "Mailboxes/MailboxesAPI.java", "lines": "", "path": "src/main/java/dansplugins/mailboxes/externalapi/MailboxesAPI.java", "ref": "3f8fb186bbdd067ae893d911b26d065d8f3fdaf8", "repo": "Dans-Plugins/Mailboxes", "shortRef": "3f8fb18", "url": "https://github.com/Dans-Plugins/Mailboxes/blob/3f8fb186bbdd067ae893d911b26d065d8f3fdaf8/src/main/java/dansplugins/mailboxes/externalapi/MailboxesAPI.java"}], "summary": "A standalone plugin giving players persistent in-game mail with item attachments, and the delivery backend Medieval Factions prefers for offline notifications.", "tags": ["mailboxes", "ecosystem", "integration"], "text": "mailboxes a standalone plugin giving players persistent in-game mail with item attachments, and the delivery backend medieval factions prefers for offline notifications. \nmailboxes is a standalone plugin: persistent player-to-player mail, with items\nattachable to a message. it has no dependency on [[medieval-factions]]. the\nrelationship runs the other way — the flagship uses it when it is present.\n\n## a deliberate api package\n\nthe `externalapi` package is the notable design choice. rather than letting\nother plugins reach into `mailbox` and `message` directly, mailboxes exposes\n`mailboxesapi` plus wrapper types `m_mailbox` and `m_message`.\n\nthe `m_` prefix marks the boundary: those are the types other plugins are\nallowed to hold. `getmailbox` and `getmessage` wrap the internal object on the\nway out, so internal classes can be refactored without breaking consumers.\n\nthe class also reports its own `apiversion`, separate from the plugin version —\nso a consumer can check whether the *contract* changed rather than merely\nwhether the plugin did.\n\n## how the flagship uses it\n\n`mailboxesnotificationservice` implements the flagship's [[notification]]\ninterface by calling `sendpluginmessagetoplayer`, using the `uuid` overload —\nwhich matters, because the recipient is by definition offline and there is no\n`player` object to pass. that is the entire integration: a faction announcement\nto an absent member becomes a piece of mail waiting when they next log in.\n\nbecause the flagship resolves the plugin by name and returns quietly if it is\nabsent, mailboxes remains genuinely optional.\n\n## item attachments\n\nattachments make mail an item-transfer channel, not just a message channel —\nwith configurable limits and permissions, since an unbounded one would be a\nduplication and storage problem.\n\n## related\n\nmailboxes ships in the curated plugin set on [[dpc-mc-server]], which is where\nits interaction with the flagship is exercised.\n", "title": "Mailboxes", "toc": [{"level": 2, "slug": "a-deliberate-api-package", "text": "A deliberate API package"}, {"level": 2, "slug": "how-the-flagship-uses-it", "text": "How the flagship uses it"}, {"level": 2, "slug": "item-attachments", "text": "Item attachments"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "main-thread-safety": {"backlinks": ["dpc-api-faction-sync", "faction-events", "moc-medieval-factions", "moc-plugin-architecture"], "html": "<p>A Bukkit server runs game logic on one thread. Plugin data structures reachable from that logic are not thread-safe, and reading them from a background thread produces corruption that surfaces far from its cause.</p>\n<h2 id=\"snapshot-on-send-off\">Snapshot on, send off</h2>\n<p><a class=\"wl\" href=\"#/dpc-api-faction-sync\" data-id=\"dpc-api-faction-sync\">DPC API Faction Sync</a> is the clearest worked example in the codebase, and its class comment states the rule outright. The work is split in two:</p>\n<ol>\n<li><strong><code>collectSnapshot()</code></strong> — runs on the main thread. It walks the faction service and the members lists, and returns an immutable <code>SyncSnapshot</code>.\n</li>\n<li><strong><code>dispatchAsync()</code></strong> — safe from any thread. It serializes the snapshot and hands it to the JDK <code>HttpClient</code>, which does the I/O on its own pool.\n</li>\n</ol>\n<p>The scheduled task is therefore registered with <code>runTaskTimer</code> — the <em>main thread</em> variant — even though its purpose is a network call. This looks backwards until you see the split: the expensive part is already asynchronous inside <code>HttpClient</code>, and scheduling the task asynchronously would only move the <em>unsafe</em> part off the main thread.</p>\n<h2 id=\"the-general-rule\">The general rule</h2>\n<p>The pattern generalises to anything the plugin does off-thread: <strong>collect an immutable snapshot on the main thread, then act on the snapshot elsewhere.</strong> Never hold a reference to live Bukkit or service state across a thread boundary.</p>\n<h2 id=\"where-it-also-shows-up\">Where it also shows up</h2>\n<ul>\n<li><a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> pass <code>!server.isPrimaryThread</code> to the Bukkit <code>Event</code> constructor, so listeners are told truthfully which thread they are on.\n</li>\n<li><a class=\"wl\" href=\"#/gate\" data-id=\"gate\">Gate</a> checks <code>isChunkLoaded</code> before reading a block, avoiding a synchronous chunk load on the main thread.\n</li>\n<li>The <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> caches use <code>ConcurrentHashMap</code> and <code>CopyOnWriteArrayList</code>, because reads can legitimately arrive from async listeners even when writes do not.\n</li>\n</ul>\n<h2 id=\"related\">Related</h2>\n<p>Getting this wrong is not usually a crash — it is a rare, unreproducible inconsistency. That is why the constraint is written into a class comment rather than left implicit.</p>", "id": "main-thread-safety", "links": ["dpc-api-faction-sync", "faction-events", "gate", "service-layer"], "sourcePath": "notes/concepts/main-thread-safety.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/main-thread-safety.md", "sources": [{"claim": "The DPC API service documents that Bukkit plugin data structures are not thread-safe, that collectSnapshot must be called from the main server thread, and that the returned snapshot is an immutable view safe to serialize off it.", "label": "Medieval-Factions/MfDpcApiService.kt:13-21", "lines": "13-21", "path": "src/main/kotlin/com/dansplugins/factionsystem/dpc/MfDpcApiService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/dpc/MfDpcApiService.kt#L13-L21"}, {"claim": "The faction sync task is scheduled with runTaskTimer on the main thread so snapshot collection can touch Bukkit state, while the HTTP send is dispatched asynchronously.", "label": "Medieval-Factions/MedievalFactions.kt:498-509", "lines": "498-509", "path": "src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt#L498-L509"}], "summary": "Bukkit state may only be read on the server's main thread, so anything doing I/O snapshots first and sends afterwards.", "tags": ["medieval-factions", "architecture", "concurrency"], "text": "main thread safety bukkit state may only be read on the server's main thread, so anything doing i/o snapshots first and sends afterwards. \na bukkit server runs game logic on one thread. plugin data structures reachable\nfrom that logic are not thread-safe, and reading them from a background thread\nproduces corruption that surfaces far from its cause.\n\n## snapshot on, send off\n\n[[dpc-api-faction-sync]] is the clearest worked example in the codebase, and its\nclass comment states the rule outright. the work is split in two:\n\n1. **`collectsnapshot()`** — runs on the main thread. it walks the faction\n   service and the members lists, and returns an immutable `syncsnapshot`.\n2. **`dispatchasync()`** — safe from any thread. it serializes the snapshot and\n   hands it to the jdk `httpclient`, which does the i/o on its own pool.\n\nthe scheduled task is therefore registered with `runtasktimer` — the *main\nthread* variant — even though its purpose is a network call. this looks backwards\nuntil you see the split: the expensive part is already asynchronous inside\n`httpclient`, and scheduling the task asynchronously would only move the *unsafe*\npart off the main thread.\n\n## the general rule\n\nthe pattern generalises to anything the plugin does off-thread: **collect an\nimmutable snapshot on the main thread, then act on the snapshot elsewhere.**\nnever hold a reference to live bukkit or service state across a thread boundary.\n\n## where it also shows up\n\n- [[faction-events]] pass `!server.isprimarythread` to the bukkit `event`\n  constructor, so listeners are told truthfully which thread they are on.\n- [[gate]] checks `ischunkloaded` before reading a block, avoiding a synchronous\n  chunk load on the main thread.\n- the [[service-layer]] caches use `concurrenthashmap` and\n  `copyonwritearraylist`, because reads can legitimately arrive from async\n  listeners even when writes do not.\n\n## related\n\ngetting this wrong is not usually a crash — it is a rare, unreproducible\ninconsistency. that is why the constraint is written into a class comment rather\nthan left implicit.\n", "title": "Main Thread Safety", "toc": [{"level": 2, "slug": "snapshot-on-send-off", "text": "Snapshot on, send off"}, {"level": 2, "slug": "the-general-rule", "text": "The general rule"}, {"level": 2, "slug": "where-it-also-shows-up", "text": "Where it also shows up"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "map-integration": {"backlinks": ["claimed-chunk", "dpc-mc-server", "faction-flag", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture", "moc-plugin-ecosystem", "notification", "service-layer"], "html": "<p>Faction territory is rendered on a live web map. The flagship's side of that is one interface with one method: <code>scheduleUpdateClaims(faction)</code>.</p>\n<h2 id=\"debounced-not-immediate\">Debounced, not immediate</h2>\n<p>The method name is the design. A <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> change does not redraw the map — it <em>schedules</em> a redraw. The Dynmap implementation is three lines:</p>\n<pre><code class=\"lang-kotlin\">taskScheduler.cancelTasks(faction.id)\ntaskScheduler.scheduleTask(faction.id, { updateClaims(faction) }, 100L)</code></pre>\n<p>Cancel whatever is pending for this faction, then schedule a fresh redraw 100 ticks (five seconds) out. That is a debounce: claiming land is usually a burst — the fill and circle claim commands place dozens of chunks at once — and each chunk would otherwise mean a full marker rebuild. Only the last change in a burst survives to actually run.</p>\n<p>Behind the interface, <code>map/builders</code> turns a faction's claims into polygon paths and its details into an info popup, and <code>map/aliases</code> is three typealiases giving that geometry names (<code>Point</code>, <code>Path</code>, <code>LineSegment</code>). <code>map/scheduling</code> holds the <code>TaskScheduler</code> — which, incidentally, still declares the package <code>com.dansplugins.factionsystem.dynmap</code> despite living under <code>map/scheduling</code>.</p>\n<h2 id=\"doubly-optional\">Doubly optional</h2>\n<p>The service is created only if <em>both</em> the <code>dynmap</code> plugin is installed <em>and</em> <code>dynmap.enableDynmapIntegration</code> is true. Both conditions are checked once at startup, and the result is the nullable <code>mapService</code> on the <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> registry — so the rest of the codebase deals with a null check rather than a runtime capability probe.</p>\n<p>An operator can therefore run Dynmap for the base map while keeping faction overlays off, without uninstalling anything.</p>\n<h2 id=\"colour-comes-from-the-faction\">Colour comes from the faction</h2>\n<p>The colour a faction is drawn in is its <code>color</code> <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> — a <code>#RRGGBB</code> string that defaults to a randomly generated pleasant colour. Map appearance is thus player-controlled state, not a server setting.</p>\n<h2 id=\"related\">Related</h2>\n<p>A separate repository, <code>Bluemap_MedievalFactions</code>, provides the equivalent for BlueMap, and <a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a> ships both map plugins.</p>", "id": "map-integration", "links": ["claimed-chunk", "service-layer", "faction-flag", "dpc-mc-server"], "sourcePath": "notes/concepts/map-integration.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/map-integration.md", "sources": [{"claim": "The map service interface declares a single method, scheduleUpdateClaims, taking a faction.", "label": "Medieval-Factions/MapService.kt:8-15", "lines": "8-15", "path": "src/main/kotlin/com/dansplugins/factionsystem/map/MapService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/map/MapService.kt#L8-L15"}, {"claim": "The map service is constructed only when the dynmap plugin is installed and dynmap.enableDynmapIntegration is true in the config.", "label": "Medieval-Factions/MedievalFactions.kt:190", "lines": "190", "path": "src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt#L190"}, {"claim": "Scheduling an update cancels any pending tasks for that faction and schedules a fresh one 100 ticks later, so rapid successive changes collapse into a single redraw.", "label": "Medieval-Factions/DynmapService.kt:41-44", "lines": "41-44", "path": "src/main/kotlin/com/dansplugins/factionsystem/map/dynmap/DynmapService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/map/dynmap/DynmapService.kt#L41-L44"}], "summary": "Claimed territory is drawn on web maps through a one-method interface with a Dynmap implementation, wired only when the optional plugin is present.", "tags": ["medieval-factions", "integration", "ecosystem"], "text": "map integration claimed territory is drawn on web maps through a one-method interface with a dynmap implementation, wired only when the optional plugin is present. \nfaction territory is rendered on a live web map. the flagship's side of that is\none interface with one method: `scheduleupdateclaims(faction)`.\n\n## debounced, not immediate\n\nthe method name is the design. a [[claimed-chunk]] change does not redraw the\nmap — it *schedules* a redraw. the dynmap implementation is three lines:\n\n```kotlin\ntaskscheduler.canceltasks(faction.id)\ntaskscheduler.scheduletask(faction.id, { updateclaims(faction) }, 100l)\n```\n\ncancel whatever is pending for this faction, then schedule a fresh redraw 100\nticks (five seconds) out. that is a debounce: claiming land is usually a burst —\nthe fill and circle claim commands place dozens of chunks at once — and each\nchunk would otherwise mean a full marker rebuild. only the last change in a\nburst survives to actually run.\n\nbehind the interface, `map/builders` turns a faction's claims into polygon paths\nand its details into an info popup, and `map/aliases` is three typealiases\ngiving that geometry names (`point`, `path`, `linesegment`). `map/scheduling`\nholds the `taskscheduler` — which, incidentally, still declares the package\n`com.dansplugins.factionsystem.dynmap` despite living under `map/scheduling`.\n\n## doubly optional\n\nthe service is created only if *both* the `dynmap` plugin is installed *and*\n`dynmap.enabledynmapintegration` is true. both conditions are checked once at\nstartup, and the result is the nullable `mapservice` on the [[service-layer]]\nregistry — so the rest of the codebase deals with a null check rather than a\nruntime capability probe.\n\nan operator can therefore run dynmap for the base map while keeping faction\noverlays off, without uninstalling anything.\n\n## colour comes from the faction\n\nthe colour a faction is drawn in is its `color` [[faction-flag]] — a `#rrggbb`\nstring that defaults to a randomly generated pleasant colour. map appearance is\nthus player-controlled state, not a server setting.\n\n## related\n\na separate repository, `bluemap_medievalfactions`, provides the equivalent for\nbluemap, and [[dpc-mc-server]] ships both map plugins.\n", "title": "Map Integration", "toc": [{"level": 2, "slug": "debounced-not-immediate", "text": "Debounced, not immediate"}, {"level": 2, "slug": "doubly-optional", "text": "Doubly optional"}, {"level": 2, "slug": "colour-comes-from-the-faction", "text": "Colour comes from the faction"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "medieval-factions": {"backlinks": ["dans-plugin-manager", "dpc-api-faction-sync", "dpc-conventions", "dpc-mc-server", "faction-events", "jooq-persistence", "mailboxes", "moc-conventions-and-process", "moc-dans-plugins-community", "moc-medieval-factions", "moc-plugin-architecture", "moc-plugin-ecosystem", "moc-web-and-infrastructure", "notification", "optimistic-locking", "release-automation", "repository-pattern", "service-layer", "two-tier-documentation"], "html": "<p>Medieval Factions is a Spigot plugin written in Kotlin that lets players organise into feudal nations. It is the largest repository in the organization and the most heavily documented, and <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a> names it as the reference implementation the other plugins are measured against.</p>\n<h2 id=\"what-it-simulates\">What it simulates</h2>\n<p>Players form a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>, gain <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a> by playing, and spend that power's collective total on territory via the <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>. Around that core sit diplomacy (<a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a>, <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a>), internal governance (<a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a>, <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a>, <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a>), and a set of props for roleplay (<a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a>, <a class=\"wl\" href=\"#/gate\" data-id=\"gate\">Gate</a>, <a class=\"wl\" href=\"#/locked-block\" data-id=\"locked-block\">Locked Block</a>, duels).</p>\n<p>The design bet running through all of it: give players the mechanics of sovereignty and let the politics be emergent. See <a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a> for the clearest statement of that principle — the plugin stores a faction's laws and refuses to enforce them.</p>\n<h2 id=\"version-5-was-a-rewrite\">Version 5 was a rewrite</h2>\n<p>Version 4 was Java with flat-file JSON storage. Version 5 is Kotlin over a real database, and its development was led by <a href=\"https://github.com/alyphen\" target=\"_blank\" rel=\"noopener\">alyphen</a>, creator of RPKit. The architecture described in <a class=\"wl\" href=\"#/moc-plugin-architecture\" data-id=\"moc-plugin-architecture\">Plugin Architecture</a> — services over repositories over <a class=\"wl\" href=\"#/jooq-persistence\" data-id=\"jooq-persistence\">jOOQ Persistence</a>, immutable data classes, <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> — arrived with that rewrite.</p>\n<p>The seam between the two generations is still visible: <a class=\"wl\" href=\"#/legacy-data-migration\" data-id=\"legacy-data-migration\">Legacy Data Migration</a> exists to carry version 4 servers across, and <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> still builds against a version 4 jar.</p>\n<h2 id=\"integration-surface\">Integration surface</h2>\n<p>Other software attaches at four points: <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> (react), <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> (read and write), <a class=\"wl\" href=\"#/notification\" data-id=\"notification\">Notification</a> and <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> (supply an implementation), and <a class=\"wl\" href=\"#/dpc-api-faction-sync\" data-id=\"dpc-api-faction-sync\">DPC API Faction Sync</a> (push data out).</p>\n<h2 id=\"related\">Related</h2>\n<p>Its documentation lives beside the code per <a class=\"wl\" href=\"#/two-tier-documentation\" data-id=\"two-tier-documentation\">Two-Tier Documentation</a>: <code>USER_GUIDE.md</code>, <code>COMMANDS.md</code>, <code>CONFIG.md</code>, <code>FACTION_FLAGS.md</code>, and <code>DATABASE_QUERYING.md</code>.</p>", "id": "medieval-factions", "links": ["dpc-conventions", "faction", "player-power", "demesne-limit", "faction-relationship", "vassalage", "faction-role", "faction-permission", "faction-flag", "law", "gate", "locked-block", "moc-plugin-architecture", "jooq-persistence", "optimistic-locking", "legacy-data-migration", "fiefs", "faction-events", "service-layer", "notification", "map-integration", "dpc-api-faction-sync", "two-tier-documentation"], "sourcePath": "notes/concepts/medieval-factions.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/medieval-factions.md", "sources": [{"claim": "Medieval Factions lets players create nations, claim territory, engage in warfare or politics, write laws and hold dueling tournaments, and its fifth major version was led by alyphen, the creator of RPKit.", "label": "Medieval-Factions/README.md", "lines": "", "path": "README.md", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/README.md"}, {"claim": "Medieval Factions is named as the flagship plugin and the source of truth for all DPC conventions.", "label": "dpc-conventions/README.md", "lines": "", "path": "README.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/README.md"}], "summary": "The flagship plugin — a Kotlin Spigot plugin simulating sovereign nations, and the reference implementation every DPC convention points at.", "tags": ["medieval-factions", "plugin", "flagship"], "text": "medieval factions the flagship plugin — a kotlin spigot plugin simulating sovereign nations, and the reference implementation every dpc convention points at. \nmedieval factions is a spigot plugin written in kotlin that lets players\norganise into feudal nations. it is the largest repository in the organization\nand the most heavily documented, and [[dpc-conventions]] names it as the\nreference implementation the other plugins are measured against.\n\n## what it simulates\n\nplayers form a [[faction]], gain [[player-power]] by playing, and spend that\npower's collective total on territory via the [[demesne-limit]]. around that core\nsit diplomacy ([[faction-relationship]], [[vassalage]]), internal governance\n([[faction-role]], [[faction-permission]], [[faction-flag]]), and a set of\nprops for roleplay ([[law]], [[gate]], [[locked-block]], duels).\n\nthe design bet running through all of it: give players the mechanics of\nsovereignty and let the politics be emergent. see [[law]] for the clearest\nstatement of that principle — the plugin stores a faction's laws and refuses to\nenforce them.\n\n## version 5 was a rewrite\n\nversion 4 was java with flat-file json storage. version 5 is kotlin over a real\ndatabase, and its development was led by [alyphen](https://github.com/alyphen),\ncreator of rpkit. the architecture described in [[moc-plugin-architecture]] —\nservices over repositories over [[jooq-persistence]], immutable data classes,\n[[optimistic-locking]] — arrived with that rewrite.\n\nthe seam between the two generations is still visible: [[legacy-data-migration]]\nexists to carry version 4 servers across, and [[fiefs]] still builds against a\nversion 4 jar.\n\n## integration surface\n\nother software attaches at four points: [[faction-events]] (react),\n[[service-layer]] (read and write), [[notification]] and [[map-integration]]\n(supply an implementation), and [[dpc-api-faction-sync]] (push data out).\n\n## related\n\nits documentation lives beside the code per [[two-tier-documentation]]:\n`user_guide.md`, `commands.md`, `config.md`, `faction_flags.md`, and\n`database_querying.md`.\n", "title": "Medieval Factions", "toc": [{"level": 2, "slug": "what-it-simulates", "text": "What it simulates"}, {"level": 2, "slug": "version-5-was-a-rewrite", "text": "Version 5 was a rewrite"}, {"level": 2, "slug": "integration-surface", "text": "Integration surface"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "moc-conventions-and-process": {"backlinks": ["moc-dans-plugins-community"], "html": "<p>The organization writes its standards down. <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a> is the repository that holds them, and <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> is the worked example most of those documents point back at.</p>\n<h2 id=\"the-documents\">The documents</h2>\n<ul>\n<li><a class=\"wl\" href=\"#/two-tier-documentation\" data-id=\"two-tier-documentation\">Two-Tier Documentation</a> — which docs live in the repo and which live in the wiki, and why the split exists.\n</li>\n<li><a class=\"wl\" href=\"#/release-automation\" data-id=\"release-automation\">Release Automation</a> — a release triggers a build that attaches a JAR.\n</li>\n<li><a class=\"wl\" href=\"#/testing-and-ci\" data-id=\"testing-and-ci\">Testing and CI</a> — Gradle for unit tests, Docker Compose for a real server.\n</li>\n</ul>\n<h2 id=\"the-shape-of-a-repository\">The shape of a repository</h2>\n<p>A repository that follows the conventions has, in its root: <code>README.md</code>, <code>CONTRIBUTING.md</code>, <code>USER_GUIDE.md</code>, <code>COMMANDS.md</code>, <code>CONFIG.md</code>, usually <code>CHANGELOG.md</code>, and a <code>.github/copilot-instructions.md</code> giving coding agents context about the plugin. The presence or absence of those files is the quickest audit of whether a repository has been brought into line.</p>\n<h2 id=\"why-it-is-centralised\">Why it is centralised</h2>\n<p>Standards written into one repository can be cited. A note in this zettelkasten that says &quot;DPC plugins document their commands in <code>COMMANDS.md</code>&quot; is a claim, and it needs a source — <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a> is that source. Standards held only in a maintainer's head cannot be cited, verified, or handed to a new contributor.</p>", "id": "moc-conventions-and-process", "links": ["dpc-conventions", "medieval-factions", "two-tier-documentation", "release-automation", "testing-and-ci"], "sourcePath": "notes/moc/moc-conventions-and-process.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-conventions-and-process.md", "sources": [{"claim": "The stated goal of dpc-conventions is to bring every plugin in the organization to the same level of completeness and quality as Medieval Factions.", "label": "dpc-conventions/README.md", "lines": "", "path": "README.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/README.md"}], "summary": "The standards every DPC repository is held to — documentation layout, testing, CI, and release automation.", "tags": ["moc", "dpc", "conventions"], "text": "conventions and process the standards every dpc repository is held to — documentation layout, testing, ci, and release automation. \nthe organization writes its standards down. [[dpc-conventions]] is the repository\nthat holds them, and [[medieval-factions]] is the worked example most of those\ndocuments point back at.\n\n## the documents\n\n- [[two-tier-documentation]] — which docs live in the repo and which live in the\n  wiki, and why the split exists.\n- [[release-automation]] — a release triggers a build that attaches a jar.\n- [[testing-and-ci]] — gradle for unit tests, docker compose for a real server.\n\n## the shape of a repository\n\na repository that follows the conventions has, in its root: `readme.md`,\n`contributing.md`, `user_guide.md`, `commands.md`, `config.md`, usually\n`changelog.md`, and a `.github/copilot-instructions.md` giving coding agents\ncontext about the plugin. the presence or absence of those files is the quickest\naudit of whether a repository has been brought into line.\n\n## why it is centralised\n\nstandards written into one repository can be cited. a note in this zettelkasten\nthat says \"dpc plugins document their commands in `commands.md`\" is a claim, and\nit needs a source — [[dpc-conventions]] is that source. standards held only in\na maintainer's head cannot be cited, verified, or handed to a new contributor.\n", "title": "Conventions and Process", "toc": [{"level": 2, "slug": "the-documents", "text": "The documents"}, {"level": 2, "slug": "the-shape-of-a-repository", "text": "The shape of a repository"}, {"level": 2, "slug": "why-it-is-centralised", "text": "Why it is centralised"}], "type": "moc", "updated": "2026-08-07"}, "moc-dans-plugins-community": {"backlinks": [], "html": "<p>Dan's Plugins Community (DPC) is a collection of open-source Minecraft plugins built around a single ambition: let players simulate societies. <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> is the flagship — sovereign nations, claimed land, diplomacy, war — and most other repositories in the organization either extend it, support it, or share its conventions.</p>\n<p>This is the root of the zettelkasten. Each note below is a doorway into a cluster; every concept note in the collection is grounded in a citation to a file in a <a href=\"https://github.com/Dans-Plugins\" target=\"_blank\" rel=\"noopener\">Dans-Plugins</a> repository, pinned at a commit SHA.</p>\n<h2 id=\"the-four-clusters\">The four clusters</h2>\n<ul>\n<li><strong><a class=\"wl\" href=\"#/moc-faction-domain-model\" data-id=\"moc-faction-domain-model\">Faction Domain Model</a></strong> — the nouns of the simulation. What a faction <em>is</em>, what power measures, how land is claimed, how factions relate to one another.\n</li>\n<li><strong><a class=\"wl\" href=\"#/moc-plugin-architecture\" data-id=\"moc-plugin-architecture\">Plugin Architecture</a></strong> — how the flagship is built. The service and repository layering, persistence, concurrency, and the seams that expansions and integrations plug into.\n</li>\n<li><strong><a class=\"wl\" href=\"#/moc-plugin-ecosystem\" data-id=\"moc-plugin-ecosystem\">Plugin Ecosystem</a></strong> — the other plugins. Shared libraries, official expansions, and the plugins the flagship talks to at runtime.\n</li>\n<li><strong><a class=\"wl\" href=\"#/moc-conventions-and-process\" data-id=\"moc-conventions-and-process\">Conventions and Process</a></strong> — the rules the organization holds itself to: documentation, testing, releases.\n</li>\n<li><strong><a class=\"wl\" href=\"#/moc-web-and-infrastructure\" data-id=\"moc-web-and-infrastructure\">Web and Infrastructure</a></strong> — <a class=\"wl\" href=\"#/dansplugins-dot-com\" data-id=\"dansplugins-dot-com\">dansplugins.com</a>, the community server, and the pipe that carries live faction data from a Minecraft server to the website.\n</li>\n</ul>\n<h2 id=\"where-to-start\">Where to start</h2>\n<p>If you have never touched the codebase, read <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a>, then <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>, then <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a>. Those three carry most of the vocabulary the rest of the collection assumes.</p>\n<p>If you are here to change code, start at <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> and <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> — nearly every feature in the flagship is a new service, a new repository, and a command that wires them together.</p>\n<h2 id=\"how-this-collection-works\">How this collection works</h2>\n<p>Notes are single ideas. Maps of Content like this one hold no original claims; they route. Concept notes carry the claims, and each claim points at a specific file at a specific commit. See <a href=\"../../docs/NOTE_FORMAT.md\">the note format</a> for the rules, and <a class=\"wl\" href=\"#/moc-medieval-factions\" data-id=\"moc-medieval-factions\">Medieval Factions Map</a> for a full index of the flagship's concepts.</p>", "id": "moc-dans-plugins-community", "links": ["medieval-factions", "moc-faction-domain-model", "moc-plugin-architecture", "moc-plugin-ecosystem", "moc-conventions-and-process", "moc-web-and-infrastructure", "dansplugins-dot-com", "faction", "faction-power", "service-layer", "repository-pattern", "moc-medieval-factions"], "sourcePath": "notes/moc/moc-dans-plugins-community.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-dans-plugins-community.md", "sources": [{"claim": "DPC stands for Dans Plugins Community and treats Medieval Factions as its flagship reference implementation.", "label": "dpc-conventions/README.md", "lines": "", "path": "README.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/README.md"}], "summary": "Root map of the zettelkasten — the community, its flagship plugin, its shared conventions, and the web and server infrastructure around them.", "tags": ["moc", "dpc"], "text": "dan's plugins community root map of the zettelkasten — the community, its flagship plugin, its shared conventions, and the web and server infrastructure around them. \ndan's plugins community (dpc) is a collection of open-source minecraft plugins\nbuilt around a single ambition: let players simulate societies. [[medieval-factions]]\nis the flagship — sovereign nations, claimed land, diplomacy, war — and most\nother repositories in the organization either extend it, support it, or share\nits conventions.\n\nthis is the root of the zettelkasten. each note below is a doorway into a\ncluster; every concept note in the collection is grounded in a citation to a\nfile in a [dans-plugins](https://github.com/dans-plugins) repository, pinned at\na commit sha.\n\n## the four clusters\n\n- **[[moc-faction-domain-model]]** — the nouns of the simulation. what a faction\n  *is*, what power measures, how land is claimed, how factions relate to one\n  another.\n- **[[moc-plugin-architecture]]** — how the flagship is built. the service and\n  repository layering, persistence, concurrency, and the seams that expansions\n  and integrations plug into.\n- **[[moc-plugin-ecosystem]]** — the other plugins. shared libraries, official\n  expansions, and the plugins the flagship talks to at runtime.\n- **[[moc-conventions-and-process]]** — the rules the organization holds itself\n  to: documentation, testing, releases.\n- **[[moc-web-and-infrastructure]]** — [[dansplugins-dot-com]], the community\n  server, and the pipe that carries live faction data from a minecraft server\n  to the website.\n\n## where to start\n\nif you have never touched the codebase, read [[medieval-factions]], then\n[[faction]], then [[faction-power]]. those three carry most of the vocabulary\nthe rest of the collection assumes.\n\nif you are here to change code, start at [[service-layer]] and\n[[repository-pattern]] — nearly every feature in the flagship is a new service,\na new repository, and a command that wires them together.\n\n## how this collection works\n\nnotes are single ideas. maps of content like this one hold no original claims;\nthey route. concept notes carry the claims, and each claim points at a specific\nfile at a specific commit. see [the note format](../../docs/note_format.md) for\nthe rules, and [[moc-medieval-factions]] for a full index of the flagship's\nconcepts.\n", "title": "Dan's Plugins Community", "toc": [{"level": 2, "slug": "the-four-clusters", "text": "The four clusters"}, {"level": 2, "slug": "where-to-start", "text": "Where to start"}, {"level": 2, "slug": "how-this-collection-works", "text": "How this collection works"}], "type": "moc", "updated": "2026-08-07"}, "moc-faction-domain-model": {"backlinks": ["moc-dans-plugins-community", "moc-medieval-factions"], "html": "<p>The domain model is small enough to hold in your head, and almost all of it hangs off one number. This map walks it in dependency order rather than alphabetically.</p>\n<h2 id=\"start-with-power\">Start with power</h2>\n<p>Every player carries <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a>, a scalar that rises with time online and falls on death. A <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>'s <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> is the sum of its members' power, plus a conditional contribution from its vassals. That single number is the currency of the whole simulation: it decides how much land a faction may hold, via the <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>.</p>\n<p>This is the design's central lever. Territory is not bought, it is <em>staffed</em> — land follows people, and a faction that empties out loses its grip on the map.</p>\n<h2 id=\"then-land\">Then land</h2>\n<p>Land is claimed one Minecraft chunk at a time; see <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a>. Whether a non-member may build inside a claim depends on <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> settings and, for members, on the <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> granted by their <a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a>.</p>\n<h2 id=\"then-politics\">Then politics</h2>\n<p>Factions relate to each other through <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a> — allied, at war, or bound in the liege/vassal hierarchy described in <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a>. Relationship changes are two-sided, which is what <a class=\"wl\" href=\"#/approval-request\" data-id=\"approval-request\">Approval Request</a> exists to mediate.</p>\n<h2 id=\"then-the-trimmings\">Then the trimmings</h2>\n<p>Several features are self-contained and can be read in any order once the above is clear: <a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a> (a faction's written rules), <a class=\"wl\" href=\"#/gate\" data-id=\"gate\">Gate</a> (redstone-triggered walls), and <a class=\"wl\" href=\"#/locked-block\" data-id=\"locked-block\">Locked Block</a> (per-player container locks that operate independently of faction land).</p>\n<h2 id=\"what-ties-it-together\">What ties it together</h2>\n<p>Nothing in this map is stored as an object graph — every one of these concepts is persisted through its own repository, and read back through the <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>. If you are tracing a value from a command to the database, <a class=\"wl\" href=\"#/moc-plugin-architecture\" data-id=\"moc-plugin-architecture\">Plugin Architecture</a> is the map you want next.</p>", "id": "moc-faction-domain-model", "links": ["player-power", "faction", "faction-power", "demesne-limit", "claimed-chunk", "faction-flag", "faction-permission", "faction-role", "faction-relationship", "vassalage", "approval-request", "law", "gate", "locked-block", "service-layer", "moc-plugin-architecture"], "sourcePath": "notes/moc/moc-faction-domain-model.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-faction-domain-model.md", "sources": [], "summary": "Guided path through the nouns of the simulation — factions, power, land, and the relationships between them.", "tags": ["moc", "medieval-factions", "domain-model"], "text": "faction domain model guided path through the nouns of the simulation — factions, power, land, and the relationships between them. \nthe domain model is small enough to hold in your head, and almost all of it\nhangs off one number. this map walks it in dependency order rather than\nalphabetically.\n\n## start with power\n\nevery player carries [[player-power]], a scalar that rises with time online and\nfalls on death. a [[faction]]'s [[faction-power]] is the sum of its members'\npower, plus a conditional contribution from its vassals. that single number is\nthe currency of the whole simulation: it decides how much land a faction may\nhold, via the [[demesne-limit]].\n\nthis is the design's central lever. territory is not bought, it is *staffed* —\nland follows people, and a faction that empties out loses its grip on the map.\n\n## then land\n\nland is claimed one minecraft chunk at a time; see [[claimed-chunk]]. whether a\nnon-member may build inside a claim depends on [[faction-flag]] settings and, for\nmembers, on the [[faction-permission]] granted by their [[faction-role]].\n\n## then politics\n\nfactions relate to each other through [[faction-relationship]] — allied, at war,\nor bound in the liege/vassal hierarchy described in [[vassalage]]. relationship\nchanges are two-sided, which is what [[approval-request]] exists to mediate.\n\n## then the trimmings\n\nseveral features are self-contained and can be read in any order once the above\nis clear: [[law]] (a faction's written rules), [[gate]] (redstone-triggered\nwalls), and [[locked-block]] (per-player container locks that operate\nindependently of faction land).\n\n## what ties it together\n\nnothing in this map is stored as an object graph — every one of these concepts\nis persisted through its own repository, and read back through the\n[[service-layer]]. if you are tracing a value from a command to the database,\n[[moc-plugin-architecture]] is the map you want next.\n", "title": "Faction Domain Model", "toc": [{"level": 2, "slug": "start-with-power", "text": "Start with power"}, {"level": 2, "slug": "then-land", "text": "Then land"}, {"level": 2, "slug": "then-politics", "text": "Then politics"}, {"level": 2, "slug": "then-the-trimmings", "text": "Then the trimmings"}, {"level": 2, "slug": "what-ties-it-together", "text": "What ties it together"}], "type": "moc", "updated": "2026-08-07"}, "moc-medieval-factions": {"backlinks": ["moc-dans-plugins-community"], "html": "<p><a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> is the largest codebase in the organization and the reference implementation for everything else. This map indexes the concepts that make it up.</p>\n<h2 id=\"the-simulation\">The simulation</h2>\n<p>The domain model — see <a class=\"wl\" href=\"#/moc-faction-domain-model\" data-id=\"moc-faction-domain-model\">Faction Domain Model</a> for the annotated version.</p>\n<ul>\n<li><a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> · <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> · <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a> · <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>\n</li>\n<li><a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> · <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a> · <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a>\n</li>\n<li><a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a> · <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> · <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a>\n</li>\n<li><a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a> · <a class=\"wl\" href=\"#/gate\" data-id=\"gate\">Gate</a> · <a class=\"wl\" href=\"#/locked-block\" data-id=\"locked-block\">Locked Block</a> · <a class=\"wl\" href=\"#/approval-request\" data-id=\"approval-request\">Approval Request</a>\n</li>\n</ul>\n<h2 id=\"the-machinery\">The machinery</h2>\n<p>How the plugin is put together — see <a class=\"wl\" href=\"#/moc-plugin-architecture\" data-id=\"moc-plugin-architecture\">Plugin Architecture</a>.</p>\n<ul>\n<li><a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> · <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> · <a class=\"wl\" href=\"#/jooq-persistence\" data-id=\"jooq-persistence\">jOOQ Persistence</a>\n</li>\n<li><a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> · <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a> · <a class=\"wl\" href=\"#/main-thread-safety\" data-id=\"main-thread-safety\">Main Thread Safety</a>\n</li>\n<li><a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> · <a class=\"wl\" href=\"#/legacy-data-migration\" data-id=\"legacy-data-migration\">Legacy Data Migration</a>\n</li>\n</ul>\n<h2 id=\"the-seams\">The seams</h2>\n<p>Points where other software attaches:</p>\n<ul>\n<li><a class=\"wl\" href=\"#/notification\" data-id=\"notification\">Notification</a> — pluggable delivery, backed by <a class=\"wl\" href=\"#/mailboxes\" data-id=\"mailboxes\">Mailboxes</a> when present.\n</li>\n<li><a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> — claimed land drawn on a web map.\n</li>\n<li><a class=\"wl\" href=\"#/dpc-api-faction-sync\" data-id=\"dpc-api-faction-sync\">DPC API Faction Sync</a> — the roster pushed to <a class=\"wl\" href=\"#/dansplugins-dot-com\" data-id=\"dansplugins-dot-com\">dansplugins.com</a>.\n</li>\n<li><a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a> — how <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> and <a class=\"wl\" href=\"#/currencies\" data-id=\"currencies\">Currencies</a> build on top.\n</li>\n</ul>\n<h2 id=\"reading-the-source\">Reading the source</h2>\n<p>Documentation lives beside the code by convention (see <a class=\"wl\" href=\"#/two-tier-documentation\" data-id=\"two-tier-documentation\">Two-Tier Documentation</a>): <code>USER_GUIDE.md</code>, <code>COMMANDS.md</code>, <code>CONFIG.md</code>, <code>FACTION_FLAGS.md</code>, and <code>DATABASE_QUERYING.md</code> are all in the repository root. Start there before reading Kotlin.</p>", "id": "moc-medieval-factions", "links": ["medieval-factions", "moc-faction-domain-model", "faction", "faction-power", "player-power", "demesne-limit", "claimed-chunk", "faction-relationship", "vassalage", "faction-role", "faction-permission", "faction-flag", "law", "gate", "locked-block", "approval-request", "moc-plugin-architecture", "service-layer", "repository-pattern", "jooq-persistence", "optimistic-locking", "value-class-identifier", "main-thread-safety", "faction-events", "legacy-data-migration", "notification", "mailboxes", "map-integration", "dpc-api-faction-sync", "dansplugins-dot-com", "expansion-plugin", "fiefs", "currencies", "two-tier-documentation"], "sourcePath": "notes/moc/moc-medieval-factions.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-medieval-factions.md", "sources": [{"claim": "Medieval Factions is described as a system of mechanics for simulating sovereign nations in Minecraft.", "label": "Medieval-Factions/README.md", "lines": "", "path": "README.md", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/README.md"}], "summary": "Index of every concept note about the flagship plugin, grouped by the layer of the system it belongs to.", "tags": ["moc", "medieval-factions"], "text": "medieval factions map index of every concept note about the flagship plugin, grouped by the layer of the system it belongs to. \n[[medieval-factions]] is the largest codebase in the organization and the\nreference implementation for everything else. this map indexes the concepts\nthat make it up.\n\n## the simulation\n\nthe domain model — see [[moc-faction-domain-model]] for the annotated version.\n\n- [[faction]] · [[faction-power]] · [[player-power]] · [[demesne-limit]]\n- [[claimed-chunk]] · [[faction-relationship]] · [[vassalage]]\n- [[faction-role]] · [[faction-permission]] · [[faction-flag]]\n- [[law]] · [[gate]] · [[locked-block]] · [[approval-request]]\n\n## the machinery\n\nhow the plugin is put together — see [[moc-plugin-architecture]].\n\n- [[service-layer]] · [[repository-pattern]] · [[jooq-persistence]]\n- [[optimistic-locking]] · [[value-class-identifier]] · [[main-thread-safety]]\n- [[faction-events]] · [[legacy-data-migration]]\n\n## the seams\n\npoints where other software attaches:\n\n- [[notification]] — pluggable delivery, backed by [[mailboxes]] when present.\n- [[map-integration]] — claimed land drawn on a web map.\n- [[dpc-api-faction-sync]] — the roster pushed to [[dansplugins-dot-com]].\n- [[expansion-plugin]] — how [[fiefs]] and [[currencies]] build on top.\n\n## reading the source\n\ndocumentation lives beside the code by convention (see\n[[two-tier-documentation]]): `user_guide.md`, `commands.md`, `config.md`,\n`faction_flags.md`, and `database_querying.md` are all in the repository root.\nstart there before reading kotlin.\n", "title": "Medieval Factions Map", "toc": [{"level": 2, "slug": "the-simulation", "text": "The simulation"}, {"level": 2, "slug": "the-machinery", "text": "The machinery"}, {"level": 2, "slug": "the-seams", "text": "The seams"}, {"level": 2, "slug": "reading-the-source", "text": "Reading the source"}], "type": "moc", "updated": "2026-08-07"}, "moc-plugin-architecture": {"backlinks": ["expansion-plugin", "medieval-factions", "moc-dans-plugins-community", "moc-faction-domain-model", "moc-medieval-factions"], "html": "<p><a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> has a consistent internal shape, and once you have seen one feature you have seen them all. This map describes that shape.</p>\n<h2 id=\"the-three-layers\">The three layers</h2>\n<ol>\n<li><strong>Commands</strong> parse player input and delegate immediately.\n</li>\n<li><strong>Services</strong> own the in-memory state and the business rules — <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>.\n</li>\n<li><strong>Repositories</strong> are interfaces that hide storage — <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> — implemented against <a class=\"wl\" href=\"#/jooq-persistence\" data-id=\"jooq-persistence\">jOOQ Persistence</a>.\n</li>\n</ol>\n<p>A new feature is almost always: a data class, an ID value class (<a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a>), a repository interface, a jOOQ implementation, a service, and a command.</p>\n<h2 id=\"cross-cutting-concerns\">Cross-cutting concerns</h2>\n<ul>\n<li><strong><a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a></strong> — every mutable record carries a version; a stale write is rejected rather than silently overwriting.\n</li>\n<li><strong><a class=\"wl\" href=\"#/main-thread-safety\" data-id=\"main-thread-safety\">Main Thread Safety</a></strong> — Bukkit state is not thread-safe, so anything doing I/O must snapshot on the main thread and act off it.\n</li>\n<li><strong><a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a></strong> — the plugin fires cancellable Bukkit events, which is the supported extension point for other plugins.\n</li>\n<li><strong><a class=\"wl\" href=\"#/legacy-data-migration\" data-id=\"legacy-data-migration\">Legacy Data Migration</a></strong> — flat files from version 4 are read once and written into the database.\n</li>\n</ul>\n<h2 id=\"where-to-attach\">Where to attach</h2>\n<p>If you are writing an <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a>, the seams that matter are <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> (react to things) and the <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> (read and change things). If you are integrating an external system, look at how <a class=\"wl\" href=\"#/notification\" data-id=\"notification\">Notification</a> and <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> define an interface and swap in an implementation at startup — that is the pattern to copy.</p>", "id": "moc-plugin-architecture", "links": ["medieval-factions", "service-layer", "repository-pattern", "jooq-persistence", "value-class-identifier", "optimistic-locking", "main-thread-safety", "faction-events", "legacy-data-migration", "expansion-plugin", "notification", "map-integration"], "sourcePath": "notes/moc/moc-plugin-architecture.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-plugin-architecture.md", "sources": [], "summary": "How the flagship is layered — services over repositories over jOOQ — and the cross-cutting concerns that shape every feature.", "tags": ["moc", "medieval-factions", "architecture"], "text": "plugin architecture how the flagship is layered — services over repositories over jooq — and the cross-cutting concerns that shape every feature. \n[[medieval-factions]] has a consistent internal shape, and once you have seen\none feature you have seen them all. this map describes that shape.\n\n## the three layers\n\n1. **commands** parse player input and delegate immediately.\n2. **services** own the in-memory state and the business rules —\n   [[service-layer]].\n3. **repositories** are interfaces that hide storage — [[repository-pattern]] —\n   implemented against [[jooq-persistence]].\n\na new feature is almost always: a data class, an id value class\n([[value-class-identifier]]), a repository interface, a jooq implementation, a\nservice, and a command.\n\n## cross-cutting concerns\n\n- **[[optimistic-locking]]** — every mutable record carries a version; a stale\n  write is rejected rather than silently overwriting.\n- **[[main-thread-safety]]** — bukkit state is not thread-safe, so anything\n  doing i/o must snapshot on the main thread and act off it.\n- **[[faction-events]]** — the plugin fires cancellable bukkit events, which is\n  the supported extension point for other plugins.\n- **[[legacy-data-migration]]** — flat files from version 4 are read once and\n  written into the database.\n\n## where to attach\n\nif you are writing an [[expansion-plugin]], the seams that matter are\n[[faction-events]] (react to things) and the [[service-layer]] (read and change\nthings). if you are integrating an external system, look at how [[notification]]\nand [[map-integration]] define an interface and swap in an implementation at\nstartup — that is the pattern to copy.\n", "title": "Plugin Architecture", "toc": [{"level": 2, "slug": "the-three-layers", "text": "The three layers"}, {"level": 2, "slug": "cross-cutting-concerns", "text": "Cross-cutting concerns"}, {"level": 2, "slug": "where-to-attach", "text": "Where to attach"}], "type": "moc", "updated": "2026-08-07"}, "moc-plugin-ecosystem": {"backlinks": ["moc-dans-plugins-community"], "html": "<p>The organization holds roughly forty repositories. They are not forty unrelated plugins — they cluster.</p>\n<h2 id=\"the-library\">The library</h2>\n<p><a class=\"wl\" href=\"#/ponder\" data-id=\"ponder\">Ponder</a> is the shared Kotlin/Java library: a multi-module Gradle project providing command dispatch, caching, and Bukkit helpers used across plugins.</p>\n<h2 id=\"the-expansions\">The expansions</h2>\n<p><a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a> describes the pattern: a plugin that hard-depends on <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> and extends the simulation rather than standing alone.</p>\n<ul>\n<li><a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> — sub-factions inside a faction.\n</li>\n<li><a class=\"wl\" href=\"#/currencies\" data-id=\"currencies\">Currencies</a> — faction-minted local money.\n</li>\n</ul>\n<h2 id=\"the-runtime-neighbours\">The runtime neighbours</h2>\n<p>Plugins the flagship detects and uses if they happen to be installed:</p>\n<ul>\n<li><a class=\"wl\" href=\"#/mailboxes\" data-id=\"mailboxes\">Mailboxes</a> — persistent player mail, used as a <a class=\"wl\" href=\"#/notification\" data-id=\"notification\">Notification</a> backend.\n</li>\n<li><a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> — Dynmap and BlueMap surfaces for <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> data.\n</li>\n</ul>\n<h2 id=\"distribution-and-hosting\">Distribution and hosting</h2>\n<ul>\n<li><a class=\"wl\" href=\"#/dans-plugin-manager\" data-id=\"dans-plugin-manager\">Dan's Plugin Manager</a> — installs DPC plugins from in-game or the console.\n</li>\n<li><a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a> — infrastructure-as-code server that runs a curated set of the plugins together, and therefore doubles as the integration test bed.\n</li>\n</ul>\n<h2 id=\"the-rest\">The rest</h2>\n<p>Many repositories in the organization are small standalone plugins with no dependency on the flagship. They matter to this collection mainly as subjects of <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a> — the standards effort exists precisely to bring them up to the flagship's level.</p>", "id": "moc-plugin-ecosystem", "links": ["ponder", "expansion-plugin", "medieval-factions", "fiefs", "currencies", "mailboxes", "notification", "map-integration", "claimed-chunk", "dans-plugin-manager", "dpc-mc-server", "dpc-conventions"], "sourcePath": "notes/moc/moc-plugin-ecosystem.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-plugin-ecosystem.md", "sources": [{"claim": "The community server ships a curated set of DPC plugins that can each be toggled via environment variables.", "label": "dpc-mc-server/README.md", "lines": "", "path": "README.md", "ref": "d42e0ec06f9b29baaa043442d24ef2dd81edfa49", "repo": "Dans-Plugins/dpc-mc-server", "shortRef": "d42e0ec", "url": "https://github.com/Dans-Plugins/dpc-mc-server/blob/d42e0ec06f9b29baaa043442d24ef2dd81edfa49/README.md"}], "summary": "The plugins around the flagship — the shared library, the official expansions, and the plugins Medieval Factions talks to at runtime.", "tags": ["moc", "dpc", "ecosystem"], "text": "plugin ecosystem the plugins around the flagship — the shared library, the official expansions, and the plugins medieval factions talks to at runtime. \nthe organization holds roughly forty repositories. they are not forty unrelated\nplugins — they cluster.\n\n## the library\n\n[[ponder]] is the shared kotlin/java library: a multi-module gradle project\nproviding command dispatch, caching, and bukkit helpers used across plugins.\n\n## the expansions\n\n[[expansion-plugin]] describes the pattern: a plugin that hard-depends on\n[[medieval-factions]] and extends the simulation rather than standing alone.\n\n- [[fiefs]] — sub-factions inside a faction.\n- [[currencies]] — faction-minted local money.\n\n## the runtime neighbours\n\nplugins the flagship detects and uses if they happen to be installed:\n\n- [[mailboxes]] — persistent player mail, used as a [[notification]] backend.\n- [[map-integration]] — dynmap and bluemap surfaces for [[claimed-chunk]] data.\n\n## distribution and hosting\n\n- [[dans-plugin-manager]] — installs dpc plugins from in-game or the console.\n- [[dpc-mc-server]] — infrastructure-as-code server that runs a curated set of\n  the plugins together, and therefore doubles as the integration test bed.\n\n## the rest\n\nmany repositories in the organization are small standalone plugins with no\ndependency on the flagship. they matter to this collection mainly as subjects of\n[[dpc-conventions]] — the standards effort exists precisely to bring them up to\nthe flagship's level.\n", "title": "Plugin Ecosystem", "toc": [{"level": 2, "slug": "the-library", "text": "The library"}, {"level": 2, "slug": "the-expansions", "text": "The expansions"}, {"level": 2, "slug": "the-runtime-neighbours", "text": "The runtime neighbours"}, {"level": 2, "slug": "distribution-and-hosting", "text": "Distribution and hosting"}, {"level": 2, "slug": "the-rest", "text": "The rest"}], "type": "moc", "updated": "2026-08-07"}, "moc-web-and-infrastructure": {"backlinks": ["moc-dans-plugins-community"], "html": "<p>Not everything in the organization runs inside Minecraft.</p>\n<h2 id=\"the-website\">The website</h2>\n<p><a class=\"wl\" href=\"#/dansplugins-dot-com\" data-id=\"dansplugins-dot-com\">dansplugins.com</a> is the community's public face: a Next.js application listing the plugins, hosting guides, and — since the addition of accounts — letting players claim a profile.</p>\n<h2 id=\"the-server\">The server</h2>\n<p><a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a> is an infrastructure-as-code Spigot server. It pins specific plugin JARs into a Docker image, which makes it the closest thing the organization has to an integration environment: if a change breaks the interaction between two plugins, this is where it shows up.</p>\n<h2 id=\"the-connection-between-them\">The connection between them</h2>\n<p><a class=\"wl\" href=\"#/dpc-api-faction-sync\" data-id=\"dpc-api-faction-sync\">DPC API Faction Sync</a> is the bridge. A running <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> server can be configured to POST its faction roster to the website's API on an interval, which is how live in-game data reaches a public web page.</p>\n<p>That path is the most operationally dangerous code in the organization, because a bad request does not corrupt one server's data — it corrupts the shared registry. The note explains the guards that exist because of it.</p>\n<h2 id=\"distribution\">Distribution</h2>\n<p><a class=\"wl\" href=\"#/dans-plugin-manager\" data-id=\"dans-plugin-manager\">Dan's Plugin Manager</a> closes the loop for server operators, pulling published plugin releases onto a running server without a manual download.</p>", "id": "moc-web-and-infrastructure", "links": ["dansplugins-dot-com", "dpc-mc-server", "dpc-api-faction-sync", "medieval-factions", "dans-plugin-manager"], "sourcePath": "notes/moc/moc-web-and-infrastructure.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/moc/moc-web-and-infrastructure.md", "sources": [], "summary": "The community website, the containerised Minecraft server, and t
