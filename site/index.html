      html += `<li><a class="${cls}" href="#/${id}">${esc(NOTES[id].title)}</a></li>`;
    }
    return html + "</ul>";
  };

  let html = group("Maps of Content", mocs) + group("Concepts", concepts);
  if (!match.length) html = `<div class="empty">No notes match “${esc(q)}”.</div>`;
  $("#nav").innerHTML = html;
}

function renderStats() {
  $("#stats").innerHTML =
    `<b>${META.noteCount}</b> notes · <b>${META.linkCount}</b> links<br>` +
    `<b>${META.citationCount}</b> citations from <b>${META.repos.length}</b> repos<br>` +
    `content as of ${esc(META.updated)}`;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ----------------------------------------------------------------- note */
let current = null;

function renderNote(id) {
  const n = NOTES[id];
  if (!n) {
    $("#note").innerHTML = `<h1>Not found</h1><p>No note with id <code>${esc(id)}</code>.</p>`;
    $("#rail").innerHTML = "";
    return;
  }
  current = id;

  const chips = [`<span class="chip type-${n.type}">${n.type === "moc" ? "Map of Content" : "Concept"}</span>`]
    .concat((n.tags || []).map((t) => `<a class="chip" href="#" data-tag="${esc(t)}">#${esc(t)}</a>`))
    .join("");

  $("#note").innerHTML =
    `<div class="kicker">${esc(n.id)}</div>` +
    `<h1>${esc(n.title)}</h1>` +
    (n.summary ? `<p class="summary">${esc(n.summary)}</p>` : "") +
    `<div class="chips">${chips}</div>` +
    `<div class="prose">${n.html}</div>`;

  const sources = n.sources.length
    ? n.sources.map((s) =>
        `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener">` +
        `<span class="claim">${esc(s.claim)}</span>` +
        `<span class="loc">${esc(s.repo)} · ${esc(s.path).replace(/\//g, "/<wbr>")}${s.lines ? ":" + esc(s.lines) : ""} @ <span class="sha">${esc(s.shortRef)}</span></span></a>`
      ).join("")
    : `<div class="rail-empty">No citations.</div>`;

  const linkList = (list) => list.length
    ? `<ul class="rail-list">${list.map((t) => {
        const target = NOTES[t];
        const cls = target && target.type === "moc" ? ' class="moc"' : "";
        return `<li><a href="#/${t}"${cls}>${esc(target ? target.title : t)}</a></li>`;
      }).join("")}</ul>`
    : `<div class="rail-empty">None.</div>`;

  const toc = n.toc.filter((h) => h.level <= 3);
  $("#rail").innerHTML =
    `<div class="rail-h">Sources of truth <span class="count">${n.sources.length}</span></div>${sources}` +
    (toc.length > 1 ? `<div class="rail-h">On this page</div><ul class="toc">${toc.map((h) => `<li class="lvl-${h.level}"><a href="#${h.slug}">${esc(h.text.replace(/\[\[|\]\]/g, ""))}</a></li>`).join("")}</ul>` : "") +
    `<div class="rail-h">Backlinks <span class="count">${n.backlinks.length}</span></div>${linkList(n.backlinks)}` +
    `<div class="rail-h">Links out <span class="count">${n.links.length}</span></div>${linkList(n.links)}` +
    `<div class="rail-h">Source file</div><ul class="rail-list"><li><a href="${esc(n.sourceUrl)}" target="_blank" rel="noopener">${esc(n.sourcePath)}</a></li></ul>`;

  $("#content").scrollTop = 0;
  renderNav($("#search").value);
}

/* ---------------------------------------------------------------- graph */
const nodes = ids.map((id) => ({ id, moc: NOTES[id].type === "moc", deg: NOTES[id].links.length + NOTES[id].backlinks.length }));
const nodeIndex = {};
nodes.forEach((n, i) => { nodeIndex[n.id] = i; });
const edges = [];
for (const id of ids) for (const t of NOTES[id].links) {
  if (nodeIndex[t] !== undefined) edges.push([nodeIndex[id], nodeIndex[t]]);
}

let view = { x: 0, y: 0, k: 1 };
let hover = null, graphReady = false;

function seedLayout(w, h) {
  nodes.forEach((n, i) => {
    // Deterministic spiral seed: same layout every load, no RNG.
    const a = i * 2.399963;
    const r = 38 * Math.sqrt(i + 1);
    n.x = w / 2 + r * Math.cos(a);
    n.y = h / 2 + r * Math.sin(a);
    n.vx = 0; n.vy = 0;
  });
}

function step() {
  // Ideal edge length. Scaled by node count so the graph keeps breathing room
  // as the collection grows rather than collapsing into a denser ball.
  const K = 78 + Math.sqrt(nodes.length) * 11;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 1000000) continue;
      const f = (K * K) / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  for (const [i, j] of edges) {
    const a = nodes[i], b = nodes[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const f = (d - K) * 0.045;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;
  for (const n of nodes) {
    n.vx += (cx - n.x) * 0.0022;
    n.vy += (cy - n.y) * 0.0022;
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += Math.max(-18, Math.min(18, n.vx));
    n.y += Math.max(-18, Math.min(18, n.vy));
  }
}

const canvas = $("#graph");
const ctx = canvas.getContext("2d");

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);

  const line = css("--line"), accent = css("--accent"), moc = css("--moc"), fg = css("--fg-dim");
  const near = hover === null ? null : new Set([hover].concat(
    edges.filter(([i, j]) => i === hover || j === hover).map(([i, j]) => (i === hover ? j : i))
  ));

  ctx.lineWidth = 1;
  for (const [i, j] of edges) {
    const lit = near && (near.has(i) && near.has(j));
    ctx.strokeStyle = lit ? accent : line;
    ctx.globalAlpha = near ? (lit ? 0.9 : 0.18) : 0.55;
    ctx.beginPath();
    ctx.moveTo(nodes[i].x, nodes[i].y);
    ctx.lineTo(nodes[j].x, nodes[j].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const r = 4.5 + Math.min(8, n.deg * 0.62);
    const dim = near && !near.has(i);
    ctx.globalAlpha = dim ? 0.25 : 1;
    ctx.fillStyle = n.moc ? moc : accent;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    if (n.id === current) {
      ctx.strokeStyle = fg; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 3.5, 0, Math.PI * 2); ctx.stroke();
    }
    if (view.k > 0.62 || n.moc || i === hover) {
      ctx.globalAlpha = dim ? 0.3 : 1;
      ctx.fillStyle = fg;
      ctx.font = `${i === hover ? 700 : 400} ${11 / Math.max(1, view.k * 0.85)}px ${css("--sans") || "sans-serif"}`;
      ctx.textAlign = "center";
      ctx.fillText(NOTES[n.id].title, n.x, n.y + r + 12);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

let ticks = 0;
function loop() {
  if ($("#graph-view").classList.contains("on")) {
    if (ticks < 700) { step(); ticks++; }
    draw();
  }
  requestAnimationFrame(loop);
}

function toGraphCoords(ev) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left - view.x) / view.k,
    y: (ev.clientY - rect.top - view.y) / view.k,
  };
}

function pick(pt) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const r = 8 + Math.min(7, n.deg * 0.65);
    if ((pt.x - n.x) ** 2 + (pt.y - n.y) ** 2 < r * r) return i;
  }
  return null;
}

let dragging = false, last = null;
canvas.addEventListener("mousedown", (e) => { dragging = true; last = { x: e.clientX, y: e.clientY }; });
window.addEventListener("mouseup", () => { dragging = false; });
canvas.addEventListener("mousemove", (e) => {
  if (dragging && last) {
    view.x += e.clientX - last.x; view.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
  } else {
    const h = pick(toGraphCoords(e));
    if (h !== hover) { hover = h; canvas.style.cursor = h === null ? "grab" : "pointer"; }
  }
});
canvas.addEventListener("click", (e) => {
  const i = pick(toGraphCoords(e));
  // Setting the hash is enough — route() switches back to the note view.
  if (i !== null) location.hash = "#/" + nodes[i].id;
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k = Math.max(0.25, Math.min(3, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
}, { passive: false });

/* ----------------------------------------------------------------- tabs */
function showNotes() {
  $("#graph-view").classList.remove("on");
  $("#content").classList.remove("hidden");
  $("#tab-notes").classList.add("on"); $("#tab-graph").classList.remove("on");
}
function showGraph() {
  $("#content").classList.add("hidden");
  $("#graph-view").classList.add("on");
  $("#tab-graph").classList.add("on"); $("#tab-notes").classList.remove("on");
  if (!graphReady) { seedLayout(canvas.clientWidth, canvas.clientHeight); graphReady = true; }
}
$("#tab-notes").onclick = showNotes;
$("#tab-graph").onclick = showGraph;

/* --------------------------------------------------------------- wiring */
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const id = hash.split("#")[0] || META.home;
  const anchor = hash.split("#")[1];
  if (NOTES[id]) {
    if (id !== current) renderNote(id);
    showNotes();
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } else if (hash && !document.getElementById(hash)) {
    renderNote(id);
  }
}
window.addEventListener("hashchange", route);

$("#search").addEventListener("input", (e) => renderNav(e.target.value));
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#search")) { e.preventDefault(); $("#search").focus(); }
  if (e.key === "Escape") { $("#search").value = ""; $("#search").blur(); renderNav(""); }
  if (e.key === "g" && document.activeElement !== $("#search")) showGraph();
});
document.addEventListener("click", (e) => {
  const tag = e.target.closest("[data-tag]");
  if (tag) { e.preventDefault(); $("#search").value = tag.dataset.tag; renderNav(tag.dataset.tag); showNotes(); }
});

$("#theme").onclick = () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
  try { localStorage.setItem("zk-theme", light ? "dark" : "light"); } catch (_) {}
};
try {
  const saved = localStorage.getItem("zk-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
    document.documentElement.setAttribute("data-theme", "light");
} catch (_) {}

renderStats();
renderNote(location.hash.replace(/^#\/?/, "").split("#")[0] || META.home);
route();
loop();
</script>
</body>
</html>
