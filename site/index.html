<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPC Zettelkasten</title>
<style>
  :root {
    --bg: #16171d;
    --bg-2: #1c1e26;
    --bg-3: #23262f;
    --line: #2f333d;
    --fg: #d6d9e0;
    --fg-dim: #8b91a0;
    --fg-faint: #656b7a;
    --accent: #a78bfa;
    --accent-dim: #7c5cf0;
    --moc: #f0a868;
    --code-bg: #12131a;
    --radius: 6px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    --bg: #fbfbfa; --bg-2: #f2f2ef; --bg-3: #e8e8e4; --line: #dcdcd6;
    --fg: #2a2b2e; --fg-dim: #62646b; --fg-faint: #8b8d94;
    --accent: #6d43d4; --accent-dim: #5730b8; --moc: #b06a1a; --code-bg: #f0efec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.65 var(--sans);
    display: grid; grid-template-rows: auto 1fr;
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 0 14px; height: 46px;
    background: var(--bg-2); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; letter-spacing: -0.2px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  header nav { display: flex; gap: 4px; }
  .tab {
    background: none; border: 0; color: var(--fg-dim); cursor: pointer;
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: var(--radius);
  }
  .tab:hover { background: var(--bg-3); color: var(--fg); }
  .tab.on { background: var(--bg-3); color: var(--fg); }
  .spacer { flex: 1; }
  #search {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--fg); font: inherit; font-size: 13px; padding: 5px 10px; width: 260px;
  }
  #search:focus { outline: none; border-color: var(--accent-dim); }
  .icon-btn {
    background: none; border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--fg-dim); cursor: pointer; font-size: 13px; padding: 4px 9px;
  }
  .icon-btn:hover { color: var(--fg); border-color: var(--fg-faint); }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: 262px minmax(0,1fr) 274px; min-height: 0; }
  aside { background: var(--bg-2); overflow-y: auto; padding: 14px 0 40px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); padding: 18px 16px 40px; }
  #content { overflow-y: auto; padding: 0; min-width: 0; }

  .sec-title {
    color: var(--fg-faint); font-size: 11px; font-weight: 650;
    letter-spacing: 0.09em; text-transform: uppercase;
    padding: 12px 16px 6px;
  }
  aside.left ul { list-style: none; margin: 0; padding: 0; }
  aside.left li a {
    color: var(--fg-dim); display: block; font-size: 13.5px;
    padding: 4px 16px 4px 20px; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  aside.left li a:hover { background: var(--bg-3); color: var(--fg); }
  aside.left li a.on {
    background: var(--bg-3); color: var(--fg);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  aside.left li a.moc { color: var(--moc); }
  .count { color: var(--fg-faint); font-size: 11px; float: right; }
  .empty { color: var(--fg-faint); font-size: 13px; padding: 6px 16px; font-style: italic; }

  /* ---------- note ---------- */
  article { max-width: 760px; margin: 0 auto; padding: 34px 40px 90px; }
  .kicker { color: var(--fg-faint); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  article h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.5px; }
  .summary { color: var(--fg-dim); font-size: 16px; margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .chip {
    background: var(--bg-3); border-radius: 999px; color: var(--fg-dim);
    font-size: 11.5px; padding: 2px 10px; text-decoration: none;
  }
  a.chip:hover { color: var(--fg); }
  .chip.type-moc { background: color-mix(in srgb, var(--moc) 22%, transparent); color: var(--moc); }
  .prose { border-top: 1px solid var(--line); padding-top: 22px; }
  .prose h2 { font-size: 20px; margin: 30px 0 8px; letter-spacing: -0.2px; }
  .prose h3 { font-size: 16px; margin: 22px 0 6px; color: var(--fg); }
  .prose p { margin: 0 0 13px; }
  .prose ul, .prose ol { margin: 0 0 13px; padding-left: 22px; }
  .prose li { margin-bottom: 4px; }
  .prose li > ul, .prose li > ol { margin-top: 4px; }
  .prose code {
    background: var(--code-bg); border-radius: 4px; font-family: var(--mono);
    font-size: 0.87em; padding: 1px 5px;
  }
  .prose pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius);
    margin: 0 0 14px; overflow-x: auto; padding: 12px 14px;
  }
  .prose pre code { background: none; font-size: 12.5px; padding: 0; }
  .prose blockquote {
    border-left: 3px solid var(--accent-dim); color: var(--fg-dim);
    margin: 0 0 14px; padding: 2px 0 2px 14px;
  }
  .prose hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .table-scroll { overflow-x: auto; margin-bottom: 14px; }
  .prose table { border-collapse: collapse; font-size: 13.5px; width: 100%; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .prose th { background: var(--bg-2); font-weight: 600; }
  .prose a { color: var(--accent); text-decoration: none; }
  .prose a:hover { text-decoration: underline; }
  a.wl { border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .wl.broken { color: #e06c75; border-bottom: 1px dashed #e06c75; cursor: help; }

  /* ---------- right rail ---------- */
  .rail-h {
    color: var(--fg-faint); font-size: 11px; font-weight: 650;
    letter-spacing: 0.09em; text-transform: uppercase; margin: 20px 0 8px;
  }
  .rail-h:first-child { margin-top: 0; }
  .rail-list { list-style: none; margin: 0; padding: 0; }
  .rail-list li { margin-bottom: 5px; }
  .rail-list a { color: var(--fg-dim); font-size: 13px; text-decoration: none; }
  .rail-list a:hover { color: var(--accent); }
  .rail-list a.moc { color: var(--moc); }
  .rail-empty { color: var(--fg-faint); font-size: 12.5px; font-style: italic; }
  .src {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius);
    display: block; margin-bottom: 8px; padding: 9px 11px; text-decoration: none;
  }
  .src:hover { border-color: var(--accent-dim); }
  .src .claim { color: var(--fg); display: block; font-size: 12.5px; line-height: 1.45; }
  .src .loc {
    color: var(--fg-faint); display: block; font-family: var(--mono);
    font-size: 10.5px; margin-top: 5px; overflow-wrap: anywhere;
  }
  .src .sha { color: var(--accent); }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc a { color: var(--fg-dim); font-size: 12.5px; text-decoration: none; }
  .toc a:hover { color: var(--fg); }
  .toc li.lvl-3 { padding-left: 12px; }

  /* ---------- graph ---------- */
  #graph-view { display: none; height: 100%; position: relative; }
  #graph-view.on { display: block; }
  #graph { display: block; height: 100%; width: 100%; cursor: grab; }
  #graph:active { cursor: grabbing; }
  .graph-legend {
    background: color-mix(in srgb, var(--bg-2) 92%, transparent);
    border: 1px solid var(--line); border-radius: var(--radius);
    font-size: 12px; left: 16px; padding: 10px 12px; position: absolute; top: 16px;
  }
  .graph-legend .row { align-items: center; display: flex; gap: 7px; margin-bottom: 4px; }
  .graph-legend .row:last-child { margin: 0; color: var(--fg-faint); }
  .dot { border-radius: 50%; height: 9px; width: 9px; }
  #content.hidden { display: none; }

  .stats { color: var(--fg-faint); font-size: 12px; padding: 14px 16px 0; line-height: 1.7; }
  .stats b { color: var(--fg-dim); font-weight: 600; }

  @media (max-width: 1100px) { aside.right { display: none; } main { grid-template-columns: 240px 1fr; } }
  @media (max-width: 760px) { aside.left { display: none; } main { grid-template-columns: 1fr; } #search { width: 150px; } }
</style>
</head>
<body>
<header>
  <div class="brand">DPC <span>Zettelkasten</span></div>
  <nav>
    <button class="tab on" id="tab-notes">Notes</button>
    <button class="tab" id="tab-graph">Graph</button>
  </nav>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Search notes…  (/)" autocomplete="off">
  <button class="icon-btn" id="theme">◐</button>
</header>

<main>
  <aside class="left">
    <div id="nav"></div>
    <div class="stats" id="stats"></div>
  </aside>

  <div id="content"><article id="note"></article></div>

  <div id="graph-view">
    <canvas id="graph"></canvas>
    <div class="graph-legend">
      <div class="row"><span class="dot" style="background:var(--moc)"></span> Map of Content</div>
      <div class="row"><span class="dot" style="background:var(--accent)"></span> Concept note</div>
      <div class="row">drag to pan · scroll to zoom · click a node</div>
    </div>
  </div>

  <aside class="right" id="rail"></aside>
</main>

 proposal and its acceptance.\n\n## exactly three types\n\n`war`, `ally`, `vassalize` — and each is a [[faction-relationship]] transition.\nthat the enum has no fourth member is the point: every action that binds two\nindependent groups of players goes through this mechanism, and everything else in\nthe plugin is unilateral.\n\n## why war needs approval\n\nalliance and vassalisation obviously require the other side's consent. war is\nthe interesting case, and the design treats it as a *mutual* state rather than\nsomething one faction inflicts on another. a faction cannot be dragged into a war\nit has not accepted — which is what makes the `neutral` [[faction-flag]] and the\n`pvp.warrequiredforplayersofdifferentfactions` setting meaningful rather than\ntrivially bypassable.\n\n## localised by construction\n\neach type carries a `languagekey` rather than a display string. the pattern\nappears throughout the plugin: domain enums know their language key, and the\nlanguage file supplies the words. it keeps translations out of the domain model\nand means adding a locale never touches kotlin.\n\n## related\n\nthe request itself is short-lived state held by `mfapprovalrequestservice` and\naddressed through an [[value-class-identifier]], like every other record in the\nplugin.\n", "title": "Approval Request", "toc": [{"level": 2, "slug": "exactly-three-types", "text": "Exactly three types"}, {"level": 2, "slug": "why-war-needs-approval", "text": "Why war needs approval"}, {"level": 2, "slug": "localised-by-construction", "text": "Localised by construction"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "claimed-chunk": {"backlinks": ["demesne-limit", "dpc-api-faction-sync", "faction", "faction-flag", "faction-permission", "fiefs", "locked-block", "map-integration", "moc-faction-domain-model", "moc-medieval-factions", "moc-plugin-ecosystem"], "html": "<p>A claim is a single Minecraft chunk — a 16×16 column — assigned to a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>. There is no polygon, no region, and no bounding box: territory is a set of chunk coordinates, and every question about land reduces to a lookup on <code>(worldId, x, z)</code>.</p>\n<h2 id=\"the-shape-of-the-record\">The shape of the record</h2>\n<p><code>MfClaimedChunk</code> holds four fields and no behaviour: the world UUID, the chunk's <code>x</code> and <code>z</code>, and the owning <code>factionId</code>. It is the smallest record that can answer &quot;who owns this ground?&quot;, and it holds nothing else.</p>\n<p>Note the direction of the reference. The chunk points at the faction; the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record does not hold a list of its claims. Territory is therefore queried, not traversed — which is why <code>MfClaimService</code> exists and why counting a faction's claims is a repository call rather than a property read.</p>\n<h2 id=\"why-chunks\">Why chunks</h2>\n<p>Chunk granularity is inherited from Minecraft itself. The server already loads, unloads, and indexes the world by chunk, so a claim boundary that coincides with a chunk boundary is free to check: given a block, the containing chunk is arithmetic, and the ownership lookup is a single map hit. A finer boundary would have cost a spatial index on the hot path of every block placement.</p>\n<p>The visible consequence for players is that borders are always square and always aligned to the world grid — which is also what makes <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> cheap to render.</p>\n<h2 id=\"what-a-claim-controls\">What a claim controls</h2>\n<p>Ownership by itself grants nothing. Whether a given player may build inside a claim is resolved from <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> for members and from <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> settings for outsiders, allies, and the <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> chain.</p>\n<h2 id=\"related\">Related</h2>\n<p>How <em>much</em> land a faction may claim is capped by <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>, derived from <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a>. Claims are also the payload that <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> renders and that <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> subdivides.</p>", "id": "claimed-chunk", "links": ["faction", "map-integration", "faction-permission", "faction-flag", "vassalage", "demesne-limit", "faction-power", "fiefs"], "sourcePath": "notes/concepts/claimed-chunk.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/claimed-chunk.md", "sources": [{"claim": "A claimed chunk is a data class of worldId, x, z, and factionId, with convenience constructors from a Bukkit Chunk and from an MfChunkPosition.", "label": "Medieval-Factions/MfClaimedChunk.kt:8-17", "lines": "8-17", "path": "src/main/kotlin/com/dansplugins/factionsystem/claim/MfClaimedChunk.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/claim/MfClaimedChunk.kt#L8-L17"}], "summary": "Territory is recorded one 16×16 Minecraft chunk at a time, as a row pointing from world coordinates to a faction.", "tags": ["medieval-factions", "domain-model", "territory"], "text": "claimed chunk territory is recorded one 16×16 minecraft chunk at a time, as a row pointing from world coordinates to a faction. \na claim is a single minecraft chunk — a 16×16 column — assigned to a [[faction]].\nthere is no polygon, no region, and no bounding box: territory is a set of chunk\ncoordinates, and every question about land reduces to a lookup on\n`(worldid, x, z)`.\n\n## the shape of the record\n\n`mfclaimedchunk` holds four fields and no behaviour: the world uuid, the chunk's\n`x` and `z`, and the owning `factionid`. it is the smallest record that can answer\n\"who owns this ground?\", and it holds nothing else.\n\nnote the direction of the reference. the chunk points at the faction; the\n[[faction]] record does not hold a list of its claims. territory is therefore\nqueried, not traversed — which is why `mfclaimservice` exists and why counting a\nfaction's claims is a repository call rather than a property read.\n\n## why chunks\n\nchunk granularity is inherited from minecraft itself. the server already loads,\nunloads, and indexes the world by chunk, so a claim boundary that coincides with\na chunk boundary is free to check: given a block, the containing chunk is\narithmetic, and the ownership lookup is a single map hit. a finer boundary would\nhave cost a spatial index on the hot path of every block placement.\n\nthe visible consequence for players is that borders are always square and always\naligned to the world grid — which is also what makes [[map-integration]] cheap to\nrender.\n\n## what a claim controls\n\nownership by itself grants nothing. whether a given player may build inside a\nclaim is resolved from [[faction-permission]] for members and from\n[[faction-flag]] settings for outsiders, allies, and the [[vassalage]] chain.\n\n## related\n\nhow *much* land a faction may claim is capped by [[demesne-limit]], derived from\n[[faction-power]]. claims are also the payload that\n[[map-integration]] renders and that [[fiefs]] subdivides.\n", "title": "Claimed Chunk", "toc": [{"level": 2, "slug": "the-shape-of-the-record", "text": "The shape of the record"}, {"level": 2, "slug": "why-chunks", "text": "Why chunks"}, {"level": 2, "slug": "what-a-claim-controls", "text": "What a claim controls"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "currencies": {"backlinks": ["dpc-mc-server", "expansion-plugin", "fiefs", "moc-medieval-factions", "moc-plugin-ecosystem"], "html": "<p>Currencies lets the owner of a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> create and mint a local currency. Money is physical: a currency owns an <code>ItemStack</code>, and minting produces real items that players carry, drop, and lose.</p>\n<h2 id=\"physical-money\">Physical money</h2>\n<p>That choice has consequences the plugin then has to handle. Currency items can be renamed in an anvil, placed as blocks, and moved between inventories — hence <code>PrepareAnvilListener</code>, <code>BlockPlaceListener</code>, <code>InventoryClickListener</code>, and <code>InventoryCloseListener</code>. A large part of the codebase exists to stop players from counterfeiting or destroying money through ordinary Minecraft mechanics.</p>\n<p>Alongside the physical form there is a <code>Balance</code> record and a coinpurse UI, so the abstract and concrete representations coexist.</p>\n<h2 id=\"lifecycle-tied-to-the-faction\">Lifecycle tied to the faction</h2>\n<p><code>Currency</code> carries a <code>factionId</code> and a <code>CurrencyStatus</code>. When a faction disbands, <code>FactionDisbandListener</code> — subscribed to <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> — walks that faction's currencies and saves each one with status <code>RETIRED</code>. Nothing is deleted.</p>\n<p>Coins already minted therefore survive the state that issued them. That is both historically apt and the practical option: the money is <code>ItemStack</code>s spread across player inventories, chests, and the ground, and nothing in the plugin could recall them.</p>\n<h2 id=\"a-faithful-copy-of-the-flagship-s-architecture\">A faithful copy of the flagship's architecture</h2>\n<p>Currencies repeats the flagship's shape almost line for line: <code>CurrencyId</code> as a <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a>, a <code>version</code> column for <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a>, a <code>CurrencyRepository</code> interface with a <code>JooqCurrencyRepository</code> implementation, a <code>Services</code> registry, and its own Flyway migrations over its own Hikari pool.</p>\n<p>The <code>legacyId</code> field is the tell that it, too, has been migrated from an earlier storage format.</p>\n<h2 id=\"related\">Related</h2>\n<p>See <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a> for the pattern in general, and <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> for the older style it replaced.</p>", "id": "currencies", "links": ["faction", "faction-events", "value-class-identifier", "optimistic-locking", "expansion-plugin", "fiefs"], "sourcePath": "notes/concepts/currencies.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/currencies.md", "sources": [{"claim": "A currency is a data class of id, version, factionId, name, description, an ItemStack, an amount, a status and a nullable legacy id.", "label": "Currencies/Currency.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/currencies/currency/Currency.kt", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/kotlin/com/dansplugins/currencies/currency/Currency.kt"}, {"claim": "Currencies builds its own Hikari data source, Flyway migrations, jOOQ DSL and Services registry, and holds a reference to the MedievalFactions plugin instance.", "label": "Currencies/Currencies.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/currencies/Currencies.kt", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/kotlin/com/dansplugins/currencies/Currencies.kt"}, {"claim": "On a FactionDisbandEvent every currency belonging to that faction that is not already retired is saved with status RETIRED, rather than deleted.", "label": "Currencies/FactionDisbandListener.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/currencies/listener/FactionDisbandListener.kt", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/kotlin/com/dansplugins/currencies/listener/FactionDisbandListener.kt"}], "summary": "An expansion letting factions mint physical local currencies as item stacks, and the reference example of a modern Medieval Factions expansion.", "tags": ["currencies", "expansion", "ecosystem", "economy"], "text": "currencies an expansion letting factions mint physical local currencies as item stacks, and the reference example of a modern medieval factions expansion. \ncurrencies lets the owner of a [[faction]] create and mint a local currency.\nmoney is physical: a currency owns an `itemstack`, and minting produces real\nitems that players carry, drop, and lose.\n\n## physical money\n\nthat choice has consequences the plugin then has to handle. currency items can\nbe renamed in an anvil, placed as blocks, and moved between inventories — hence\n`prepareanvillistener`, `blockplacelistener`, `inventoryclicklistener`, and\n`inventorycloselistener`. a large part of the codebase exists to stop players\nfrom counterfeiting or destroying money through ordinary minecraft mechanics.\n\nalongside the physical form there is a `balance` record and a coinpurse ui, so\nthe abstract and concrete representations coexist.\n\n## lifecycle tied to the faction\n\n`currency` carries a `factionid` and a `currencystatus`. when a faction\ndisbands, `factiondisbandlistener` — subscribed to [[faction-events]] — walks\nthat faction's currencies and saves each one with status `retired`. nothing is\ndeleted.\n\ncoins already minted therefore survive the state that issued them. that is both\nhistorically apt and the practical option: the money is `itemstack`s spread\nacross player inventories, chests, and the ground, and nothing in the plugin\ncould recall them.\n\n## a faithful copy of the flagship's architecture\n\ncurrencies repeats the flagship's shape almost line for line: `currencyid` as a\n[[value-class-identifier]], a `version` column for [[optimistic-locking]], a\n`currencyrepository` interface with a `jooqcurrencyrepository` implementation, a\n`services` registry, and its own flyway migrations over its own hikari pool.\n\nthe `legacyid` field is the tell that it, too, has been migrated from an earlier\nstorage format.\n\n## related\n\nsee [[expansion-plugin]] for the pattern in general, and [[fiefs]] for the older\nstyle it replaced.\n", "title": "Currencies", "toc": [{"level": 2, "slug": "physical-money", "text": "Physical money"}, {"level": 2, "slug": "lifecycle-tied-to-the-faction", "text": "Lifecycle tied to the faction"}, {"level": 2, "slug": "a-faithful-copy-of-the-flagship-s-architecture", "text": "A faithful copy of the flagship's architecture"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "dans-plugin-manager": {"backlinks": ["dpc-mc-server", "moc-plugin-ecosystem", "moc-web-and-infrastructure", "release-automation"], "html": "<p>DPM is a package manager for the community's own plugins, run from inside a Minecraft server. <code>/dpm get medieval-factions</code> downloads the latest release jar into the plugins folder.</p>\n<h2 id=\"a-package-manager-s-vocabulary\">A package manager's vocabulary</h2>\n<p>The command set is the giveaway: <code>list</code>, <code>get</code>, <code>update</code>, <code>remove</code>, <code>search</code>, <code>info</code>, <code>clean</code>. These are apt and dnf commands, ported to a game console.</p>\n<p><code>/dpm info</code> is the most useful of them — it reports the GitHub owner and repo, the latest release tag and publish date, whether the plugin is installed, and <strong>whether its dependencies are satisfied</strong>. That last field matters in an ecosystem where <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">expansions</a> hard-depend on <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> and simply fail to load without it.</p>\n<p><code>/dpm clean</code> addresses the failure mode that follows from downloading jars: two versions of the same plugin left in the folder. Like <code>remove</code>, it previews by default and requires <code>--confirm</code> to actually delete — a good default for a command that removes files from a live server.</p>\n<h2 id=\"github-releases-as-the-registry\">GitHub releases as the registry</h2>\n<p>There is no separate package index. DPM reads GitHub releases directly, which is why <a class=\"wl\" href=\"#/release-automation\" data-id=\"release-automation\">Release Automation</a> matters operationally rather than merely cosmetically: a release without an attached jar is invisible to DPM. A configurable <code>githubToken</code> exists for rate limits.</p>\n<h2 id=\"related\">Related</h2>\n<p>DPM solves plugin distribution for an operator's own server; <a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a> solves it by pinning jars into a Docker image instead. The two answer the same question with opposite trade-offs — live and current, versus reproducible and fixed.</p>", "id": "dans-plugin-manager", "links": ["expansion-plugin", "medieval-factions", "release-automation", "dpc-mc-server"], "sourcePath": "notes/concepts/dans-plugin-manager.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/dans-plugin-manager.md", "sources": [{"claim": "Dan's Plugin Manager lets server operators download DPC plugins in-game or from the server console.", "label": "Dans-Plugin-Manager/README.md", "lines": "", "path": "README.md", "ref": "7b302f2820a017373558a50f752697226f9ec975", "repo": "Dans-Plugins/Dans-Plugin-Manager", "shortRef": "7b302f2", "url": "https://github.com/Dans-Plugins/Dans-Plugin-Manager/blob/7b302f2820a017373558a50f752697226f9ec975/README.md"}, {"claim": "The command set covers list, get, update, remove, clean, search, info, stats and reload, with info reporting the GitHub owner, repo, latest release tag, publish date, install status and dependency status.", "label": "Dans-Plugin-Manager/COMMANDS.md", "lines": "", "path": "COMMANDS.md", "ref": "7b302f2820a017373558a50f752697226f9ec975", "repo": "Dans-Plugins/Dans-Plugin-Manager", "shortRef": "7b302f2", "url": "https://github.com/Dans-Plugins/Dans-Plugin-Manager/blob/7b302f2820a017373558a50f752697226f9ec975/COMMANDS.md"}], "summary": "A plugin that installs other DPC plugins from in-game or the console, pulling releases straight from GitHub.", "tags": ["dpm", "ecosystem", "tooling"], "text": "dan's plugin manager a plugin that installs other dpc plugins from in-game or the console, pulling releases straight from github. \ndpm is a package manager for the community's own plugins, run from inside a\nminecraft server. `/dpm get medieval-factions` downloads the latest release jar\ninto the plugins folder.\n\n## a package manager's vocabulary\n\nthe command set is the giveaway: `list`, `get`, `update`, `remove`, `search`,\n`info`, `clean`. these are apt and dnf commands, ported to a game console.\n\n`/dpm info` is the most useful of them — it reports the github owner and repo,\nthe latest release tag and publish date, whether the plugin is installed, and\n**whether its dependencies are satisfied**. that last field matters in an\necosystem where [[expansion-plugin|expansions]] hard-depend on\n[[medieval-factions]] and simply fail to load without it.\n\n`/dpm clean` addresses the failure mode that follows from downloading jars: two\nversions of the same plugin left in the folder. like `remove`, it previews by\ndefault and requires `--confirm` to actually delete — a good default for a\ncommand that removes files from a live server.\n\n## github releases as the registry\n\nthere is no separate package index. dpm reads github releases directly, which is\nwhy [[release-automation]] matters operationally rather than merely\ncosmetically: a release without an attached jar is invisible to dpm. a\nconfigurable `githubtoken` exists for rate limits.\n\n## related\n\ndpm solves plugin distribution for an operator's own server;\n[[dpc-mc-server]] solves it by pinning jars into a docker image instead. the two\nanswer the same question with opposite trade-offs — live and current, versus\nreproducible and fixed.\n", "title": "Dan's Plugin Manager", "toc": [{"level": 2, "slug": "a-package-manager-s-vocabulary", "text": "A package manager's vocabulary"}, {"level": 2, "slug": "github-releases-as-the-registry", "text": "GitHub releases as the registry"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "dansplugins-dot-com": {"backlinks": ["dpc-api-faction-sync", "moc-dans-plugins-community", "moc-medieval-factions", "moc-web-and-infrastructure"], "html": "<p>dansplugins.com is the community's public face: a Next.js and MUI application listing the plugins, hosting guides, and — since accounts were added — letting players claim a profile and like things.</p>\n<h2 id=\"a-front-end-not-a-backend\">A front end, not a backend</h2>\n<p>The site holds almost no data of its own. <code>utils/apiBase.ts</code> resolves a separate <strong>dpc-api</strong> service from <code>NEXT_PUBLIC_API_URL</code>, and the <code>services/</code> directory is a set of thin clients against it: <code>claimService</code>, <code>likeService</code>, <code>profileService</code>, <code>backlogService</code>, <code>featureRequestService</code>, <code>visitService</code>.</p>\n<p>That separation is why this repository is TypeScript with no database. It also means the site is not the receiving end of <a class=\"wl\" href=\"#/dpc-api-faction-sync\" data-id=\"dpc-api-faction-sync\">DPC API Faction Sync</a> — dpc-api is, and the site reads what dpc-api stores.</p>\n<h2 id=\"failing-soft\">Failing soft</h2>\n<p>The service clients wrap their fetches in <code>try</code>/<code>catch</code> and return an empty array on any error. A page whose data call fails renders empty rather than erroring.</p>\n<p>For a public site whose backend is a separately deployed service, that is the right default: a visitor browsing the plugin list should not see a 500 because the likes endpoint is down. The trade-off is that a genuine outage looks identical to &quot;there is nothing here&quot;.</p>\n<h2 id=\"more-than-a-brochure\">More than a brochure</h2>\n<p>The <code>pages/</code> directory shows the scope: a plugin index, guides, news, a roadmap, a leaderboard, commissions, a developer portal, per-user profile pages at <code>/u/[username]</code>, plus <code>sitemap.xml</code> and <code>robots.txt</code> generated server-side. The <code>__tests__/</code> directory holds a test file for most modules in <code>services/</code> and <code>utils/</code>, run with Vitest.</p>\n<h2 id=\"related\">Related</h2>\n<p>Static plugin metadata lives in <code>pages/data/plugins.json</code>, checked into the repository — the directory of plugins is versioned, while the live data behind it is not.</p>", "id": "dansplugins-dot-com", "links": ["dpc-api-faction-sync"], "sourcePath": "notes/concepts/dansplugins-dot-com.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/dansplugins-dot-com.md", "sources": [{"claim": "The site is a Next.js application serving as the central hub for the community at dansplugins.com, showcasing plugins and linking to documentation and support.", "label": "dansplugins-dot-com/README.md", "lines": "", "path": "README.md", "ref": "21faae72f893a5267d4d754a0fd97d1c183f3aba", "repo": "Dans-Plugins/dansplugins-dot-com", "shortRef": "21faae7", "url": "https://github.com/Dans-Plugins/dansplugins-dot-com/blob/21faae72f893a5267d4d754a0fd97d1c183f3aba/README.md"}, {"claim": "The site resolves a separate dpc-api backend from the NEXT_PUBLIC_API_URL environment variable, defaulting to a local dev-portal origin.", "label": "dansplugins-dot-com/apiBase.ts", "lines": "", "path": "utils/apiBase.ts", "ref": "21faae72f893a5267d4d754a0fd97d1c183f3aba", "repo": "Dans-Plugins/dansplugins-dot-com", "shortRef": "21faae7", "url": "https://github.com/Dans-Plugins/dansplugins-dot-com/blob/21faae72f893a5267d4d754a0fd97d1c183f3aba/utils/apiBase.ts"}], "summary": "The community's Next.js website — plugin directory, guides, and player accounts — backed by a separate dpc-api service.", "tags": ["dpc", "web"], "text": "dansplugins.com the community's next.js website — plugin directory, guides, and player accounts — backed by a separate dpc-api service. \ndansplugins.com is the community's public face: a next.js and mui application\nlisting the plugins, hosting guides, and — since accounts were added — letting\nplayers claim a profile and like things.\n\n## a front end, not a backend\n\nthe site holds almost no data of its own. `utils/apibase.ts` resolves a separate\n**dpc-api** service from `next_public_api_url`, and the `services/` directory is\na set of thin clients against it: `claimservice`, `likeservice`,\n`profileservice`, `backlogservice`, `featurerequestservice`, `visitservice`.\n\nthat separation is why this repository is typescript with no database. it also\nmeans the site is not the receiving end of [[dpc-api-faction-sync]] — dpc-api\nis, and the site reads what dpc-api stores.\n\n## failing soft\n\nthe service clients wrap their fetches in `try`/`catch` and return an empty\narray on any error. a page whose data call fails renders empty rather than\nerroring.\n\nfor a public site whose backend is a separately deployed service, that is the\nright default: a visitor browsing the plugin list should not see a 500 because\nthe likes endpoint is down. the trade-off is that a genuine outage looks\nidentical to \"there is nothing here\".\n\n## more than a brochure\n\nthe `pages/` directory shows the scope: a plugin index, guides, news, a roadmap,\na leaderboard, commissions, a developer portal, per-user profile pages at\n`/u/[username]`, plus `sitemap.xml` and `robots.txt` generated server-side. the\n`__tests__/` directory holds a test file for most modules in `services/` and\n`utils/`, run with vitest.\n\n## related\n\nstatic plugin metadata lives in `pages/data/plugins.json`, checked into the\nrepository — the directory of plugins is versioned, while the live data behind\nit is not.\n", "title": "dansplugins.com", "toc": [{"level": 2, "slug": "a-front-end-not-a-backend", "text": "A front end, not a backend"}, {"level": 2, "slug": "failing-soft", "text": "Failing soft"}, {"level": 2, "slug": "more-than-a-brochure", "text": "More than a brochure"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "demesne-limit": {"backlinks": ["claimed-chunk", "faction-power", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "player-power", "vassalage"], "html": "<p>A faction may hold one <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> per point of <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a>. The check is literally <code>claims + newChunks &gt; faction.power</code> — power and land are measured in the same unit.</p>\n<h2 id=\"the-rule-in-practice\">The rule in practice</h2>\n<p>The comparison is gated on the <code>factions.limitLand</code> configuration flag, so a server can turn it off entirely. When it is on, a faction that tries to claim past its allowance is refused with the <em>demesne limit</em> message and the count it is allowed, floored to a whole number.</p>\n<p>The plugin's own language key calls this the demesne limit. A demesne is the land a medieval lord held directly, as distinct from land held by vassals — which is the same distinction <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> draws mechanically.</p>\n<h2 id=\"why-it-is-the-keystone\">Why it is the keystone</h2>\n<p>This one inequality is what makes the rest of the simulation cohere. Because <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a> rises with time online and falls on death, and because <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> sums it, territory becomes a function of an organisation's living activity. Three consequences follow:</p>\n<ul>\n<li><strong>Land must be staffed.</strong> A faction cannot claim an empire and walk away.\n</li>\n<li><strong>War has a territorial outcome even without sieges.</strong> Killing defenders lowers their power, which lowers the limit, which puts existing claims over the line.\n</li>\n<li><strong>Growth requires recruitment.</strong> The only sustainable way to expand the map is to expand the roster — or to acquire vassals, which is what <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> pays for.\n</li>\n</ul>\n<h2 id=\"over-claiming\">Over-claiming</h2>\n<p>Because power is computed live and claims are stored, a faction can end up holding <em>more</em> land than its current power allows — the limit is enforced when claiming, not continuously. Related checks in the claim commands compare a faction's power against its existing claim count when land changes hands, which is how over-extended factions become vulnerable rather than merely capped.</p>\n<h2 id=\"related\">Related</h2>\n<p><a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> describes what is being counted; <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> describes what is doing the counting.</p>", "id": "demesne-limit", "links": ["claimed-chunk", "faction-power", "vassalage", "player-power"], "sourcePath": "notes/concepts/demesne-limit.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/demesne-limit.md", "sources": [{"claim": "When factions.limitLand is enabled, a claim is refused if the new chunks plus existing claims would exceed the faction's power, and the player is told they reached the demesne limit.", "label": "Medieval-Factions/MfFactionClaimFillCommand.kt:109-110", "lines": "109-110", "path": "src/main/kotlin/com/dansplugins/factionsystem/command/faction/claim/MfFactionClaimFillCommand.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/command/faction/claim/MfFactionClaimFillCommand.kt#L109-L110"}, {"claim": "The same limitLand check and demesne-limit message are applied by the circle-claim command.", "label": "Medieval-Factions/MfFactionClaimCircleCommand.kt:109-110", "lines": "109-110", "path": "src/main/kotlin/com/dansplugins/factionsystem/command/faction/claim/MfFactionClaimCircleCommand.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/command/faction/claim/MfFactionClaimCircleCommand.kt#L109-L110"}], "summary": "The rule binding land to power — a faction may hold at most one chunk per point of faction power.", "tags": ["medieval-factions", "domain-model", "territory", "power"], "text": "demesne limit the rule binding land to power — a faction may hold at most one chunk per point of faction power. \na faction may hold one [[claimed-chunk]] per point of [[faction-power]]. the\ncheck is literally `claims + newchunks > faction.power` — power and land are\nmeasured in the same unit.\n\n## the rule in practice\n\nthe comparison is gated on the `factions.limitland` configuration flag, so a\nserver can turn it off entirely. when it is on, a faction that tries to claim\npast its allowance is refused with the *demesne limit* message and the count it\nis allowed, floored to a whole number.\n\nthe plugin's own language key calls this the demesne limit. a demesne is the\nland a medieval lord held directly, as distinct from land held by vassals —\nwhich is the same distinction [[vassalage]] draws mechanically.\n\n## why it is the keystone\n\nthis one inequality is what makes the rest of the simulation cohere. because\n[[player-power]] rises with time online and falls on death, and because\n[[faction-power]] sums it, territory becomes a function of an organisation's\nliving activity. three consequences follow:\n\n- **land must be staffed.** a faction cannot claim an empire and walk away.\n- **war has a territorial outcome even without sieges.** killing defenders\n  lowers their power, which lowers the limit, which puts existing claims over\n  the line.\n- **growth requires recruitment.** the only sustainable way to expand the map is\n  to expand the roster — or to acquire vassals, which is what [[vassalage]] pays\n  for.\n\n## over-claiming\n\nbecause power is computed live and claims are stored, a faction can end up\nholding *more* land than its current power allows — the limit is enforced when\nclaiming, not continuously. related checks in the claim commands compare a\nfaction's power against its existing claim count when land changes hands, which\nis how over-extended factions become vulnerable rather than merely capped.\n\n## related\n\n[[claimed-chunk]] describes what is being counted; [[faction-power]] describes\nwhat is doing the counting.\n", "title": "Demesne Limit", "toc": [{"level": 2, "slug": "the-rule-in-practice", "text": "The rule in practice"}, {"level": 2, "slug": "why-it-is-the-keystone", "text": "Why it is the keystone"}, {"level": 2, "slug": "over-claiming", "text": "Over-claiming"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "dpc-api-faction-sync": {"backlinks": ["dansplugins-dot-com", "main-thread-safety", "medieval-factions", "moc-medieval-factions", "moc-web-and-infrastructure"], "html": "<p>A <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> server can be configured to POST its faction roster to the community API, which is how live in-game data reaches <a class=\"wl\" href=\"#/dansplugins-dot-com\" data-id=\"dansplugins-dot-com\">dansplugins.com</a>. It is off by default.</p>\n<h2 id=\"the-wire-format\">The wire format</h2>\n<p>Each faction becomes a <code>DpcFactionPayload</code>: <code>name</code>, <code>serverId</code>, <code>memberCount</code>, <code>description</code>, and optionally <code>serverIp</code> and <code>discordLink</code>. The whole roster is sent as one JSON array with an <code>X-API-Key</code> header, on a timer whose interval is configurable with a one-minute floor.</p>\n<p>Notably absent: <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a>, <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a> counts, player names, UUIDs. The payload is a public directory listing, not a data export.</p>\n<h2 id=\"the-empty-roster-guard\">The empty-roster guard</h2>\n<p>The most important nine lines in the file refuse to send an empty array, and the reasoning is written into the comment beside them.</p>\n<p>The provider already treats an empty array as a no-op, so sending one accomplishes nothing. Skipping it here is <em>defence in depth</em>: a transient empty read — faction data not yet loaded during startup, or a reload landing mid-cycle — can then never reach the wire at all, rather than reaching it and depending on the provider's guards to avoid what the comment calls a faction wipe.</p>\n<p>The shape of the risk is what makes this worth a note. A POST carries the server's whole roster, so a bad read is not a bad row — it is a bad <em>replacement set</em>, and the blast radius is a shared registry other people's servers appear in. Two independent guards for one failure is proportionate when the failure is someone else's data.</p>\n<h2 id=\"other-guards-in-the-same-file\">Other guards in the same file</h2>\n<ul>\n<li>The URL is validated as an absolute <code>http</code>/<code>https</code> URI before use.\n</li>\n<li>A plain-<code>http</code> URL logs a one-time warning that the API key will travel unencrypted.\n</li>\n<li>Strings are truncated to maximum lengths before sending.\n</li>\n<li>Response bodies are truncated before logging, and the API key is never logged.\n</li>\n<li>A malformed Discord link is dropped from the payload rather than sent.\n</li>\n</ul>\n<h2 id=\"threading\">Threading</h2>\n<p>Collection runs on the main thread, dispatch runs asynchronously — see <a class=\"wl\" href=\"#/main-thread-safety\" data-id=\"main-thread-safety\">Main Thread Safety</a>, for which this file is the reference example.</p>\n<h2 id=\"related\">Related</h2>\n<p>The receiving end is a separate <code>dpc-api</code> service that also backs <a class=\"wl\" href=\"#/dansplugins-dot-com\" data-id=\"dansplugins-dot-com\">dansplugins.com</a>; the website reads from it rather than from Minecraft.</p>", "id": "dpc-api-faction-sync", "links": ["medieval-factions", "dansplugins-dot-com", "faction-power", "claimed-chunk", "main-thread-safety"], "sourcePath": "notes/concepts/dpc-api-faction-sync.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/dpc-api-faction-sync.md", "sources": [{"claim": "The sync payload for one faction is name, serverId, memberCount, description, and optional serverIp and discordLink.", "label": "Medieval-Factions/DpcFactionPayload.kt:7-14", "lines": "7-14", "path": "src/main/kotlin/com/dansplugins/factionsystem/dpc/DpcFactionPayload.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/dpc/DpcFactionPayload.kt#L7-L14"}, {"claim": "An empty roster is never POSTed, because a transient empty read during startup or a reload could otherwise reach the wire and rely on the provider's guards to avoid a faction wipe.", "label": "Medieval-Factions/MfDpcApiService.kt:154-162", "lines": "154-162", "path": "src/main/kotlin/com/dansplugins/factionsystem/dpc/MfDpcApiService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/dpc/MfDpcApiService.kt#L154-L162"}, {"claim": "The dpc-api config block is disabled by default and holds url, key, server-id, login-reminder, share-server-ip, server-address, discord-link and sync-interval-minutes.", "label": "Medieval-Factions/config.yml:271-281", "lines": "271-281", "path": "src/main/resources/config.yml", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/resources/config.yml#L271-L281"}], "summary": "A running server can push its faction roster to the community API on a timer — the one code path where a Minecraft server writes to shared public data.", "tags": ["medieval-factions", "integration", "web", "dpc"], "text": "dpc api faction sync a running server can push its faction roster to the community api on a timer — the one code path where a minecraft server writes to shared public data. \na [[medieval-factions]] server can be configured to post its faction roster to\nthe community api, which is how live in-game data reaches\n[[dansplugins-dot-com]]. it is off by default.\n\n## the wire format\n\neach faction becomes a `dpcfactionpayload`: `name`, `serverid`, `membercount`,\n`description`, and optionally `serverip` and `discordlink`. the whole roster is\nsent as one json array with an `x-api-key` header, on a timer whose interval is\nconfigurable with a one-minute floor.\n\nnotably absent: [[faction-power]], [[claimed-chunk]] counts, player names,\nuuids. the payload is a public directory listing, not a data export.\n\n## the empty-roster guard\n\nthe most important nine lines in the file refuse to send an empty array, and the\nreasoning is written into the comment beside them.\n\nthe provider already treats an empty array as a no-op, so sending one\naccomplishes nothing. skipping it here is *defence in depth*: a transient empty\nread — faction data not yet loaded during startup, or a reload landing\nmid-cycle — can then never reach the wire at all, rather than reaching it and\ndepending on the provider's guards to avoid what the comment calls a faction\nwipe.\n\nthe shape of the risk is what makes this worth a note. a post carries the\nserver's whole roster, so a bad read is not a bad row — it is a bad *replacement\nset*, and the blast radius is a shared registry other people's servers appear\nin. two independent guards for one failure is proportionate when the failure is\nsomeone else's data.\n\n## other guards in the same file\n\n- the url is validated as an absolute `http`/`https` uri before use.\n- a plain-`http` url logs a one-time warning that the api key will travel\n  unencrypted.\n- strings are truncated to maximum lengths before sending.\n- response bodies are truncated before logging, and the api key is never logged.\n- a malformed discord link is dropped from the payload rather than sent.\n\n## threading\n\ncollection runs on the main thread, dispatch runs asynchronously — see\n[[main-thread-safety]], for which this file is the reference example.\n\n## related\n\nthe receiving end is a separate `dpc-api` service that also backs\n[[dansplugins-dot-com]]; the website reads from it rather than from minecraft.\n", "title": "DPC API Faction Sync", "toc": [{"level": 2, "slug": "the-wire-format", "text": "The wire format"}, {"level": 2, "slug": "the-empty-roster-guard", "text": "The empty-roster guard"}, {"level": 2, "slug": "other-guards-in-the-same-file", "text": "Other guards in the same file"}, {"level": 2, "slug": "threading", "text": "Threading"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "dpc-conventions": {"backlinks": ["medieval-factions", "moc-conventions-and-process", "moc-plugin-ecosystem", "release-automation", "two-tier-documentation"], "html": "<p>dpc-conventions holds the standards every repository in the organization is measured against. It contains no code — six documents and a ready-to-use prompt.</p>\n<h2 id=\"the-documents\">The documents</h2>\n<div class=\"table-scroll\"><table><thead><tr>\n<th>Document</th>\n<th>Covers</th>\n</tr></thead><tbody>\n<tr>\n<td><code>README_STRUCTURE.md</code></td>\n<td>The sections every plugin README must have, in order</td>\n</tr>\n<tr>\n<td><code>DOCUMENTATION_PRACTICES.md</code></td>\n<td><a class=\"wl\" href=\"#/two-tier-documentation\" data-id=\"two-tier-documentation\">Two-Tier Documentation</a> — repo files versus wiki pages</td>\n</tr>\n<tr>\n<td><code>CONTRIBUTING_STANDARDS.md</code></td>\n<td>What a complete <code>CONTRIBUTING.md</code> contains</td>\n</tr>\n<tr>\n<td><code>TESTING_AND_CI.md</code></td>\n<td><a class=\"wl\" href=\"#/testing-and-ci\" data-id=\"testing-and-ci\">Testing and CI</a></td>\n</tr>\n<tr>\n<td><code>RELEASE_AUTOMATION.md</code></td>\n<td><a class=\"wl\" href=\"#/release-automation\" data-id=\"release-automation\">Release Automation</a></td>\n</tr>\n<tr>\n<td><code>GITHUB_COPILOT_INSTRUCTIONS.md</code></td>\n<td>The required <code>.github/copilot-instructions.md</code></td>\n</tr>\n</tbody></table></div>\n<p>Five of the six point at <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> as the reference implementation. The standard is not an abstract ideal; it is &quot;look at what the flagship does&quot;.</p>\n<p><code>GITHUB_COPILOT_INSTRUCTIONS.md</code> is the exception, and so is the <code>CLAUDE_PROMPT.md</code> at the repository root — neither mentions the flagship at all, because both describe a file each repository must write about <em>itself</em> rather than a shape to copy from elsewhere.</p>\n<h2 id=\"conventions-for-coding-agents\">Conventions for coding agents</h2>\n<p><code>GITHUB_COPILOT_INSTRUCTIONS.md</code> is the one with no equivalent in most organizations' standards. It requires every repository to carry a <code>.github/copilot-instructions.md</code> describing the plugin's architecture, stack, and community norms, and linking back to dpc-conventions.</p>\n<p>The reasoning is stated plainly: without it, an AI contributor has no awareness of the conventions, the architecture, or the branch and issue workflow, and its first suggestion will be inconsistent with the rest of the project. Machine readers are treated as a first-class audience for documentation.</p>\n<h2 id=\"one-notable-exception\">One notable exception</h2>\n<p><code>LICENSE</code> is explicitly excluded from the standardisation effort — the documentation practices note says not to add, change, or remove it, because licensing is left to the repository owner. Everything else in a repository root is fair game for alignment; that one file is not.</p>\n<h2 id=\"related\">Related</h2>\n<p>This zettelkasten applies the same instinct one level up: standards and architecture written down, each claim traceable to a source.</p>", "id": "dpc-conventions", "links": ["two-tier-documentation", "testing-and-ci", "release-automation", "medieval-factions"], "sourcePath": "notes/concepts/dpc-conventions.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/dpc-conventions.md", "sources": [{"claim": "dpc-conventions documents standards across DPC projects with the stated goal of bringing every plugin to the same level of completeness and quality as Medieval Factions.", "label": "dpc-conventions/README.md", "lines": "", "path": "README.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/README.md"}, {"claim": "Every DPC plugin repository must have a .github/copilot-instructions.md that links back to the conventions repository and describes the plugin's architecture, stack and community norms.", "label": "dpc-conventions/GITHUB_COPILOT_INSTRUCTIONS.md", "lines": "", "path": "docs/GITHUB_COPILOT_INSTRUCTIONS.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/docs/GITHUB_COPILOT_INSTRUCTIONS.md"}], "summary": "The repository that writes the organization's standards down, using Medieval Factions as the worked example throughout.", "tags": ["dpc", "conventions", "process"], "text": "dpc conventions the repository that writes the organization's standards down, using medieval factions as the worked example throughout. \ndpc-conventions holds the standards every repository in the organization is\nmeasured against. it contains no code — six documents and a ready-to-use prompt.\n\n## the documents\n\n| document | covers |\n|---|---|\n| `readme_structure.md` | the sections every plugin readme must have, in order |\n| `documentation_practices.md` | [[two-tier-documentation]] — repo files versus wiki pages |\n| `contributing_standards.md` | what a complete `contributing.md` contains |\n| `testing_and_ci.md` | [[testing-and-ci]] |\n| `release_automation.md` | [[release-automation]] |\n| `github_copilot_instructions.md` | the required `.github/copilot-instructions.md` |\n\nfive of the six point at [[medieval-factions]] as the reference implementation.\nthe standard is not an abstract ideal; it is \"look at what the flagship does\".\n\n`github_copilot_instructions.md` is the exception, and so is the\n`claude_prompt.md` at the repository root — neither mentions the flagship at\nall, because both describe a file each repository must write about *itself*\nrather than a shape to copy from elsewhere.\n\n## conventions for coding agents\n\n`github_copilot_instructions.md` is the one with no equivalent in most\norganizations' standards. it requires every repository to carry a\n`.github/copilot-instructions.md` describing the plugin's architecture, stack,\nand community norms, and linking back to dpc-conventions.\n\nthe reasoning is stated plainly: without it, an ai contributor has no awareness\nof the conventions, the architecture, or the branch and issue workflow, and its\nfirst suggestion will be inconsistent with the rest of the project. machine\nreaders are treated as a first-class audience for documentation.\n\n## one notable exception\n\n`license` is explicitly excluded from the standardisation effort — the\ndocumentation practices note says not to add, change, or remove it, because\nlicensing is left to the repository owner. everything else in a repository root\nis fair game for alignment; that one file is not.\n\n## related\n\nthis zettelkasten applies the same instinct one level up: standards and\narchitecture written down, each claim traceable to a source.\n", "title": "DPC Conventions", "toc": [{"level": 2, "slug": "the-documents", "text": "The documents"}, {"level": 2, "slug": "conventions-for-coding-agents", "text": "Conventions for coding agents"}, {"level": 2, "slug": "one-notable-exception", "text": "One notable exception"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "dpc-mc-server": {"backlinks": ["dans-plugin-manager", "fiefs", "mailboxes", "map-integration", "moc-plugin-ecosystem", "moc-web-and-infrastructure", "testing-and-ci"], "html": "<p>dpc-mc-server is the community's server as code: a <code>Dockerfile</code> and a <code>compose.yml</code> that produce a Spigot server with eighteen DPC plugins already installed.</p>\n<h2 id=\"pinned-jars-not-downloads\">Pinned jars, not downloads</h2>\n<p>Plugin jars are committed under <code>resources/jars/</code> at explicit versions — <code>Fiefs-0.10.jar</code>, <code>Dans-Essentials-2.3.0.jar</code>, and so on. The image does not fetch the latest release at build time.</p>\n<p>That is the opposite choice from <a class=\"wl\" href=\"#/dans-plugin-manager\" data-id=\"dans-plugin-manager\">Dan's Plugin Manager</a>, and for a good reason: this repository's value is that a given commit always produces the same server. The cost is that upgrading a plugin is a commit, and the pinned set drifts behind current releases until someone updates it.</p>\n<h2 id=\"a-toggle-per-plugin\">A toggle per plugin</h2>\n<p>Every plugin has a <code>&lt;PLUGIN&gt;_ENABLED</code> environment variable threaded from <code>.env</code> through <code>compose.yml</code> into the container. Bisecting a plugin interaction is therefore a matter of flipping variables and restarting, with no image rebuild.</p>\n<p>Ports 25565 (game), 8123 (Dynmap), and 8100 (BlueMap) are exposed, so both <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> surfaces can be compared side by side against the same world.</p>\n<h2 id=\"the-de-facto-integration-environment\">The de facto integration environment</h2>\n<p>Because it runs <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a>, <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a>, <a class=\"wl\" href=\"#/currencies\" data-id=\"currencies\">Currencies</a>, and <a class=\"wl\" href=\"#/mailboxes\" data-id=\"mailboxes\">Mailboxes</a> together, this is where cross-plugin behaviour actually gets exercised. <a class=\"wl\" href=\"#/testing-and-ci\" data-id=\"testing-and-ci\">Testing and CI</a> covers per-repository testing; nothing else in the organization tests the plugins as a set.</p>\n<h2 id=\"the-deposit-box\">The deposit box</h2>\n<p>A <code>deposit-box/</code> directory is bind-mounted into the container, with a <code>plugin-overrides/</code> subdirectory — the hatch for dropping a locally built jar over a pinned one without rebuilding the image. That is the loop for testing an unreleased change against the full plugin set.</p>\n<h2 id=\"related\">Related</h2>\n<p>Third-party plugins are bundled alongside the community's own, so the environment matches what a real server operator would run.</p>", "id": "dpc-mc-server", "links": ["dans-plugin-manager", "map-integration", "medieval-factions", "fiefs", "currencies", "mailboxes", "testing-and-ci"], "sourcePath": "notes/concepts/dpc-mc-server.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/dpc-mc-server.md", "sources": [{"claim": "The server is a Docker-based reproducible Spigot server pre-loaded with a curated set of DPC plugins, each toggleable via .env, and also bundles Dynmap, BlueMap, PlaceholderAPI, ViaVersion and ViaBackwards.", "label": "dpc-mc-server/README.md", "lines": "", "path": "README.md", "ref": "d42e0ec06f9b29baaa043442d24ef2dd81edfa49", "repo": "Dans-Plugins/dpc-mc-server", "shortRef": "d42e0ec", "url": "https://github.com/Dans-Plugins/dpc-mc-server/blob/d42e0ec06f9b29baaa043442d24ef2dd81edfa49/README.md"}, {"claim": "Each bundled plugin has its own <PLUGIN>_ENABLED environment variable passed into the container, and ports 25565, 8123 and 8100 are exposed for the game server and the two web maps.", "label": "dpc-mc-server/compose.yml", "lines": "", "path": "compose.yml", "ref": "d42e0ec06f9b29baaa043442d24ef2dd81edfa49", "repo": "Dans-Plugins/dpc-mc-server", "shortRef": "d42e0ec", "url": "https://github.com/Dans-Plugins/dpc-mc-server/blob/d42e0ec06f9b29baaa043442d24ef2dd81edfa49/compose.yml"}], "summary": "An infrastructure-as-code Spigot server that pins a curated set of DPC plugin jars into a Docker image, each toggleable by environment variable.", "tags": ["dpc", "infrastructure", "testing"], "text": "dpc minecraft server an infrastructure-as-code spigot server that pins a curated set of dpc plugin jars into a docker image, each toggleable by environment variable. \ndpc-mc-server is the community's server as code: a `dockerfile` and a\n`compose.yml` that produce a spigot server with eighteen dpc plugins already\ninstalled.\n\n## pinned jars, not downloads\n\nplugin jars are committed under `resources/jars/` at explicit versions —\n`fiefs-0.10.jar`, `dans-essentials-2.3.0.jar`, and so on. the image does not\nfetch the latest release at build time.\n\nthat is the opposite choice from [[dans-plugin-manager]], and for a good reason:\nthis repository's value is that a given commit always produces the same server.\nthe cost is that upgrading a plugin is a commit, and the pinned set drifts behind\ncurrent releases until someone updates it.\n\n## a toggle per plugin\n\nevery plugin has a `<plugin>_enabled` environment variable threaded from `.env`\nthrough `compose.yml` into the container. bisecting a plugin interaction is\ntherefore a matter of flipping variables and restarting, with no image rebuild.\n\nports 25565 (game), 8123 (dynmap), and 8100 (bluemap) are exposed, so both\n[[map-integration]] surfaces can be compared side by side against the same world.\n\n## the de facto integration environment\n\nbecause it runs [[medieval-factions]], [[fiefs]], [[currencies]], and\n[[mailboxes]] together, this is where cross-plugin behaviour actually gets\nexercised. [[testing-and-ci]] covers per-repository testing; nothing else in the\norganization tests the plugins as a set.\n\n## the deposit box\n\na `deposit-box/` directory is bind-mounted into the container, with a\n`plugin-overrides/` subdirectory — the hatch for dropping a locally built jar\nover a pinned one without rebuilding the image. that is the loop for testing an\nunreleased change against the full plugin set.\n\n## related\n\nthird-party plugins are bundled alongside the community's own, so the\nenvironment matches what a real server operator would run.\n", "title": "DPC Minecraft Server", "toc": [{"level": 2, "slug": "pinned-jars-not-downloads", "text": "Pinned jars, not downloads"}, {"level": 2, "slug": "a-toggle-per-plugin", "text": "A toggle per plugin"}, {"level": 2, "slug": "the-de-facto-integration-environment", "text": "The de facto integration environment"}, {"level": 2, "slug": "the-deposit-box", "text": "The deposit box"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "expansion-plugin": {"backlinks": ["currencies", "dans-plugin-manager", "faction-events", "fiefs", "moc-medieval-factions", "moc-plugin-architecture", "moc-plugin-ecosystem", "testing-and-ci", "value-class-identifier"], "html": "<p>An expansion is a plugin that cannot run on its own. It declares <code>depend: [MedievalFactions]</code> in <code>plugin.yml</code> — not <code>softdepend</code> — so Bukkit refuses to enable it when the flagship is absent, and it reaches directly into the flagship's types.</p>\n<h2 id=\"what-an-expansion-reuses\">What an expansion reuses</h2>\n<p><a class=\"wl\" href=\"#/currencies\" data-id=\"currencies\">Currencies</a> is the cleanest current example, and it borrows four things:</p>\n<ol>\n<li><strong>Identifiers.</strong> <code>Currency</code> holds an <code>MfFactionId</code> — the flagship's own <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a> — rather than a stringly-typed faction reference.\n</li>\n<li><strong>Architecture.</strong> Its own <code>Services</code> registry, <code>JooqCurrencyRepository</code>, Flyway migrations, and <code>version</code> column mirror <a class=\"wl\" href=\"#/moc-plugin-architecture\" data-id=\"moc-plugin-architecture\">the flagship's shape</a> exactly.\n</li>\n<li><strong>Events.</strong> <code>FactionCreateListener</code> and <code>FactionDisbandListener</code> subscribe to <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a>, which is how a currency is retired when its issuing faction disbands.\n</li>\n<li><strong>Permissions.</strong> <code>CurrenciesFactionPermissions</code> calls <code>addPermissionType</code> on the flagship's own registry, adding <code>CREATE_CURRENCY</code>, <code>MINT_CURRENCY</code>, and three per-currency permissions to the flagship's <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> model — so minting rights are granted through the same <code>/f role</code> commands as everything else.\n</li>\n</ol>\n<p>That fourth point is the one that makes an expansion feel native rather than bolted on: a player never learns a separate permission system.</p>\n<h2 id=\"its-own-database\">Its own database</h2>\n<p>Each expansion runs its own Hikari pool, Flyway history, and jOOQ context against its own tables. It does not read the flagship's schema. The coupling is through the Java API and the event bus, never through shared SQL — so a schema change in the flagship cannot break an expansion silently.</p>\n<h2 id=\"two-generations\">Two generations</h2>\n<p><a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> predates this pattern. It is Java, targets Medieval Factions 4 through a vendored jar, and integrates through its own <code>MedievalFactionsIntegrator</code> rather than by importing flagship types. Reading both side by side is the fastest way to see what the version 5 rewrite changed.</p>\n<h2 id=\"related\">Related</h2>\n<p>Expansions are listed in the flagship's own README, which is how server owners discover them.</p>", "id": "expansion-plugin", "links": ["currencies", "value-class-identifier", "moc-plugin-architecture", "faction-events", "faction-permission", "fiefs"], "sourcePath": "notes/concepts/expansion-plugin.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/expansion-plugin.md", "sources": [{"claim": "An expansion declares depend, not softdepend, on MedievalFactions so Bukkit refuses to load it without the flagship.", "label": "Currencies/plugin.yml", "lines": "", "path": "src/main/resources/plugin.yml", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/resources/plugin.yml"}, {"claim": "An expansion's own domain records reference the flagship's MfFactionId type directly and repeat its shape, with a value-class id and a version column.", "label": "Currencies/Currency.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/currencies/currency/Currency.kt", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/kotlin/com/dansplugins/currencies/currency/Currency.kt"}, {"claim": "The expansion calls addPermissionType on the flagship's own factionPermissions registry to add CREATE_CURRENCY, RETIRE_CURRENCY, CHANGE_CURRENCY_NAME, CHANGE_CURRENCY_DESCRIPTION and MINT_CURRENCY.", "label": "Currencies/CurrenciesFactionPermissions.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/currencies/permission/CurrenciesFactionPermissions.kt", "ref": "41597bea085d536b59bfd564aa58f8739b4ffd92", "repo": "Dans-Plugins/Currencies", "shortRef": "41597be", "url": "https://github.com/Dans-Plugins/Currencies/blob/41597bea085d536b59bfd564aa58f8739b4ffd92/src/main/kotlin/com/dansplugins/currencies/permission/CurrenciesFactionPermissions.kt"}], "summary": "A plugin that hard-depends on Medieval Factions and extends the simulation — declaring the dependency in plugin.yml and reusing the flagship's identifiers, events, and permission model.", "tags": ["medieval-factions", "ecosystem", "architecture"], "text": "expansion plugin a plugin that hard-depends on medieval factions and extends the simulation — declaring the dependency in plugin.yml and reusing the flagship's identifiers, events, and permission model. \nan expansion is a plugin that cannot run on its own. it declares\n`depend: [medievalfactions]` in `plugin.yml` — not `softdepend` — so bukkit\nrefuses to enable it when the flagship is absent, and it reaches directly into\nthe flagship's types.\n\n## what an expansion reuses\n\n[[currencies]] is the cleanest current example, and it borrows four things:\n\n1. **identifiers.** `currency` holds an `mffactionid` — the flagship's own\n   [[value-class-identifier]] — rather than a stringly-typed faction reference.\n2. **architecture.** its own `services` registry, `jooqcurrencyrepository`,\n   flyway migrations, and `version` column mirror\n   [[moc-plugin-architecture|the flagship's shape]] exactly.\n3. **events.** `factioncreatelistener` and `factiondisbandlistener` subscribe to\n   [[faction-events]], which is how a currency is retired when its issuing\n   faction disbands.\n4. **permissions.** `currenciesfactionpermissions` calls `addpermissiontype` on\n   the flagship's own registry, adding `create_currency`, `mint_currency`, and\n   three per-currency permissions to the flagship's [[faction-permission]]\n   model — so minting rights are granted through the same `/f role` commands as\n   everything else.\n\nthat fourth point is the one that makes an expansion feel native rather than\nbolted on: a player never learns a separate permission system.\n\n## its own database\n\neach expansion runs its own hikari pool, flyway history, and jooq context\nagainst its own tables. it does not read the flagship's schema. the coupling is\nthrough the java api and the event bus, never through shared sql — so a schema\nchange in the flagship cannot break an expansion silently.\n\n## two generations\n\n[[fiefs]] predates this pattern. it is java, targets medieval factions 4 through\na vendored jar, and integrates through its own `medievalfactionsintegrator`\nrather than by importing flagship types. reading both side by side is the\nfastest way to see what the version 5 rewrite changed.\n\n## related\n\nexpansions are listed in the flagship's own readme, which is how server owners\ndiscover them.\n", "title": "Expansion Plugin", "toc": [{"level": 2, "slug": "what-an-expansion-reuses", "text": "What an expansion reuses"}, {"level": 2, "slug": "its-own-database", "text": "Its own database"}, {"level": 2, "slug": "two-generations", "text": "Two generations"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction": {"backlinks": ["approval-request", "claimed-chunk", "currencies", "faction-events", "faction-flag", "faction-permission", "faction-power", "faction-relationship", "faction-role", "fiefs", "gate", "law", "legacy-data-migration", "medieval-factions", "moc-dans-plugins-community", "moc-faction-domain-model", "moc-medieval-factions", "optimistic-locking", "player-power", "service-layer"], "html": "<p>A faction is the unit of political organisation: a named group of players that can hold land, make war, and be inherited into a feudal hierarchy. Everything else in the domain model either belongs to a faction or describes a relation between two of them.</p>\n<h2 id=\"what-the-record-holds\">What the record holds</h2>\n<p><code>MfFaction</code> is an immutable Kotlin data class. Its fields fall into four groups:</p>\n<ul>\n<li><strong>Identity</strong> — an <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">id</a>, a <code>name</code>, an optional chat <code>prefix</code>, and a <code>description</code>.\n</li>\n<li><strong>People</strong> — <code>members</code>, outstanding <code>invites</code>, and pending <code>applications</code>.\n</li>\n<li><strong>Governance</strong> — <code>roles</code> (see <a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a>), <code>defaultPermissionsByName</code> (see <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a>), and <code>flags</code> (see <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a>).\n</li>\n<li><strong>Territory</strong> — a <code>home</code> position and an <code>autoclaim</code> toggle. Note that the claims themselves are <em>not</em> stored on the faction; see <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a>.\n</li>\n</ul>\n<p>The <code>version</code> field is not domain data — it exists for <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a>.</p>\n<h2 id=\"power-is-computed-not-stored\">Power is computed, not stored</h2>\n<p><code>power</code> and <code>maxPower</code> are computed properties, derived on every read from the members' <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a> and from vassals. Nothing writes a faction's power to the database. This is what makes <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> a live quantity that responds to players logging in and dying, rather than a value that has to be recalculated by a scheduled job.</p>\n<p>The exception is <code>bonusPower</code>, an operator-granted constant that is stored — and which the faction can decline by turning off the <code>acceptBonusPower</code> flag.</p>\n<h2 id=\"where-it-lives-at-runtime\">Where it lives at runtime</h2>\n<p><code>MfFactionService</code> loads every faction into a <code>ConcurrentHashMap</code> when the plugin starts and serves reads from memory. Writes go through the same service so that they can fire <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a> and be persisted through the <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a>. Code should never reach past the service to the repository — see <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>.</p>\n<h2 id=\"membership-is-stored-sideways\">Membership is stored sideways</h2>\n<p>The <code>members</code> list on the record is a view, not the storage. Membership lives in its own <code>mf_faction_member</code> table, and the repository's &quot;which faction is this player in?&quot; query is a subquery against it.</p>\n<p>In memory, though, the service answers that question by scanning every cached faction's member list until one matches. That is fine at the scale these servers run at, and worth knowing before calling it inside a loop over online players.</p>\n<p>Note also that the player record itself holds no faction reference — see <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a>. The edge is stored in exactly one place, which is why a player cannot end up in two factions through disagreeing records.</p>\n<h2 id=\"related\">Related</h2>\n<p>Diplomacy lives entirely outside the faction record in <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a
