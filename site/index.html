>.</p>", "id": "faction", "links": ["value-class-identifier", "faction-role", "faction-permission", "faction-flag", "claimed-chunk", "optimistic-locking", "player-power", "faction-power", "faction-events", "repository-pattern", "service-layer", "faction-relationship"], "sourcePath": "notes/concepts/faction.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction.md", "sources": [{"claim": "A faction is a Kotlin data class holding id, version, name, description, members, invites, flags, prefix, home, bonus power, autoclaim, roles, default permissions, and applications.", "label": "Medieval-Factions/MfFaction.kt:14-30", "lines": "14-30", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt#L14-L30"}, {"claim": "The faction service keeps all factions in a ConcurrentHashMap loaded from the repository at startup.", "label": "Medieval-Factions/MfFactionService.kt:30-45", "lines": "30-45", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt#L30-L45"}, {"claim": "Finding which faction a player belongs to is a linear scan over every cached faction's member list, not an indexed lookup.", "label": "Medieval-Factions/MfFactionService.kt:62-66", "lines": "62-66", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt#L62-L66"}, {"claim": "Membership is persisted in a separate mf_faction_member table, and the repository's player lookup is a subquery against it.", "label": "Medieval-Factions/JooqMfFactionRepository.kt:35-42", "lines": "35-42", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt#L35-L42"}], "summary": "The central record of the simulation — a named group of players with land, roles, diplomacy, and a power score.", "tags": ["medieval-factions", "domain-model"], "text": "faction the central record of the simulation — a named group of players with land, roles, diplomacy, and a power score. \na faction is the unit of political organisation: a named group of players that\ncan hold land, make war, and be inherited into a feudal hierarchy. everything\nelse in the domain model either belongs to a faction or describes a relation\nbetween two of them.\n\n## what the record holds\n\n`mffaction` is an immutable kotlin data class. its fields fall into four groups:\n\n- **identity** — an [[value-class-identifier|id]], a `name`, an optional chat\n  `prefix`, and a `description`.\n- **people** — `members`, outstanding `invites`, and pending `applications`.\n- **governance** — `roles` (see [[faction-role]]), `defaultpermissionsbyname`\n  (see [[faction-permission]]), and `flags` (see [[faction-flag]]).\n- **territory** — a `home` position and an `autoclaim` toggle. note that the\n  claims themselves are *not* stored on the faction; see [[claimed-chunk]].\n\nthe `version` field is not domain data — it exists for [[optimistic-locking]].\n\n## power is computed, not stored\n\n`power` and `maxpower` are computed properties, derived on every read from the\nmembers' [[player-power]] and from vassals. nothing writes a faction's power to\nthe database. this is what makes [[faction-power]] a live quantity that responds\nto players logging in and dying, rather than a value that has to be recalculated\nby a scheduled job.\n\nthe exception is `bonuspower`, an operator-granted constant that is stored — and\nwhich the faction can decline by turning off the `acceptbonuspower` flag.\n\n## where it lives at runtime\n\n`mffactionservice` loads every faction into a `concurrenthashmap` when the\nplugin starts and serves reads from memory. writes go through the same service\nso that they can fire [[faction-events]] and be persisted through the\n[[repository-pattern]]. code should never reach past the service to the\nrepository — see [[service-layer]].\n\n## membership is stored sideways\n\nthe `members` list on the record is a view, not the storage. membership lives in\nits own `mf_faction_member` table, and the repository's \"which faction is this\nplayer in?\" query is a subquery against it.\n\nin memory, though, the service answers that question by scanning every cached\nfaction's member list until one matches. that is fine at the scale these servers\nrun at, and worth knowing before calling it inside a loop over online players.\n\nnote also that the player record itself holds no faction reference — see\n[[player-power]]. the edge is stored in exactly one place, which is why a player\ncannot end up in two factions through disagreeing records.\n\n## related\n\ndiplomacy lives entirely outside the faction record in\n[[faction-relationship]].\n", "title": "Faction", "toc": [{"level": 2, "slug": "what-the-record-holds", "text": "What the record holds"}, {"level": 2, "slug": "power-is-computed-not-stored", "text": "Power is computed, not stored"}, {"level": 2, "slug": "where-it-lives-at-runtime", "text": "Where it lives at runtime"}, {"level": 2, "slug": "membership-is-stored-sideways", "text": "Membership is stored sideways"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-events": {"backlinks": ["currencies", "expansion-plugin", "faction", "main-thread-safety", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture", "service-layer"], "html": "<p><a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> fires Bukkit events for faction lifecycle changes: <code>FactionCreateEvent</code>, <code>FactionRenameEvent</code>, <code>FactionDescriptionChangeEvent</code>, <code>FactionPrefixChangeEvent</code>, <code>FactionJoinEvent</code>, <code>FactionLeaveEvent</code>, <code>FactionKickEvent</code>, <code>FactionDisbandEvent</code>, <code>FactionClaimEvent</code>, and <code>FactionUnclaimEvent</code>.</p>\n<p>All implement the marker interface <code>FactionEvent</code>, which guarantees a <code>factionId</code> — so a listener can handle the whole family generically.</p>\n<h2 id=\"mostly-derived-by-diffing-not-by-call-site\">Mostly derived by diffing, not by call site</h2>\n<p>The notable design choice is where events come from. <code>MfFactionService.save()</code> takes a complete <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record, loads the previously stored one, and compares them field by field: a null previous state means create; a changed name means rename; a changed description means a description change.</p>\n<p>Callers therefore mostly do not choose which event to fire — they just save a modified copy. Because the domain records are immutable data classes edited with <code>copy()</code>, &quot;what changed&quot; is a comparison the service can make reliably, and no call site can forget to announce its change.</p>\n<p>The cost is that a single save can fire several events, and their ordering is whatever order the diff checks run in.</p>\n<p>The exceptions are worth knowing: claim and unclaim are fired by <code>MfClaimService</code>, and <code>FactionKickEvent</code> is fired directly by the kick <em>command</em> — the only event in the plugin raised outside a service.</p>\n<h2 id=\"cancellable-and-mutable\">Cancellable, and mutable</h2>\n<p>Events are <code>Cancellable</code>. A cancelling listener causes the service to throw <code>EventCancelledException</code>, which the <code>Result4k</code> wrapper converts into a <code>ServiceFailure</code> — the caller sees a failed result, not an exception. See <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>.</p>\n<p><code>FactionCreateEvent</code> goes further: <code>faction</code> is a <code>var</code>, and the service saves <code>event.faction</code> rather than the original. A listener can therefore <em>rewrite</em> the faction on its way to storage — enforcing a naming policy, say — not merely veto it.</p>\n<h2 id=\"async-correctness-with-one-gap\">Async correctness, with one gap</h2>\n<p>Eleven of the twelve event constructions in the plugin pass <code>!plugin.server.isPrimaryThread</code>, so Bukkit is told truthfully whether the event is being fired asynchronously. Getting this wrong is a common source of hard-to-trace plugin bugs; see <a class=\"wl\" href=\"#/main-thread-safety\" data-id=\"main-thread-safety\">Main Thread Safety</a>.</p>\n<p><code>FactionKickEvent</code> is the twelfth. It passes a hardcoded <code>true</code>, asserting the event is always async — and it is constructed inside a command, which normally runs on the main thread. Nothing in the repository explains the choice; treat it as a discrepancy to check rather than a pattern to copy.</p>\n<p>Note also that relationship changes have their own events — <code>RelationshipCreateEvent</code> and <code>RelationshipDeleteEvent</code> in <code>event/relationship/</code> — outside the faction family described here.</p>\n<h2 id=\"related\">Related</h2>\n<p>For an <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a> these events are the supported extension point. Reading state is done through the <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>; reacting to change is done here.</p>", "id": "faction-events", "links": ["medieval-factions", "faction", "service-layer", "main-thread-safety", "expansion-plugin"], "sourcePath": "notes/concepts/faction-events.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-events.md", "sources": [{"claim": "FactionCreateEvent extends Bukkit's Event and implements both FactionEvent and Cancellable, and exposes the faction as a mutable var so a listener can substitute it.", "label": "Medieval-Factions/FactionCreateEvent.kt:9-14", "lines": "9-14", "path": "src/main/kotlin/com/dansplugins/factionsystem/event/faction/FactionCreateEvent.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/event/faction/FactionCreateEvent.kt#L9-L14"}, {"claim": "The save method compares the incoming faction against the previously stored one and fires a create, rename or description-change event accordingly, throwing EventCancelledException if a listener cancels.", "label": "Medieval-Factions/MfFactionService.kt:70-92", "lines": "70-92", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt#L70-L92"}, {"claim": "FactionKickEvent is constructed in the kick command with its isAsync argument hardcoded to true, unlike the other eleven event constructions which pass !server.isPrimaryThread.", "label": "Medieval-Factions/MfFactionKickCommand.kt:98", "lines": "98", "path": "src/main/kotlin/com/dansplugins/factionsystem/command/faction/kick/MfFactionKickCommand.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/command/faction/kick/MfFactionKickCommand.kt#L98"}], "summary": "The plugin fires cancellable Bukkit events for every meaningful faction change, and derives which to fire by diffing the record it is about to save.", "tags": ["medieval-factions", "architecture", "extensibility"], "text": "faction events the plugin fires cancellable bukkit events for every meaningful faction change, and derives which to fire by diffing the record it is about to save. \n[[medieval-factions]] fires bukkit events for faction lifecycle changes:\n`factioncreateevent`, `factionrenameevent`, `factiondescriptionchangeevent`,\n`factionprefixchangeevent`, `factionjoinevent`, `factionleaveevent`,\n`factionkickevent`, `factiondisbandevent`, `factionclaimevent`, and\n`factionunclaimevent`.\n\nall implement the marker interface `factionevent`, which guarantees a\n`factionid` — so a listener can handle the whole family generically.\n\n## mostly derived by diffing, not by call site\n\nthe notable design choice is where events come from. `mffactionservice.save()`\ntakes a complete [[faction]] record, loads the previously stored one, and\ncompares them field by field: a null previous state means create; a changed name\nmeans rename; a changed description means a description change.\n\ncallers therefore mostly do not choose which event to fire — they just save a\nmodified copy. because the domain records are immutable data classes edited with\n`copy()`, \"what changed\" is a comparison the service can make reliably, and no\ncall site can forget to announce its change.\n\nthe cost is that a single save can fire several events, and their ordering is\nwhatever order the diff checks run in.\n\nthe exceptions are worth knowing: claim and unclaim are fired by\n`mfclaimservice`, and `factionkickevent` is fired directly by the kick\n*command* — the only event in the plugin raised outside a service.\n\n## cancellable, and mutable\n\nevents are `cancellable`. a cancelling listener causes the service to throw\n`eventcancelledexception`, which the `result4k` wrapper converts into a\n`servicefailure` — the caller sees a failed result, not an exception. see\n[[service-layer]].\n\n`factioncreateevent` goes further: `faction` is a `var`, and the service saves\n`event.faction` rather than the original. a listener can therefore *rewrite* the\nfaction on its way to storage — enforcing a naming policy, say — not merely veto\nit.\n\n## async correctness, with one gap\n\neleven of the twelve event constructions in the plugin pass\n`!plugin.server.isprimarythread`, so bukkit is told truthfully whether the event\nis being fired asynchronously. getting this wrong is a common source of\nhard-to-trace plugin bugs; see [[main-thread-safety]].\n\n`factionkickevent` is the twelfth. it passes a hardcoded `true`, asserting the\nevent is always async — and it is constructed inside a command, which normally\nruns on the main thread. nothing in the repository explains the choice; treat it\nas a discrepancy to check rather than a pattern to copy.\n\nnote also that relationship changes have their own events —\n`relationshipcreateevent` and `relationshipdeleteevent` in\n`event/relationship/` — outside the faction family described here.\n\n## related\n\nfor an [[expansion-plugin]] these events are the supported extension point.\nreading state is done through the [[service-layer]]; reacting to change is done\nhere.\n", "title": "Faction Events", "toc": [{"level": 2, "slug": "mostly-derived-by-diffing-not-by-call-site", "text": "Mostly derived by diffing, not by call site"}, {"level": 2, "slug": "cancellable-and-mutable", "text": "Cancellable, and mutable"}, {"level": 2, "slug": "async-correctness-with-one-gap", "text": "Async correctness, with one gap"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-flag": {"backlinks": ["approval-request", "claimed-chunk", "faction", "faction-permission", "faction-power", "faction-relationship", "map-integration", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "vassalage"], "html": "<p>A flag is a typed, per-<a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> setting whose default comes from the server configuration and whose value the faction can then change. Where <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> governs what <em>members</em> may do, flags govern how the world treats the faction as a whole.</p>\n<h2 id=\"the-built-in-set\">The built-in set</h2>\n<div class=\"table-scroll\"><table><thead><tr>\n<th>Flag</th>\n<th>What it changes</th>\n</tr></thead><tbody>\n<tr>\n<td><code>alliesCanInteractWithLand</code></td>\n<td>Allies may build in the faction's [[claimed-chunk</td>\n<td>claims]]</td>\n</tr>\n<tr>\n<td><code>vassalageTreeCanInteractWithLand</code></td>\n<td>The whole <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> tree may build</td>\n</tr>\n<tr>\n<td><code>liegeChainCanInteractWithLand</code></td>\n<td>The chain of lieges may build</td>\n</tr>\n<tr>\n<td><code>neutral</code></td>\n<td>The faction opts out of war</td>\n</tr>\n<tr>\n<td><code>color</code></td>\n<td>Hex colour used by <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a></td>\n</tr>\n<tr>\n<td><code>allowFriendlyFire</code></td>\n<td>Members may damage each other</td>\n</tr>\n<tr>\n<td><code>acceptBonusPower</code></td>\n<td>Operator-granted power counts toward <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a></td>\n</tr>\n<tr>\n<td><code>enableMobProtection</code></td>\n<td>Hostile mob behaviour inside claims</td>\n</tr>\n<tr>\n<td><code>protectVillagerTrade</code></td>\n<td>Villager trading protection inside claims</td>\n</tr>\n</tbody></table></div>\n<p>Three of the nine are about land access, and each names a different slice of the <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a> graph. That is the recurring theme: a flag is usually the switch that turns a diplomatic fact into a physical permission.</p>\n<h2 id=\"typed-with-validation\">Typed with validation</h2>\n<p><code>MfFlag</code> is generic over its value type. Boolean flags read their default straight from config; the <code>color</code> flag is a string with a supplier that can generate a random pleasant colour when the config says <code>random</code>, and a validator that rejects anything not matching <code>#RRGGBB</code>. Validation returns a localised failure message rather than throwing, so a bad <code>/f flag set</code> is a player-facing error rather than a stack trace.</p>\n<h2 id=\"server-override\">Server override</h2>\n<p>A server can force a policy regardless of what factions want. The clearest example: when <code>factions.allowNeutrality</code> is false, <code>MfFactionService</code> clears the <code>neutral</code> flag on every existing faction at startup rather than merely refusing future changes. Configuration wins over stored state.</p>\n<h2 id=\"related\">Related</h2>\n<p>Flags live inline on the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record as <code>MfFlagValues</code>, so changing one is a faction write subject to <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a>.</p>", "id": "faction-flag", "links": ["faction", "faction-permission", "claimed-chunk", "vassalage", "map-integration", "faction-power", "faction-relationship", "optimistic-locking"], "sourcePath": "notes/concepts/faction-flag.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-flag.md", "sources": [{"claim": "The built-in flags are alliesCanInteractWithLand, vassalageTreeCanInteractWithLand, neutral, color, allowFriendlyFire, acceptBonusPower, enableMobProtection, liegeChainCanInteractWithLand, and protectVillagerTrade.", "label": "Medieval-Factions/MfFlags.kt:7-70", "lines": "7-70", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/flag/MfFlags.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/flag/MfFlags.kt#L7-L70"}, {"claim": "A flag is typed, with boolean and string constructors, and carries a default supplier plus an optional validator.", "label": "Medieval-Factions/MfFlag.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/flag/MfFlag.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/flag/MfFlag.kt"}], "summary": "Per-faction toggles that change how the simulation treats a faction — land access for allies, friendly fire, mob protection, and map colour.", "tags": ["medieval-factions", "domain-model", "governance"], "text": "faction flag per-faction toggles that change how the simulation treats a faction — land access for allies, friendly fire, mob protection, and map colour. \na flag is a typed, per-[[faction]] setting whose default comes from the server\nconfiguration and whose value the faction can then change. where\n[[faction-permission]] governs what *members* may do, flags govern how the world\ntreats the faction as a whole.\n\n## the built-in set\n\n| flag | what it changes |\n|---|---|\n| `alliescaninteractwithland` | allies may build in the faction's [[claimed-chunk|claims]] |\n| `vassalagetreecaninteractwithland` | the whole [[vassalage]] tree may build |\n| `liegechaincaninteractwithland` | the chain of lieges may build |\n| `neutral` | the faction opts out of war |\n| `color` | hex colour used by [[map-integration]] |\n| `allowfriendlyfire` | members may damage each other |\n| `acceptbonuspower` | operator-granted power counts toward [[faction-power]] |\n| `enablemobprotection` | hostile mob behaviour inside claims |\n| `protectvillagertrade` | villager trading protection inside claims |\n\nthree of the nine are about land access, and each names a different slice of the\n[[faction-relationship]] graph. that is the recurring theme: a flag is usually\nthe switch that turns a diplomatic fact into a physical permission.\n\n## typed with validation\n\n`mfflag` is generic over its value type. boolean flags read their default\nstraight from config; the `color` flag is a string with a supplier that can\ngenerate a random pleasant colour when the config says `random`, and a validator\nthat rejects anything not matching `#rrggbb`. validation returns a localised\nfailure message rather than throwing, so a bad `/f flag set` is a player-facing\nerror rather than a stack trace.\n\n## server override\n\na server can force a policy regardless of what factions want. the clearest\nexample: when `factions.allowneutrality` is false, `mffactionservice` clears the\n`neutral` flag on every existing faction at startup rather than merely refusing\nfuture changes. configuration wins over stored state.\n\n## related\n\nflags live inline on the [[faction]] record as `mfflagvalues`, so changing one is\na faction write subject to [[optimistic-locking]].\n", "title": "Faction Flag", "toc": [{"level": 2, "slug": "the-built-in-set", "text": "The built-in set"}, {"level": 2, "slug": "typed-with-validation", "text": "Typed with validation"}, {"level": 2, "slug": "server-override", "text": "Server override"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-permission": {"backlinks": ["claimed-chunk", "expansion-plugin", "faction", "faction-flag", "faction-role", "law", "locked-block", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions"], "html": "<p>A permission is one capability a faction can grant or withhold — claiming land, inviting members, editing <a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a>, and so on. Permissions are the leaves of the governance model; <a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a> bundles them.</p>\n<h2 id=\"parameterised-by-role\">Parameterised by role</h2>\n<p>Some permissions are not a single capability but a family: the ability to modify <em>a particular</em> role. <code>MfFactionPermissions.permissionsFor(factionId, roles)</code> builds the permission set for a specific faction from its specific roles, which means the available permissions differ between factions.</p>\n<p>This is why permissions are stored and resolved <strong>by name</strong> rather than by reference — the object graph is per-faction and rebuilt at load, so only the string is stable enough to persist.</p>\n<h2 id=\"defaults-are-per-permission\">Defaults are per-permission</h2>\n<p>Each permission declares its own default, consulted last in the three-level resolution described in <a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a>. A faction can shift the middle level by setting <code>defaultPermissionsByName</code> on the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record, and a role can shift the top level. The permission's own default is the backstop that guarantees every lookup terminates in a boolean.</p>\n<h2 id=\"serialization\">Serialization</h2>\n<p>Dedicated serializers exist for a permission and for a map of permissions, keeping the encoding of permission state in one place rather than scattered through the repositories that persist roles.</p>\n<h2 id=\"related\">Related</h2>\n<p>Permissions govern members. Non-members are governed by <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> settings and by their <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a> to the landowner — two separate systems that meet at the block-interaction check on a <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a>.</p>", "id": "faction-permission", "links": ["law", "faction-role", "faction", "faction-flag", "faction-relationship", "claimed-chunk"], "sourcePath": "notes/concepts/faction-permission.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-permission.md", "sources": [{"claim": "A faction permission is a data class of a name, a translate function taking the faction, and a default boolean, with equality and hashCode defined on the name alone.", "label": "Medieval-Factions/MfFactionPermission.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/permission/MfFactionPermission.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/permission/MfFactionPermission.kt"}, {"claim": "A registry holds the permission types, builds the permission set for a faction from its roles, and parses permission names back into permission objects.", "label": "Medieval-Factions/MfFactionPermissions.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/permission/MfFactionPermissions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/permission/MfFactionPermissions.kt"}], "summary": "The individually grantable capabilities inside a faction, each with a default and a type.", "tags": ["medieval-factions", "domain-model", "governance"], "text": "faction permission the individually grantable capabilities inside a faction, each with a default and a type. \na permission is one capability a faction can grant or withhold — claiming land,\ninviting members, editing [[law]], and so on. permissions are the leaves of the\ngovernance model; [[faction-role]] bundles them.\n\n## parameterised by role\n\nsome permissions are not a single capability but a family: the ability to modify\n*a particular* role. `mffactionpermissions.permissionsfor(factionid, roles)`\nbuilds the permission set for a specific faction from its specific roles, which\nmeans the available permissions differ between factions.\n\nthis is why permissions are stored and resolved **by name** rather than by\nreference — the object graph is per-faction and rebuilt at load, so only the\nstring is stable enough to persist.\n\n## defaults are per-permission\n\neach permission declares its own default, consulted last in the three-level\nresolution described in [[faction-role]]. a faction can shift the middle level\nby setting `defaultpermissionsbyname` on the [[faction]] record, and a role can\nshift the top level. the permission's own default is the backstop that\nguarantees every lookup terminates in a boolean.\n\n## serialization\n\ndedicated serializers exist for a permission and for a map of permissions,\nkeeping the encoding of permission state in one place rather than scattered\nthrough the repositories that persist roles.\n\n## related\n\npermissions govern members. non-members are governed by [[faction-flag]] settings\nand by their [[faction-relationship]] to the landowner — two separate systems\nthat meet at the block-interaction check on a [[claimed-chunk]].\n", "title": "Faction Permission", "toc": [{"level": 2, "slug": "parameterised-by-role", "text": "Parameterised by role"}, {"level": 2, "slug": "defaults-are-per-permission", "text": "Defaults are per-permission"}, {"level": 2, "slug": "serialization", "text": "Serialization"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-power": {"backlinks": ["claimed-chunk", "demesne-limit", "dpc-api-faction-sync", "faction", "faction-flag", "faction-relationship", "moc-dans-plugins-community", "moc-faction-domain-model", "moc-medieval-factions", "player-power", "vassalage"], "html": "<p>Faction power is the single number the simulation runs on. It is computed, never stored, and it decides how much territory a faction can defend — see <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>.</p>\n<h2 id=\"the-formula\">The formula</h2>\n<pre><code>memberPower    = Σ power of each member\nmaxMemberPower = memberCount × players.maxPower\nvassalPower    = Σ (vassal.power × vassalPowerContributionMultiplier)\n\npower = memberPower\n      + vassalPower   if memberPower ≥ maxMemberPower / 2\n      + bonusPower    if the acceptBonusPower flag is set</code></pre>\n<p><code>memberPower</code> sums each member's <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">Player Power</a>; <code>vassalPower</code> walks the factions related to this one as vassals — see <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a>.</p>\n<h2 id=\"the-half-strength-gate\">The half-strength gate</h2>\n<p>The interesting clause is the condition on vassal power: a liege only receives its vassals' contribution while its <em>own</em> members are at or above half their collective maximum. A faction cannot subsist on tribute alone. If its own members stop logging in, the vassal contribution switches off entirely — not proportionally, but as a cliff.</p>\n<p>The effect is that <a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> amplifies a healthy faction rather than propping up a hollow one, and a large empire whose core has gone quiet collapses to the size its own members can hold.</p>\n<h2 id=\"bonus-power-is-opt-in\">Bonus power is opt-in</h2>\n<p><code>bonusPower</code> is a stored constant an operator can grant. A faction can refuse it by clearing the <code>acceptBonusPower</code> <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> — the flag gates both the <code>power</code> and <code>maxPower</code> computations, so declining it costs the faction its ceiling as well as its floor. Servers that want a pure simulation can leave the mechanism unused.</p>\n<h2 id=\"related\">Related</h2>\n<p>Because power is a computed property on the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> data class, it is recalculated on every access rather than cached. Anything that walks all factions and reads <code>power</code> therefore also walks every member's player record — worth knowing before adding such a loop to a hot path.</p>", "id": "faction-power", "links": ["demesne-limit", "player-power", "faction-relationship", "vassalage", "faction-flag", "faction"], "sourcePath": "notes/concepts/faction-power.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-power.md", "sources": [{"claim": "Faction power is member power, plus vassal power only when member power is at least half of max member power, plus bonus power when the acceptBonusPower flag is set.", "label": "Medieval-Factions/MfFaction.kt:33-51", "lines": "33-51", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt#L33-L51"}, {"claim": "The vassal power contribution multiplier defaults to 0.75.", "label": "Medieval-Factions/config.yml:72", "lines": "72", "path": "src/main/resources/config.yml", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/resources/config.yml#L72"}], "summary": "A faction's live strength — the sum of its members' power plus a conditional vassal contribution — and the cap on how much land it may hold.", "tags": ["medieval-factions", "domain-model", "power"], "text": "faction power a faction's live strength — the sum of its members' power plus a conditional vassal contribution — and the cap on how much land it may hold. \nfaction power is the single number the simulation runs on. it is computed, never\nstored, and it decides how much territory a faction can defend — see\n[[demesne-limit]].\n\n## the formula\n\n```\nmemberpower    = σ power of each member\nmaxmemberpower = membercount × players.maxpower\nvassalpower    = σ (vassal.power × vassalpowercontributionmultiplier)\n\npower = memberpower\n      + vassalpower   if memberpower ≥ maxmemberpower / 2\n      + bonuspower    if the acceptbonuspower flag is set\n```\n\n`memberpower` sums each member's [[player-power]]; `vassalpower` walks the\nfactions related to this one as vassals — see [[faction-relationship]].\n\n## the half-strength gate\n\nthe interesting clause is the condition on vassal power: a liege only receives\nits vassals' contribution while its *own* members are at or above half their\ncollective maximum. a faction cannot subsist on tribute alone. if its own\nmembers stop logging in, the vassal contribution switches off entirely — not\nproportionally, but as a cliff.\n\nthe effect is that [[vassalage]] amplifies a healthy faction rather than\npropping up a hollow one, and a large empire whose core has gone quiet collapses\nto the size its own members can hold.\n\n## bonus power is opt-in\n\n`bonuspower` is a stored constant an operator can grant. a faction can refuse it\nby clearing the `acceptbonuspower` [[faction-flag]] — the flag gates both the\n`power` and `maxpower` computations, so declining it costs the faction its\nceiling as well as its floor. servers that want a pure simulation can leave the\nmechanism unused.\n\n## related\n\nbecause power is a computed property on the [[faction]] data class, it is\nrecalculated on every access rather than cached. anything that walks all\nfactions and reads `power` therefore also walks every member's player record —\nworth knowing before adding such a loop to a hot path.\n", "title": "Faction Power", "toc": [{"level": 2, "slug": "the-formula", "text": "The formula"}, {"level": 2, "slug": "the-half-strength-gate", "text": "The half-strength gate"}, {"level": 2, "slug": "bonus-power-is-opt-in", "text": "Bonus power is opt-in"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-relationship": {"backlinks": ["approval-request", "faction", "faction-flag", "faction-permission", "faction-power", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "vassalage"], "html": "<p>Diplomacy is not a field on the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record. It is a separate table of directed edges, each carrying one of four types: <code>ALLY</code>, <code>AT_WAR</code>, <code>VASSAL</code>, or <code>LIEGE</code>.</p>\n<h2 id=\"directed-not-symmetric\">Directed, not symmetric</h2>\n<p>Each row records a relationship <em>from</em> one faction <em>to</em> another. Two of the four types are inverses — A's <code>VASSAL</code> edge to B pairs with B's <code>LIEGE</code> edge to A — so a hierarchy is represented by two rows, not one.</p>\n<p>The service enforces that pairing rather than assuming it. <code>getLiege</code> reads the faction's own <code>LIEGE</code> edge, then checks the reverse direction for a matching <code>VASSAL</code> edge before accepting the answer; <code>getVassals</code> filters symmetrically. A half-written hierarchy — one row present, its counterpart missing — resolves to no relationship at all rather than to a lopsided one.</p>\n<p>Storing both directions also means &quot;who are my allies?&quot; and &quot;who considers me an ally?&quot; are the same cheap query.</p>\n<h2 id=\"why-relationships-get-an-approval-step\">Why relationships get an approval step</h2>\n<p>Because a relationship change binds two independent groups of players, it cannot be a unilateral command. <a class=\"wl\" href=\"#/approval-request\" data-id=\"approval-request\">Approval Request</a> exists for exactly the three relationship transitions that need consent — war, alliance, and vassalisation.</p>\n<h2 id=\"effect-on-the-rest-of-the-model\">Effect on the rest of the model</h2>\n<p>Relationships are read by more of the codebase than any other domain concept:</p>\n<ul>\n<li><a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> walks a faction's vassals to compute their contribution.\n</li>\n<li><a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> settings such as <code>alliesCanInteractWithLand</code> and <code>vassalageTreeCanInteractWithLand</code> turn relationship type into land access.\n</li>\n<li>Combat rules consult war status before allowing PvP between factions.\n</li>\n</ul>\n<h2 id=\"related\">Related</h2>\n<p><a class=\"wl\" href=\"#/vassalage\" data-id=\"vassalage\">Vassalage</a> covers the liege/vassal pair specifically, since it carries mechanical weight that alliance does not.</p>", "id": "faction-relationship", "links": ["faction", "approval-request", "faction-power", "faction-flag", "vassalage"], "sourcePath": "notes/concepts/faction-relationship.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-relationship.md", "sources": [{"claim": "The relationship type enum has exactly four values, ALLY, AT_WAR, VASSAL, and LIEGE.", "label": "Medieval-Factions/MfFactionRelationshipType.kt:3-8", "lines": "3-8", "path": "src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationshipType.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationshipType.kt#L3-L8"}, {"claim": "A relationship is a record of an id, a factionId, a targetId and a type — a directed edge from one faction to another.", "label": "Medieval-Factions/MfFactionRelationship.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationship.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationship.kt"}, {"claim": "Both getLiege and getVassals confirm the reverse edge before accepting a result — getLiege requires a matching VASSAL edge back, and getVassals filters to targets that carry a matching LIEGE edge back.", "label": "Medieval-Factions/MfFactionRelationshipService.kt:101-121", "lines": "101-121", "path": "src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationshipService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/relationship/MfFactionRelationshipService.kt#L101-L121"}], "summary": "Diplomacy is stored as directed edges between factions, typed as ally, at war, vassal, or liege.", "tags": ["medieval-factions", "domain-model", "diplomacy"], "text": "faction relationship diplomacy is stored as directed edges between factions, typed as ally, at war, vassal, or liege. \ndiplomacy is not a field on the [[faction]] record. it is a separate table of\ndirected edges, each carrying one of four types: `ally`, `at_war`, `vassal`, or\n`liege`.\n\n## directed, not symmetric\n\neach row records a relationship *from* one faction *to* another. two of the four\ntypes are inverses — a's `vassal` edge to b pairs with b's `liege` edge to a —\nso a hierarchy is represented by two rows, not one.\n\nthe service enforces that pairing rather than assuming it. `getliege` reads the\nfaction's own `liege` edge, then checks the reverse direction for a matching\n`vassal` edge before accepting the answer; `getvassals` filters symmetrically. a\nhalf-written hierarchy — one row present, its counterpart missing — resolves to\nno relationship at all rather than to a lopsided one.\n\nstoring both directions also means \"who are my allies?\" and \"who considers me an\nally?\" are the same cheap query.\n\n## why relationships get an approval step\n\nbecause a relationship change binds two independent groups of players, it cannot\nbe a unilateral command. [[approval-request]] exists for exactly the three\nrelationship transitions that need consent — war, alliance, and vassalisation.\n\n## effect on the rest of the model\n\nrelationships are read by more of the codebase than any other domain concept:\n\n- [[faction-power]] walks a faction's vassals to compute their contribution.\n- [[faction-flag]] settings such as `alliescaninteractwithland` and\n  `vassalagetreecaninteractwithland` turn relationship type into land access.\n- combat rules consult war status before allowing pvp between factions.\n\n## related\n\n[[vassalage]] covers the liege/vassal pair specifically, since it carries\nmechanical weight that alliance does not.\n", "title": "Faction Relationship", "toc": [{"level": 2, "slug": "directed-not-symmetric", "text": "Directed, not symmetric"}, {"level": 2, "slug": "why-relationships-get-an-approval-step", "text": "Why relationships get an approval step"}, {"level": 2, "slug": "effect-on-the-rest-of-the-model", "text": "Effect on the rest of the model"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "faction-role": {"backlinks": ["faction", "faction-permission", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "repository-pattern"], "html": "<p>A role is a named set of <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> overrides. Each member of a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> holds exactly one, and a faction defines its own roles rather than picking from a fixed list.</p>\n<h2 id=\"three-level-resolution\">Three-level resolution</h2>\n<p>The permission map is <code>Map&lt;String, Boolean?&gt;</code>, and the nullability carries meaning. Looking up whether a role grants a permission walks three levels:</p>\n<ol>\n<li><strong>The role's own value</strong>, if it is not null.\n</li>\n<li><strong>The faction's default</strong> for that permission.\n</li>\n<li><strong>The permission's built-in default.</strong>\n</li>\n</ol>\n<p>Null therefore means <em>inherit</em>, distinct from an explicit <code>false</code> meaning <em>deny</em>. That distinction is what lets a faction change a default and have every role that has not opted out follow along — a role with all-null values tracks the faction's policy automatically.</p>\n<h2 id=\"serialized-by-name\">Serialized by name</h2>\n<p>Roles store <code>permissionsByName: Map&lt;String, Boolean?&gt;</code> and resolve those strings to permission objects on read, discarding any that no longer parse. Storing names rather than object references means a permission that is removed from the plugin does not break deserialization of existing factions — the stale entry is simply dropped. It also means a typo silently becomes a no-op, which is the cost of that robustness.</p>\n<p>Roles implement Bukkit's <code>ConfigurationSerializable</code>, so they round-trip through the same serialization the rest of the plugin's configuration uses.</p>\n<h2 id=\"defaults\">Defaults</h2>\n<p>A new faction is not created with an empty role set. <code>MfFactionRoles.defaults()</code> builds three: <strong>Owner</strong>, <strong>Officer</strong>, and <strong>Member</strong> — with Member as the <code>defaultRoleId</code> that new joiners receive. Owner is granted everything, Officer a curated middle tier (diplomacy, kicking, setting home, and managing the Member role), and Member nothing but the permissions whose own default is <code>true</code>.</p>\n<p>A freshly founded faction is therefore immediately governable, and the three-tier shape is a suggestion rather than a constraint — a faction can create, delete, and rename roles from there.</p>\n<h2 id=\"related\">Related</h2>\n<p><a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a> describes what can be granted. Roles are stored inline on the <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record rather than in their own table, which is why changing a role bumps the faction's <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> version.</p>", "id": "faction-role", "links": ["faction-permission", "faction", "optimistic-locking"], "sourcePath": "notes/concepts/faction-role.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/faction-role.md", "sources": [{"claim": "A role holds an id, a name, and a map of permission names to nullable booleans, and resolves a permission by falling back from the role to the faction default to the permission's own default.", "label": "Medieval-Factions/MfFactionRole.kt:9-30", "lines": "9-30", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/role/MfFactionRole.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/role/MfFactionRole.kt#L9-L30"}, {"claim": "A new faction is created with three roles, Owner, Officer and Member, with Member set as the default role.", "label": "Medieval-Factions/MfFactionRoles.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/role/MfFactionRoles.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/role/MfFactionRoles.kt"}], "summary": "A named bundle of permission overrides that a faction assigns to its members.", "tags": ["medieval-factions", "domain-model", "governance"], "text": "faction role a named bundle of permission overrides that a faction assigns to its members. \na role is a named set of [[faction-permission]] overrides. each member of a\n[[faction]] holds exactly one, and a faction defines its own roles rather than\npicking from a fixed list.\n\n## three-level resolution\n\nthe permission map is `map<string, boolean?>`, and the nullability carries\nmeaning. looking up whether a role grants a permission walks three levels:\n\n1. **the role's own value**, if it is not null.\n2. **the faction's default** for that permission.\n3. **the permission's built-in default.**\n\nnull therefore means *inherit*, distinct from an explicit `false` meaning *deny*.\nthat distinction is what lets a faction change a default and have every role\nthat has not opted out follow along — a role with all-null values tracks the\nfaction's policy automatically.\n\n## serialized by name\n\nroles store `permissionsbyname: map<string, boolean?>` and resolve those strings\nto permission objects on read, discarding any that no longer parse. storing\nnames rather than object references means a permission that is removed from the\nplugin does not break deserialization of existing factions — the stale entry is\nsimply dropped. it also means a typo silently becomes a no-op, which is the cost\nof that robustness.\n\nroles implement bukkit's `configurationserializable`, so they round-trip through\nthe same serialization the rest of the plugin's configuration uses.\n\n## defaults\n\na new faction is not created with an empty role set. `mffactionroles.defaults()`\nbuilds three: **owner**, **officer**, and **member** — with member as the\n`defaultroleid` that new joiners receive. owner is granted everything, officer a\ncurated middle tier (diplomacy, kicking, setting home, and managing the member\nrole), and member nothing but the permissions whose own default is `true`.\n\na freshly founded faction is therefore immediately governable, and the three-tier\nshape is a suggestion rather than a constraint — a faction can create, delete,\nand rename roles from there.\n\n## related\n\n[[faction-permission]] describes what can be granted. roles are stored inline on\nthe [[faction]] record rather than in their own table, which is why changing a\nrole bumps the faction's [[optimistic-locking]] version.\n", "title": "Faction Role", "toc": [{"level": 2, "slug": "three-level-resolution", "text": "Three-level resolution"}, {"level": 2, "slug": "serialized-by-name", "text": "Serialized by name"}, {"level": 2, "slug": "defaults", "text": "Defaults"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "fiefs": {"backlinks": ["claimed-chunk", "currencies", "dpc-mc-server", "expansion-plugin", "medieval-factions", "moc-medieval-factions", "moc-plugin-ecosystem", "ponder", "value-class-identifier"], "html": "<p>Fiefs lets members of a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> carve out sub-factions — a fief has its own members, its own claimed chunks within the parent's territory, and its own flags. It is the feudal layer below the faction.</p>\n<h2 id=\"an-older-generation\">An older generation</h2>\n<p>Fiefs is Java, not Kotlin, and it is built on an earlier stack: it extends <code>PonderBukkitPlugin</code> from an older <a class=\"wl\" href=\"#/ponder\" data-id=\"ponder\">Ponder</a> API, keeps state in a <code>PersistentData</code> object with a <code>StorageService</code> writing files, and talks to the flagship through a hand-written <code>MedievalFactionsIntegrator</code>.</p>\n<p>Its <code>dependencies/</code> directory holds the jars it compiles against — <code>Medieval-Factions-4.6.2.jar</code> and <code>Ponder-v0.15-alpha-2.jar</code>. It therefore targets <strong>Medieval Factions 4</strong>, not the version 5 described everywhere else in this collection.</p>\n<h2 id=\"why-that-matters\">Why that matters</h2>\n<p>The integrator pattern is what a plugin does when the plugin it extends offers no typed API: reflectively or defensively fetch the other plugin, wrap it, and degrade if it is missing. Compare <a class=\"wl\" href=\"#/currencies\" data-id=\"currencies\">Currencies</a>, which simply imports <code>MfFactionId</code> and <code>MedievalFactions</code> because version 5 exposes them.</p>\n<p>Reading the two together is the best available illustration of what the version 5 rewrite bought — see <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">Expansion Plugin</a>.</p>\n<h2 id=\"its-own-claim-model\">Its own claim model</h2>\n<p>Fiefs has its own <code>ClaimedChunk</code> class, separate from the flagship's <a class=\"wl\" href=\"#/claimed-chunk\" data-id=\"claimed-chunk\">Claimed Chunk</a>. Two independent claim registries over the same ground is inherent to the sub-faction idea, but it does mean a chunk's ownership is a question with two answers depending on which plugin you ask.</p>\n<h2 id=\"related\">Related</h2>\n<p>Fiefs is one of the two official expansions listed in the flagship's README, and ships in the curated set on <a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a>.</p>", "id": "fiefs", "links": ["faction", "ponder", "currencies", "expansion-plugin", "claimed-chunk", "dpc-mc-server"], "sourcePath": "notes/concepts/fiefs.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/fiefs.md", "sources": [{"claim": "Fiefs allows faction members to create fiefs, which function as sub-factions, and depends on Medieval Factions in order to work.", "label": "Fiefs/README.md", "lines": "", "path": "README.md", "ref": "4c66e09aa50f467921ce1519f0b7236a5f23f7a2", "repo": "Dans-Plugins/Fiefs", "shortRef": "4c66e09", "url": "https://github.com/Dans-Plugins/Fiefs/blob/4c66e09aa50f467921ce1519f0b7236a5f23f7a2/README.md"}, {"claim": "Fiefs extends PonderBukkitPlugin and reaches Medieval Factions through its own MedievalFactionsIntegrator class rather than by importing flagship domain types.", "label": "Fiefs/Fiefs.java", "lines": "", "path": "src/main/java/dansplugins/fiefs/Fiefs.java", "ref": "4c66e09aa50f467921ce1519f0b7236a5f23f7a2", "repo": "Dans-Plugins/Fiefs", "shortRef": "4c66e09", "url": "https://github.com/Dans-Plugins/Fiefs/blob/4c66e09aa50f467921ce1519f0b7236a5f23f7a2/src/main/java/dansplugins/fiefs/Fiefs.java"}], "summary": "An expansion adding sub-factions inside a faction — and the clearest surviving example of the pre-version-5 integration style.", "tags": ["fiefs", "expansion", "ecosystem"], "text": "fiefs an expansion adding sub-factions inside a faction — and the clearest surviving example of the pre-version-5 integration style. \nfiefs lets members of a [[faction]] carve out sub-factions — a fief has its own\nmembers, its own claimed chunks within the parent's territory, and its own\nflags. it is the feudal layer below the faction.\n\n## an older generation\n\nfiefs is java, not kotlin, and it is built on an earlier stack: it extends\n`ponderbukkitplugin` from an older [[ponder]] api, keeps state in a\n`persistentdata` object with a `storageservice` writing files, and talks to the\nflagship through a hand-written `medievalfactionsintegrator`.\n\nits `dependencies/` directory holds the jars it compiles against —\n`medieval-factions-4.6.2.jar` and `ponder-v0.15-alpha-2.jar`. it therefore\ntargets **medieval factions 4**, not the version 5 described everywhere else in\nthis collection.\n\n## why that matters\n\nthe integrator pattern is what a plugin does when the plugin it extends offers\nno typed api: reflectively or defensively fetch the other plugin, wrap it, and\ndegrade if it is missing. compare [[currencies]], which simply imports\n`mffactionid` and `medievalfactions` because version 5 exposes them.\n\nreading the two together is the best available illustration of what the version\n5 rewrite bought — see [[expansion-plugin]].\n\n## its own claim model\n\nfiefs has its own `claimedchunk` class, separate from the flagship's\n[[claimed-chunk]]. two independent claim registries over the same ground is\ninherent to the sub-faction idea, but it does mean a chunk's ownership is a\nquestion with two answers depending on which plugin you ask.\n\n## related\n\nfiefs is one of the two official expansions listed in the flagship's readme, and\nships in the curated set on [[dpc-mc-server]].\n", "title": "Fiefs", "toc": [{"level": 2, "slug": "an-older-generation", "text": "An older generation"}, {"level": 2, "slug": "why-that-matters", "text": "Why that matters"}, {"level": 2, "slug": "its-own-claim-model", "text": "Its own claim model"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "gate": {"backlinks": ["main-thread-safety", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "optimistic-locking"], "html": "<p>A gate is a rectangular region of blocks owned by a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> that fills and empties itself in response to redstone. It is the castle-drawbridge affordance: a wall you can open without breaking it.</p>\n<h2 id=\"the-record\">The record</h2>\n<p><code>MfGate</code> stores a cuboid <code>area</code>, a single <code>trigger</code> block position, the <code>material</code> to fill the area with, and a <code>status</code>. It does <em>not</em> store the blocks themselves — the material plus the area is enough to reconstruct the wall.</p>\n<h2 id=\"guarded-against-unloaded-chunks\">Guarded against unloaded chunks</h2>\n<p>Both <code>shouldOpen()</code> and <code>shouldClose()</code> begin by resolving the trigger's world and checking <code>isChunkLoaded</code> before touching the block, returning <code>false</code> if either fails. This is the load-bearing detail: a gate whose trigger sits in an unloaded chunk must be treated as <em>unchanged</em>, not as unpowered. Reading a block in an unloaded chunk would force a synchronous chunk load on the server thread — a stall on the main thread every tick, for every gate on the server.</p>\n<p>The consequence players see is that a gate only responds while someone is nearby enough to keep its trigger loaded.</p>\n<h2 id=\"four-states-not-two\">Four states, not two</h2>\n<p><code>MfGateStatus</code> is <code>OPEN</code>, <code>OPENING</code>, <code>CLOSED</code>, <code>CLOSING</code>. The transitional states exist because a gate does not change in one tick — it is animated block by block, and a gate caught mid-open must not be told to open again.</p>\n<p>Because the status is persisted rather than inferred from the blocks, the plugin knows what a gate believes it is after a restart, and after the area's blocks have been altered by other means.</p>\n<h2 id=\"related\">Related</h2>\n<p>Gates are one of the record types carried across by <a class=\"wl\" href=\"#/legacy-data-migration\" data-id=\"legacy-data-migration\">Legacy Data Migration</a>, so the format predates the current database schema.</p>", "id": "gate", "links": ["faction", "legacy-data-migration"], "sourcePath": "notes/concepts/gate.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/gate.md", "sources": [{"claim": "A gate holds a faction id, a cuboid area, a trigger block position, a material and a status, and decides whether to open or close by testing whether the trigger block is directly or indirectly powered.", "label": "Medieval-Factions/MfGate.kt:13-39", "lines": "13-39", "path": "src/main/kotlin/com/dansplugins/factionsystem/gate/MfGate.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/gate/MfGate.kt#L13-L39"}, {"claim": "Gate status is an enum with four values, OPEN, OPENING, CLOSED and CLOSING.", "label": "Medieval-Factions/MfGateStatus.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/gate/MfGateStatus.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/gate/MfGateStatus.kt"}], "summary": "A faction-owned wall of blocks that opens and closes when a redstone trigger block is powered.", "tags": ["medieval-factions", "domain-model", "territory"], "text": "gate a faction-owned wall of blocks that opens and closes when a redstone trigger block is powered. \na gate is a rectangular region of blocks owned by a [[faction]] that fills and\nempties itself in response to redstone. it is the castle-drawbridge affordance:\na wall you can open without breaking it.\n\n## the record\n\n`mfgate` stores a cuboid `area`, a single `trigger` block position, the\n`material` to fill the area with, and a `status`. it does *not* store the blocks\nthemselves — the material plus the area is enough to reconstruct the wall.\n\n## guarded against unloaded chunks\n\nboth `shouldopen()` and `shouldclose()` begin by resolving the trigger's world\nand checking `ischunkloaded` before touching the block, returning `false` if\neither fails. this is the load-bearing detail: a gate whose trigger sits in an\nunloaded chunk must be treated as *unchanged*, not as unpowered. reading a block\nin an unloaded chunk would force a synchronous chunk load on the server thread —\na stall on the main thread every tick, for every gate on the server.\n\nthe consequence players see is that a gate only responds while someone is nearby\nenough to keep its trigger loaded.\n\n## four states, not two\n\n`mfgatestatus` is `open`, `opening`, `closed`, `closing`. the transitional\nstates exist because a gate does not change in one tick — it is animated block\nby block, and a gate caught mid-open must not be told to open again.\n\nbecause the status is persisted rather than inferred from the blocks, the plugin\nknows what a gate believes it is after a restart, and after the area's blocks\nhave been altered by other means.\n\n## related\n\ngates are one of the record types carried across by [[legacy-data-migration]],\nso the format predates the current database schema.\n", "title": "Gate", "toc": [{"level": 2, "slug": "the-record", "text": "The record"}, {"level": 2, "slug": "guarded-against-unloaded-chunks", "text": "Guarded against unloaded chunks"}, {"level": 2, "slug": "four-states-not-two", "text": "Four states, not two"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "jooq-persistence": {"backlinks": ["legacy-data-migration", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture", "repository-pattern"], "html": "<p><a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> persists through jOOQ against a HikariCP connection pool, with the schema managed by Flyway. All three are configured once in <code>onEnable</code> and never referenced again outside the <code>Jooq*Repository</code> classes.</p>\n<h2 id=\"the-default-is-a-file\">The default is a file</h2>\n<p>Out of the box the database is embedded H2 at <code>./medieval_factions_db</code>, with three settings that matter:</p>\n<ul>\n<li><code>AUTO_SERVER=true</code> — H2 starts a TCP server beside the embedded database, so an operator can query the live data with a SQL client while the Minecraft server is running. This is what makes <code>DATABASE_QUERYING.md</code> possible.\n</li>\n<li><code>MODE=MYSQL</code> — H2 emulates MySQL, so SQL written for one mostly works on both.\n</li>\n<li><code>DATABASE_TO_UPPER=false</code> — identifiers stay lowercase and case-sensitive.\n</li>\n</ul>\n<p>A server that outgrows the file changes <code>database.url</code> and <code>database.dialect</code> and nothing else; the <code>SQLDialect</code> is read straight from config and handed to jOOQ, which is what makes MySQL and PostgreSQL viable without touching code.</p>\n<h2 id=\"flyway-owns-the-schema\">Flyway owns the schema</h2>\n<p>Migrations live on the classpath under <code>com/dansplugins/factionsystem/db/migration</code>, with history in a dedicated <code>mf_schema_history</code> table. Two configuration choices are worth noting: <code>baselineOnMigrate(true)</code> with <code>baselineVersion(&quot;0&quot;)</code> lets Flyway adopt a database it did not create, and <code>validateOnMigrate(false)</code> tolerates checksum drift rather than refusing to start.</p>\n<p>The migration runs with the plugin's own classloader temporarily installed as the thread context classloader, and the original restored afterwards. That dance is required because Flyway scans the classpath by reflection, and inside a Bukkit server the thread context classloader is not the one holding the plugin's resources.</p>\n<h2 id=\"related\">Related</h2>\n<p>The repositories built on this DSL are described in <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a>, and the version-column protocol they implement is <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a>.</p>", "id": "jooq-persistence", "links": ["medieval-factions", "repository-pattern", "optimistic-locking"], "sourcePath": "notes/concepts/jooq-persistence.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/jooq-persistence.md", "sources": [{"claim": "The plugin builds a HikariDataSource from config, runs Flyway migrations from a classpath location into an mf_schema_history table with baselineOnMigrate enabled, then creates a jOOQ DSL context using a dialect read from config.", "label": "Medieval-Factions/MedievalFactions.kt:150-184", "lines": "150-184", "path": "src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt#L150-L184"}, {"claim": "The default database is embedded H2 with AUTO_SERVER=true, MODE=MYSQL and DATABASE_TO_UPPER=false, which allows a second process to query the file while the server runs.", "label": "Medieval-Factions/DATABASE_QUERYING.md", "lines": "", "path": "DATABASE_QUERYING.md", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/DATABASE_QUERYING.md"}], "summary": "Storage is jOOQ over a Hikari pool, with Flyway migrations and a configurable SQL dialect — H2 by default, MySQL or PostgreSQL optionally.", "tags": ["medieval-factions", "architecture", "persistence"], "text": "jooq persistence storage is jooq over a hikari pool, with flyway migrations and a configurable sql dialect — h2 by default, mysql or postgresql optionally. \n[[medieval-factions]] persists through jooq against a hikaricp connection pool,\nwith the schema managed by flyway. all three are configured once in `onenable`\nand never referenced again outside the `jooq*repository` classes.\n\n## the default is a file\n\nout of the box the database is embedded h2 at `./medieval_factions_db`, with\nthree settings that matter:\n\n- `auto_server=true` — h2 starts a tcp server beside the embedded database, so\n  an operator can query the live data with a sql client while the minecraft\n  server is running. this is what makes `database_querying.md` possible.\n- `mode=mysql` — h2 emulates mysql, so sql written for one mostly works on both.\n- `database_to_upper=false` — identifiers stay lowercase and case-sensitive.\n\na server that outgrows the file changes `database.url` and `database.dialect`\nand nothing else; the `sqldialect` is read straight from config and handed to\njooq, which is what makes mysql and postgresql viable without touching code.\n\n## flyway owns the schema\n\nmigrations live on the classpath under\n`com/dansplugins/factionsystem/db/migration`, with history in a dedicated\n`mf_schema_history` table. two configuration choices are worth noting:\n`baselineonmigrate(true)` with `baselineversion(\"0\")` lets flyway adopt a\ndatabase it did not create, and `validateonmigrate(false)` tolerates checksum\ndrift rather than refusing to start.\n\nthe migration runs with the plugin's own classloader temporarily installed as\nthe thread context classloader, and the original restored afterwards. that dance\nis required because flyway scans the classpath by reflection, and inside a\nbukkit server the thread context classloader is not the one holding the\nplugin's resources.\n\n## related\n\nthe repositories built on this dsl are described in [[repository-pattern]], and\nthe version-column protocol they implement is [[optimistic-locking]].\n", "title": "jOOQ Persistence", "toc": [{"level": 2, "slug": "the-default-is-a-file", "text": "The default is a file"}, {"level": 2, "slug": "flyway-owns-the-schema", "text": "Flyway owns the schema"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "law": {"backlinks": ["faction-permission", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "optimistic-locking"], "html": "<p>A law is a numbered line of text belonging to a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>. The plugin stores it, orders it, and displays it — and does nothing else with it.</p>\n<h2 id=\"inert-by-construction\">Inert by construction</h2>\n<p>Nothing in the codebase reads a law's text and acts on it. <code>MfLawService</code> offers get, save, delete, and move — there is no rule engine, no automatic punishment, no parser. A law is a <code>String</code> with an ordinal.</p>\n<p>Set beside <a class=\"wl\" href=\"#/faction-permission\" data-id=\"faction-permission\">Faction Permission</a>, which <em>is</em> enforced, the pair marks a line: permissions constrain what a client is <em>able</em> to do, while laws describe what members <em>should</em> do. One is a security boundary; the other is a social one, and only the first is the plugin's to police.</p>\n<p>Whether that split was reasoned out or simply where the feature stopped is not recorded anywhere. What is on the record is the README's framing of the plugin — players &quot;write laws&quot; and &quot;attempt to recreate society somewhat&quot; — which reads as a description of props for a society rather than of a system that runs one.</p>\n<h2 id=\"numbering\">Numbering</h2>\n<p>The <code>number</code> field is nullable, and the convenience constructor that takes a faction and a string leaves it null — a caller adding a law does not choose where it lands. Ordering is settled on persistence, and <code>MfLawService.move(law, number)</code> is the only way to renumber one afterwards, delegating to the repository so the whole faction's list is resequenced in one place rather than by each caller.</p>\n<p><code>MfLawService</code> is also the leanest service in the plugin: it takes a repository and nothing else, no plugin handle. Everything it does is a repository call wrapped in a <code>Result4k</code> — the minimal shape described in <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>.</p>\n<h2 id=\"related\">Related</h2>\n<p>Law shares the standard record shape — an id, a <code>version</code> for <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a>, and a <code>factionId</code> foreign key — with every other per-faction record. If you are adding a comparable feature, this is the smallest complete example to copy.</p>", "id": "law", "links": ["faction", "faction-permission", "service-layer", "optimistic-locking"], "sourcePath": "notes/concepts/law.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/law.md", "sources": [{"claim": "A law is a record of id, version, factionId, text, and an optional number, and a new law is constructed from a faction and a string.", "label": "Medieval-Factions/MfLaw.kt:6-22", "lines": "6-22", "path": "src/main/kotlin/com/dansplugins/factionsystem/law/MfLaw.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/law/MfLaw.kt#L6-L22"}, {"claim": "The law service exposes only get, save, delete and move — no evaluation or enforcement of a law's text.", "label": "Medieval-Factions/MfLawService.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/law/MfLawService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/law/MfLawService.kt"}, {"claim": "The README describes the plugin as letting players write laws and generally attempt to recreate society, framing it as a set of mechanics rather than an enforcement system.", "label": "Medieval-Factions/README.md", "lines": "", "path": "README.md", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/README.md"}], "summary": "Numbered lines of text a faction publishes to its members — enforced socially, not mechanically.", "tags": ["medieval-factions", "domain-model", "roleplay"], "text": "law numbered lines of text a faction publishes to its members — enforced socially, not mechanically. \na law is a numbered line of text belonging to a [[faction]]. the plugin stores\nit, orders it, and displays it — and does nothing else with it.\n\n## inert by construction\n\nnothing in the codebase reads a law's text and acts on it. `mflawservice` offers\nget, save, delete, and move — there is no rule engine, no automatic punishment,\nno parser. a law is a `string` with an ordinal.\n\nset beside [[faction-permission]], which *is* enforced, the pair marks a line:\npermissions constrain what a client is *able* to do, while laws describe what\nmembers *should* do. one is a security boundary; the other is a social one, and\nonly the first is the plugin's to police.\n\nwhether that split was reasoned out or simply where the feature stopped is not\nrecorded anywhere. what is on the record is the readme's framing of the plugin —\nplayers \"write laws\" and \"attempt to recreate society somewhat\" — which reads as\na description of props for a society rather than of a system that runs one.\n\n## numbering\n\nthe `number` field is nullable, and the convenience constructor that takes a\nfaction and a string leaves it null — a caller adding a law does not choose where\nit lands. ordering is settled on persistence, and `mflawservice.move(law, number)`\nis the only way to renumber one afterwards, delegating to the repository so the\nwhole faction's list is resequenced in one place rather than by each caller.\n\n`mflawservice` is also the leanest service in the plugin: it takes a repository\nand nothing else, no plugin handle. everything it does is a repository call\nwrapped in a `result4k` — the minimal shape described in [[service-layer]].\n\n## related\n\nlaw shares the standard record shape — an id, a `version` for\n[[optimistic-locking]], and a `factionid` foreign key — with every other\nper-faction record. if you are adding a comparable feature, this is the smallest\ncomplete example to copy.\n", "title": "Law", "toc": [{"level": 2, "slug": "inert-by-construction", "text": "Inert by construction"}, {"level": 2, "slug": "numbering", "text": "Numbering"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "legacy-data-migration": {"backlinks": ["gate", "locked-block", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture"], "html": "<p>Medieval Factions 4 stored its data in flat JSON files. Version 5 stores it in a database (see <a class=\"wl\" href=\"#/jooq-persistence\" data-id=\"jooq-persistence\">jOOQ Persistence</a>). The <code>legacy</code> package exists to carry a version 4 server across that gap exactly once.</p>\n<h2 id=\"the-deliberate-shutdown\">The deliberate shutdown</h2>\n<p>The interesting decision is what happens on first boot after the upgrade. On detecting a <code>v4.</code> version string in the config, the plugin does <em>not</em> migrate. It:</p>\n<ol>\n<li>Backs up the old data files.\n</li>\n<li>Writes fresh defaults and sets <code>migrateMf4: true</code>.\n</li>\n<li>Logs that the server is shutting down for migration, and that a database should be configured now if one is wanted.\n</li>\n<li>Calls <code>server.shutdown()</code>.\n</li>\n</ol>\n<p>Migration then runs on the <em>next</em> start. This costs the operator a restart and buys something worth more: a chance to point <code>database.url</code> at MySQL before any data is written. Migrating first and asking later would strand every server on the default embedded H2 file, and there is no second migration to move them.</p>\n<p>The forced stop is also honest about risk. Migration is irreversible; a server that hits it unaware would otherwise discover the change mid-session with players connected.</p>\n<h2 id=\"legacy-records-are-separate-types\">Legacy records are separate types</h2>\n<p><code>MfLegacyFaction</code>, <code>MfLegacyClaimedChunk</code>, <code>MfLegacyGate</code>, <code>MfLegacyLockedBlock</code>, <code>MfLegacyPowerRecord</code>, <code>MfLegacyActivityRecord</code>, <code>MfLegacyLocation</code> mirror the version 4 JSON shapes rather than reusing the current domain classes.</p>\n<p>Keeping them separate is what lets the current model evolve freely — <a class
