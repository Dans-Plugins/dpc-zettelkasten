he data path that connects a live game server to the public site.", "tags": ["moc", "dpc", "web", "infrastructure"], "text": "web and infrastructure the community website, the containerised minecraft server, and the data path that connects a live game server to the public site. \nnot everything in the organization runs inside minecraft.\n\n## the website\n\n[[dansplugins-dot-com]] is the community's public face: a next.js application\nlisting the plugins, hosting guides, and — since the addition of accounts —\nletting players claim a profile.\n\n## the server\n\n[[dpc-mc-server]] is an infrastructure-as-code spigot server. it pins specific\nplugin jars into a docker image, which makes it the closest thing the\norganization has to an integration environment: if a change breaks the\ninteraction between two plugins, this is where it shows up.\n\n## the connection between them\n\n[[dpc-api-faction-sync]] is the bridge. a running [[medieval-factions]] server\ncan be configured to post its faction roster to the website's api on an\ninterval, which is how live in-game data reaches a public web page.\n\nthat path is the most operationally dangerous code in the organization, because\na bad request does not corrupt one server's data — it corrupts the shared\nregistry. the note explains the guards that exist because of it.\n\n## distribution\n\n[[dans-plugin-manager]] closes the loop for server operators, pulling published\nplugin releases onto a running server without a manual download.\n", "title": "Web and Infrastructure", "toc": [{"level": 2, "slug": "the-website", "text": "The website"}, {"level": 2, "slug": "the-server", "text": "The server"}, {"level": 2, "slug": "the-connection-between-them", "text": "The connection between them"}, {"level": 2, "slug": "distribution", "text": "Distribution"}], "type": "moc", "updated": "2026-08-07"}, "notification": {"backlinks": ["mailboxes", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture", "moc-plugin-ecosystem"], "html": "<p>When <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> needs to tell a player something and that player is offline, it hands the message to an <code>MfNotificationService</code>. The interface has one method and no return value.</p>\n<h2 id=\"three-implementations-chosen-once\">Three implementations, chosen once</h2>\n<p><code>setupNotificationService()</code> is a single <code>when</code> expression evaluated during <code>onEnable</code>:</p>\n<ol>\n<li><strong>Mailboxes</strong> — if the <a class=\"wl\" href=\"#/mailboxes\" data-id=\"mailboxes\">Mailboxes</a> plugin is installed, the message waits in the player's in-game mail.\n</li>\n<li><strong>RPKit</strong> — otherwise, if <code>rpk-notification-lib-bukkit</code> is installed.\n</li>\n<li><strong>No-op</strong> — otherwise, the message is discarded.\n</li>\n</ol>\n<p>The order is a preference, not a negotiation: with both installed, Mailboxes wins and RPKit is never consulted. The rest of the codebase never learns which was chosen. <code>MfFaction.sendMessage</code> illustrates the intended use: message online members directly, and route the offline ones through the notification service.</p>\n<h2 id=\"degrading-quietly\">Degrading quietly</h2>\n<p>The Mailboxes implementation begins by fetching the plugin from Bukkit's plugin manager and casting it, returning immediately on a null or failed cast. A notification to an unreachable backend is dropped, not raised.</p>\n<p>That is the right call for this particular payload — a faction announcement is not worth a stack trace in the console on every send, and the alternative (throwing from a notification path) would let a missing optional dependency break faction operations. It does mean a misconfigured server loses messages silently.</p>\n<h2 id=\"why-an-interface-at-all\">Why an interface at all</h2>\n<p>The no-op implementation is the tell. Rather than scatter <code>if (mailboxesInstalled)</code> checks through the codebase, the plugin resolves the question once at startup and lets the type system carry the answer. This is the same shape as <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a>, and it is the pattern to copy when integrating any optional plugin.</p>\n<h2 id=\"related\">Related</h2>\n<p>The <code>MfNotification</code> record itself is just a title and a body — no severity, no routing hints. Anything richer would have to be encoded in the text.</p>", "id": "notification", "links": ["medieval-factions", "mailboxes", "map-integration"], "sourcePath": "notes/concepts/notification.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/notification.md", "sources": [{"claim": "The notification service interface declares a single method taking a player id and a notification.", "label": "Medieval-Factions/MfNotificationService.kt:5-7", "lines": "5-7", "path": "src/main/kotlin/com/dansplugins/factionsystem/notification/MfNotificationService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/notification/MfNotificationService.kt#L5-L7"}, {"claim": "The Mailboxes-backed implementation looks the plugin up by name, returns silently if it is absent, and forwards the notification through the Mailboxes API's sendPluginMessageToPlayer.", "label": "Medieval-Factions/MailboxesNotificationService.kt:10-16", "lines": "10-16", "path": "src/main/kotlin/com/dansplugins/factionsystem/notification/mailboxes/MailboxesNotificationService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/notification/mailboxes/MailboxesNotificationService.kt#L10-L16"}, {"claim": "The implementation is chosen at startup by a when expression that prefers Mailboxes, falls back to RpkNotificationService when rpk-notification-lib-bukkit is present, and otherwise uses the no-op service.", "label": "Medieval-Factions/MedievalFactions.kt:559-563", "lines": "559-563", "path": "src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/MedievalFactions.kt#L559-L563"}], "summary": "A one-method interface for reaching an offline player, with implementations chosen at startup based on which plugins are installed.", "tags": ["medieval-factions", "architecture", "integration"], "text": "notification a one-method interface for reaching an offline player, with implementations chosen at startup based on which plugins are installed. \nwhen [[medieval-factions]] needs to tell a player something and that player is\noffline, it hands the message to an `mfnotificationservice`. the interface has\none method and no return value.\n\n## three implementations, chosen once\n\n`setupnotificationservice()` is a single `when` expression evaluated during\n`onenable`:\n\n1. **mailboxes** — if the [[mailboxes]] plugin is installed, the message waits\n   in the player's in-game mail.\n2. **rpkit** — otherwise, if `rpk-notification-lib-bukkit` is installed.\n3. **no-op** — otherwise, the message is discarded.\n\nthe order is a preference, not a negotiation: with both installed, mailboxes\nwins and rpkit is never consulted. the rest of the codebase never learns which\nwas chosen. `mffaction.sendmessage` illustrates the intended\nuse: message online members directly, and route the offline ones through the\nnotification service.\n\n## degrading quietly\n\nthe mailboxes implementation begins by fetching the plugin from bukkit's plugin\nmanager and casting it, returning immediately on a null or failed cast. a\nnotification to an unreachable backend is dropped, not raised.\n\nthat is the right call for this particular payload — a faction announcement is\nnot worth a stack trace in the console on every send, and the alternative\n(throwing from a notification path) would let a missing optional dependency\nbreak faction operations. it does mean a misconfigured server loses messages\nsilently.\n\n## why an interface at all\n\nthe no-op implementation is the tell. rather than scatter\n`if (mailboxesinstalled)` checks through the codebase, the plugin resolves the\nquestion once at startup and lets the type system carry the answer. this is the\nsame shape as [[map-integration]], and it is the pattern to copy when integrating\nany optional plugin.\n\n## related\n\nthe `mfnotification` record itself is just a title and a body — no severity, no\nrouting hints. anything richer would have to be encoded in the text.\n", "title": "Notification", "toc": [{"level": 2, "slug": "three-implementations-chosen-once", "text": "Three implementations, chosen once"}, {"level": 2, "slug": "degrading-quietly", "text": "Degrading quietly"}, {"level": 2, "slug": "why-an-interface-at-all", "text": "Why an interface at all"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "optimistic-locking": {"backlinks": ["currencies", "faction", "faction-flag", "faction-role", "jooq-persistence", "law", "legacy-data-migration", "medieval-factions", "moc-medieval-factions", "moc-plugin-architecture", "repository-pattern", "service-layer"], "html": "<p>Nearly every persisted record in <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> — <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a>, <a class=\"wl\" href=\"#/player-power\" data-id=\"player-power\">player</a>, <a class=\"wl\" href=\"#/law\" data-id=\"law\">Law</a>, <a class=\"wl\" href=\"#/gate\" data-id=\"gate\">Gate</a>, <a class=\"wl\" href=\"#/locked-block\" data-id=\"locked-block\">Locked Block</a> — carries an integer <code>version</code>. It is not domain data; it is a concurrency protocol.</p>\n<h2 id=\"the-protocol\">The protocol</h2>\n<pre><code class=\"lang-sql\">UPDATE mf_faction\n   SET ..., version = :version + 1\n WHERE id = :id\n   AND version = :version</code></pre>\n<p>If the row's version has moved since it was read, the <code>WHERE</code> matches nothing, the affected-row count is zero, and the repository throws <code>OptimisticLockingFailureException</code>. The <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a> maps that to a <code>CONFLICT</code> failure, which a command turns into &quot;someone else changed this, try again&quot;.</p>\n<h2 id=\"why-optimistic-rather-than-locked\">Why optimistic rather than locked</h2>\n<p>Two properties of the plugin make this the right trade:</p>\n<ul>\n<li><strong>Conflicts are rare.</strong> Two players editing the same <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> in the same instant is unusual. Taking a row lock on every write would pay a cost on every operation to protect against something that almost never happens.\n</li>\n<li><strong>Records are immutable.</strong> Domain objects are Kotlin <code>data class</code> values with <code>copy()</code>. A caller always holds a complete snapshot including the version it read, so the version travels with the object for free — there is nothing extra to thread through.\n</li>\n</ul>\n<p>Pessimistic locking would also mean holding a database transaction open across game logic, and game logic on a Bukkit server runs on the main thread. A held lock there is a stalled server.</p>\n<h2 id=\"failing-loudly-beats-a-lost-update\">Failing loudly beats a lost update</h2>\n<p>The alternative to rejecting the write is accepting it, which silently discards whatever the other writer did. For a <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> record — carrying the roster, the roles, and the flags — a lost update means a player's changes vanish with no error anywhere. A <code>CONFLICT</code> a player can retry is a much better failure.</p>\n<h2 id=\"related\">Related</h2>\n<p>Because roles and flags live inline on the faction record, editing either bumps the same version as renaming the faction. Fine-grained concurrent edits within one faction are therefore not possible by design.</p>", "id": "optimistic-locking", "links": ["medieval-factions", "faction", "player-power", "law", "gate", "locked-block", "service-layer"], "sourcePath": "notes/concepts/optimistic-locking.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/optimistic-locking.md", "sources": [{"claim": "The update sets version to version plus one, constrains the WHERE clause on both the id and the previously read version, and throws OptimisticLockingFailureException when no rows were affected.", "label": "Medieval-Factions/JooqMfFactionRepository.kt:170-174", "lines": "170-174", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt#L170-L174"}, {"claim": "The service maps an OptimisticLockingFailureException to the CONFLICT service failure type.", "label": "Medieval-Factions/MfFactionService.kt:198-202", "lines": "198-202", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionService.kt#L198-L202"}], "summary": "Every mutable record carries a version column; a write that does not match the version it read is rejected rather than silently overwriting.", "tags": ["medieval-factions", "architecture", "persistence", "concurrency"], "text": "optimistic locking every mutable record carries a version column; a write that does not match the version it read is rejected rather than silently overwriting. \nnearly every persisted record in [[medieval-factions]] — [[faction]],\n[[player-power|player]], [[law]], [[gate]], [[locked-block]] — carries an\ninteger `version`. it is not domain data; it is a concurrency protocol.\n\n## the protocol\n\n```sql\nupdate mf_faction\n   set ..., version = :version + 1\n where id = :id\n   and version = :version\n```\n\nif the row's version has moved since it was read, the `where` matches nothing,\nthe affected-row count is zero, and the repository throws\n`optimisticlockingfailureexception`. the [[service-layer]] maps that to a\n`conflict` failure, which a command turns into \"someone else changed this, try\nagain\".\n\n## why optimistic rather than locked\n\ntwo properties of the plugin make this the right trade:\n\n- **conflicts are rare.** two players editing the same [[faction]] in the same\n  instant is unusual. taking a row lock on every write would pay a cost on every\n  operation to protect against something that almost never happens.\n- **records are immutable.** domain objects are kotlin `data class` values with\n  `copy()`. a caller always holds a complete snapshot including the version it\n  read, so the version travels with the object for free — there is nothing extra\n  to thread through.\n\npessimistic locking would also mean holding a database transaction open across\ngame logic, and game logic on a bukkit server runs on the main thread. a held\nlock there is a stalled server.\n\n## failing loudly beats a lost update\n\nthe alternative to rejecting the write is accepting it, which silently discards\nwhatever the other writer did. for a [[faction]] record — carrying the roster,\nthe roles, and the flags — a lost update means a player's changes vanish with no\nerror anywhere. a `conflict` a player can retry is a much better failure.\n\n## related\n\nbecause roles and flags live inline on the faction record, editing either bumps\nthe same version as renaming the faction. fine-grained concurrent edits within\none faction are therefore not possible by design.\n", "title": "Optimistic Locking", "toc": [{"level": 2, "slug": "the-protocol", "text": "The protocol"}, {"level": 2, "slug": "why-optimistic-rather-than-locked", "text": "Why optimistic rather than locked"}, {"level": 2, "slug": "failing-loudly-beats-a-lost-update", "text": "Failing loudly beats a lost update"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "player-power": {"backlinks": ["demesne-limit", "faction", "faction-power", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions", "optimistic-locking"], "html": "<p>Every player has a power score. It is the atom that <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> is built from, and the mechanism by which player activity turns into territorial control.</p>\n<h2 id=\"the-dials\">The dials</h2>\n<p>The defaults in <code>config.yml</code> describe the intended rhythm:</p>\n<div class=\"table-scroll\"><table><thead><tr>\n<th>Setting</th>\n<th>Default</th>\n<th>Meaning</th>\n</tr></thead><tbody>\n<tr>\n<td><code>initialPower</code></td>\n<td>5</td>\n<td>Where a new player starts</td>\n</tr>\n<tr>\n<td><code>maxPower</code></td>\n<td>20</td>\n<td>Individual ceiling</td>\n</tr>\n<tr>\n<td><code>minPower</code></td>\n<td>-5</td>\n<td>Individual floor — power can go negative</td>\n</tr>\n<tr>\n<td><code>hoursToReachMaxPower</code></td>\n<td>12</td>\n<td>Time from zero to ceiling</td>\n</tr>\n<tr>\n<td><code>hoursToReachMinPower</code></td>\n<td>72</td>\n<td>Time from zero to floor</td>\n</tr>\n<tr>\n<td><code>powerLostOnDeath</code></td>\n<td>1</td>\n<td>Deducted when you die</td>\n</tr>\n<tr>\n<td><code>powerGainedOnKill</code></td>\n<td>1</td>\n<td>Awarded to the killer</td>\n</tr>\n</tbody></table></div>\n<p>The asymmetry between the two &quot;hours to reach&quot; values is the design statement: climbing takes 12 hours, falling takes 72. Power is easier to build than to lose, which keeps a faction from evaporating over a quiet week.</p>\n<h2 id=\"negative-power\">Negative power</h2>\n<p>The floor is below zero. A player who has died repeatedly does not merely stop contributing to their faction — they subtract from it, dragging the faction below its <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a> and exposing its claims. This is what makes sustained warfare bite: killing the same defender repeatedly is territorially meaningful, not just cosmetic.</p>\n<h2 id=\"power-at-logout\">Power at logout</h2>\n<p>The record stores <code>powerAtLogout</code> separately from <code>power</code>. The two fields let the plugin reconstruct what a player's power should be when they return, rather than requiring a background task that ticks every offline player. It is the same trick as computing <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> on read: store the inputs, derive the value.</p>\n<h2 id=\"related\">Related</h2>\n<p>The player record also carries <code>isBypassEnabled</code> (an operator override for land protection) and the player's <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> chat channel — both incidental to power, but stored on the same row.</p>", "id": "player-power", "links": ["faction-power", "demesne-limit", "faction"], "sourcePath": "notes/concepts/player-power.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/player-power.md", "sources": [{"claim": "A player record stores power and powerAtLogout alongside the player id, name, bypass flag, and chat channel.", "label": "Medieval-Factions/MfPlayer.kt:7-16", "lines": "7-16", "path": "src/main/kotlin/com/dansplugins/factionsystem/player/MfPlayer.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/player/MfPlayer.kt#L7-L16"}, {"claim": "Player power is configured by initialPower 5, maxPower 20, minPower -5, hoursToReachMaxPower 12, hoursToReachMinPower 72, powerLostOnDeath 1, and powerGainedOnKill 1.", "label": "Medieval-Factions/config.yml:8-15", "lines": "8-15", "path": "src/main/resources/config.yml", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/resources/config.yml#L8-L15"}], "summary": "The per-player scalar that accrues with time online and is lost on death, and which sums into a faction's strength.", "tags": ["medieval-factions", "domain-model", "power"], "text": "player power the per-player scalar that accrues with time online and is lost on death, and which sums into a faction's strength. \nevery player has a power score. it is the atom that [[faction-power]] is built\nfrom, and the mechanism by which player activity turns into territorial control.\n\n## the dials\n\nthe defaults in `config.yml` describe the intended rhythm:\n\n| setting | default | meaning |\n|---|---|---|\n| `initialpower` | 5 | where a new player starts |\n| `maxpower` | 20 | individual ceiling |\n| `minpower` | -5 | individual floor — power can go negative |\n| `hourstoreachmaxpower` | 12 | time from zero to ceiling |\n| `hourstoreachminpower` | 72 | time from zero to floor |\n| `powerlostondeath` | 1 | deducted when you die |\n| `powergainedonkill` | 1 | awarded to the killer |\n\nthe asymmetry between the two \"hours to reach\" values is the design statement:\nclimbing takes 12 hours, falling takes 72. power is easier to build than to\nlose, which keeps a faction from evaporating over a quiet week.\n\n## negative power\n\nthe floor is below zero. a player who has died repeatedly does not merely stop\ncontributing to their faction — they subtract from it, dragging the faction\nbelow its [[demesne-limit]] and exposing its claims. this is what makes sustained\nwarfare bite: killing the same defender repeatedly is territorially meaningful,\nnot just cosmetic.\n\n## power at logout\n\nthe record stores `poweratlogout` separately from `power`. the two fields let\nthe plugin reconstruct what a player's power should be when they return, rather\nthan requiring a background task that ticks every offline player. it is the same\ntrick as computing [[faction-power]] on read: store the inputs, derive the value.\n\n## related\n\nthe player record also carries `isbypassenabled` (an operator override for land\nprotection) and the player's [[faction]] chat channel — both incidental to power,\nbut stored on the same row.\n", "title": "Player Power", "toc": [{"level": 2, "slug": "the-dials", "text": "The dials"}, {"level": 2, "slug": "negative-power", "text": "Negative power"}, {"level": 2, "slug": "power-at-logout", "text": "Power at logout"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "ponder": {"backlinks": ["fiefs", "moc-plugin-ecosystem", "release-automation"], "html": "<p>Ponder is the shared library DPC plugins build on. It is small — three modules, each a handful of files — and published as Maven artifacts rather than shaded into each plugin.</p>\n<h2 id=\"the-three-modules\">The three modules</h2>\n<div class=\"table-scroll\"><table><thead><tr>\n<th>Module</th>\n<th>Contents</th>\n</tr></thead><tbody>\n<tr>\n<td><code>ponder-bukkit</code></td>\n<td>Bukkit/Spigot helpers — distance calculations, plugin lookups</td>\n</tr>\n<tr>\n<td><code>ponder-cache</code></td>\n<td>A generic <code>Cache&lt;K, V&gt;</code> interface with a default implementation and a <code>CacheManager</code></td>\n</tr>\n<tr>\n<td><code>ponder-commands</code></td>\n<td>A <code>Command</code> abstraction, a <code>CommandService</code> registry, and typed <code>CommandResult</code> values</td>\n</tr>\n</tbody></table></div>\n<p><code>ponder-commands</code> is the interesting one architecturally. <code>CommandService</code> is a two-method interface — <code>addCommand(name, command)</code> and <code>getCommand(name)</code> — and results are typed values such as <code>IncorrectUsageFailure</code> rather than booleans. That is the same &quot;failures are values&quot; instinct visible in the flagship's <a class=\"wl\" href=\"#/service-layer\" data-id=\"service-layer\">Service Layer</a>.</p>\n<h2 id=\"published-not-vendored\">Published, not vendored</h2>\n<p>Modules are consumed from <code>repo.dansplugins.com</code> (the community's Nexus) and from GitHub Packages, under the <code>com.dansplugins</code> group. Publishing rather than copying means a fix reaches every consumer on the next dependency bump.</p>\n<p>The caveat is version skew across the fleet. <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> still builds against a vendored <code>Ponder-v0.15-alpha-2.jar</code> predating the current module layout, so &quot;which Ponder?&quot; is a real question when reading an older plugin.</p>\n<h2 id=\"related\">Related</h2>\n<p>Ponder lives in the Dans-Plugins organization but is named for <a href=\"https://github.com/Preponderous-Software\" target=\"_blank\" rel=\"noopener\">Preponderous</a>, and its package root is still <code>preponderous.ponder</code> while its Maven group is <code>com.dansplugins</code>. No source in the repository explains the mismatch, so treat it as a naming artefact rather than a boundary that means something.</p>", "id": "ponder", "links": ["service-layer", "fiefs"], "sourcePath": "notes/concepts/ponder.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/ponder.md", "sources": [{"claim": "Ponder is a multi-project Gradle build with three modules, ponder-bukkit, ponder-cache and ponder-commands.", "label": "Ponder/settings.gradle", "lines": "", "path": "settings.gradle", "ref": "ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f", "repo": "Dans-Plugins/Ponder", "shortRef": "ff5276a", "url": "https://github.com/Dans-Plugins/Ponder/blob/ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f/settings.gradle"}, {"claim": "The cache module exposes a generic Cache interface with get, set, containsKey, remove, removeMatching, keys and clear.", "label": "Ponder/Cache.java", "lines": "", "path": "ponder-cache/src/main/java/preponderous/ponder/cache/Cache.java", "ref": "ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f", "repo": "Dans-Plugins/Ponder", "shortRef": "ff5276a", "url": "https://github.com/Dans-Plugins/Ponder/blob/ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f/ponder-cache/src/main/java/preponderous/ponder/cache/Cache.java"}, {"claim": "Ponder modules are published to repo.dansplugins.com under the com.dansplugins group and are also available via GitHub Packages.", "label": "Ponder/README.md", "lines": "", "path": "README.md", "ref": "ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f", "repo": "Dans-Plugins/Ponder", "shortRef": "ff5276a", "url": "https://github.com/Dans-Plugins/Ponder/blob/ff5276ae2fe0e2f5ac5de9c7ba45dd6d0a04d61f/README.md"}], "summary": "The community's shared Java/Kotlin library — a multi-module Gradle build providing command abstraction, caching, and Bukkit helpers.", "tags": ["ponder", "library", "ecosystem"], "text": "ponder the community's shared java/kotlin library — a multi-module gradle build providing command abstraction, caching, and bukkit helpers. \nponder is the shared library dpc plugins build on. it is small — three modules,\neach a handful of files — and published as maven artifacts rather than shaded\ninto each plugin.\n\n## the three modules\n\n| module | contents |\n|---|---|\n| `ponder-bukkit` | bukkit/spigot helpers — distance calculations, plugin lookups |\n| `ponder-cache` | a generic `cache<k, v>` interface with a default implementation and a `cachemanager` |\n| `ponder-commands` | a `command` abstraction, a `commandservice` registry, and typed `commandresult` values |\n\n`ponder-commands` is the interesting one architecturally. `commandservice` is a\ntwo-method interface — `addcommand(name, command)` and `getcommand(name)` — and\nresults are typed values such as `incorrectusagefailure` rather than booleans.\nthat is the same \"failures are values\" instinct visible in the flagship's\n[[service-layer]].\n\n## published, not vendored\n\nmodules are consumed from `repo.dansplugins.com` (the community's nexus) and\nfrom github packages, under the `com.dansplugins` group. publishing rather than\ncopying means a fix reaches every consumer on the next dependency bump.\n\nthe caveat is version skew across the fleet. [[fiefs]] still builds against a\nvendored `ponder-v0.15-alpha-2.jar` predating the current module layout, so\n\"which ponder?\" is a real question when reading an older plugin.\n\n## related\n\nponder lives in the dans-plugins organization but is named for\n[preponderous](https://github.com/preponderous-software), and its package root\nis still `preponderous.ponder` while its maven group is `com.dansplugins`. no\nsource in the repository explains the mismatch, so treat it as a naming artefact\nrather than a boundary that means something.\n", "title": "Ponder", "toc": [{"level": 2, "slug": "the-three-modules", "text": "The three modules"}, {"level": 2, "slug": "published-not-vendored", "text": "Published, not vendored"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "release-automation": {"backlinks": ["dans-plugin-manager", "dpc-conventions", "moc-conventions-and-process", "testing-and-ci"], "html": "<p>Every DPC plugin should build and attach its own jar when a release is created. The convention specifies the workflow file down to the steps.</p>\n<h2 id=\"the-workflow\">The workflow</h2>\n<p><code>.github/workflows/release.yml</code>, triggered <code>on: release: types: [created]</code>, with <code>permissions: contents: write</code>. It checks out, sets up JDK 17 (Temurin), makes <code>gradlew</code> executable, runs <code>./gradlew clean build</code>, and uploads <code>build/libs/*.jar</code> to the release.</p>\n<h2 id=\"why-drafts-matter\">Why drafts matter</h2>\n<p>The trigger fires on release <em>creation</em>, including drafts. That is deliberate: a maintainer can create a draft release, let CI build and attach the jar, and hand that artifact to users as an experimental build before deciding to publish. Testing a release candidate needs no separate pipeline.</p>\n<h2 id=\"why-it-is-a-convention-and-not-a-nicety\">Why it is a convention and not a nicety</h2>\n<p>Manual jar uploads fail in two ways that automation removes. They can be forgotten — leaving a release with notes and no download. And they can be built from a dirty working tree, so the published jar does not correspond to the tag. Building in CI from a clean checkout makes the artifact a function of the commit.</p>\n<p>There is also a consumer that depends on it: <a class=\"wl\" href=\"#/dans-plugin-manager\" data-id=\"dans-plugin-manager\">Dan's Plugin Manager</a> installs plugins by reading GitHub releases. A release without an attached jar is a release DPM cannot install.</p>\n<h2 id=\"the-flagship-deviates-for-a-reason\">The flagship deviates, for a reason</h2>\n<p><a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> follows the template but inserts a step before the build: it clones <a class=\"wl\" href=\"#/ponder\" data-id=\"ponder\">Ponder</a> at tag <code>2.0.0</code> and runs <code>publishToMavenLocal</code>. The library version it needs is not resolvable from a public repository at build time, so CI builds it from source first.</p>\n<p>That is worth knowing before copying the convention's workflow verbatim into a plugin that depends on Ponder — the template alone will not resolve the dependency.</p>\n<h2 id=\"related\">Related</h2>\n<p><a class=\"wl\" href=\"#/testing-and-ci\" data-id=\"testing-and-ci\">Testing and CI</a> covers the build and test side. Both live in <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a>.</p>", "id": "release-automation", "links": ["dans-plugin-manager", "medieval-factions", "ponder", "testing-and-ci", "dpc-conventions"], "sourcePath": "notes/concepts/release-automation.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/release-automation.md", "sources": [{"claim": "The convention is a .github/workflows/release.yml triggered on release creation that checks out, sets up JDK 17, builds with Gradle and uploads the built jar to the release.", "label": "dpc-conventions/RELEASE_AUTOMATION.md", "lines": "", "path": "docs/RELEASE_AUTOMATION.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/docs/RELEASE_AUTOMATION.md"}, {"claim": "The flagship's release workflow follows the convention but adds a step that clones Ponder at tag 2.0.0 and publishes it to the local Maven repository before building.", "label": "Medieval-Factions/release.yml", "lines": "", "path": ".github/workflows/release.yml", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/.github/workflows/release.yml"}], "summary": "Creating a GitHub Release triggers a workflow that builds the plugin and attaches the jar, so every release has a reproducible artifact.", "tags": ["dpc", "conventions", "ci"], "text": "release automation creating a github release triggers a workflow that builds the plugin and attaches the jar, so every release has a reproducible artifact. \nevery dpc plugin should build and attach its own jar when a release is created.\nthe convention specifies the workflow file down to the steps.\n\n## the workflow\n\n`.github/workflows/release.yml`, triggered `on: release: types: [created]`, with\n`permissions: contents: write`. it checks out, sets up jdk 17 (temurin), makes\n`gradlew` executable, runs `./gradlew clean build`, and uploads `build/libs/*.jar`\nto the release.\n\n## why drafts matter\n\nthe trigger fires on release *creation*, including drafts. that is deliberate: a\nmaintainer can create a draft release, let ci build and attach the jar, and hand\nthat artifact to users as an experimental build before deciding to publish.\ntesting a release candidate needs no separate pipeline.\n\n## why it is a convention and not a nicety\n\nmanual jar uploads fail in two ways that automation removes. they can be\nforgotten — leaving a release with notes and no download. and they can be built\nfrom a dirty working tree, so the published jar does not correspond to the tag.\nbuilding in ci from a clean checkout makes the artifact a function of the commit.\n\nthere is also a consumer that depends on it: [[dans-plugin-manager]] installs\nplugins by reading github releases. a release without an attached jar is a\nrelease dpm cannot install.\n\n## the flagship deviates, for a reason\n\n[[medieval-factions]] follows the template but inserts a step before the build:\nit clones [[ponder]] at tag `2.0.0` and runs `publishtomavenlocal`. the library\nversion it needs is not resolvable from a public repository at build time, so ci\nbuilds it from source first.\n\nthat is worth knowing before copying the convention's workflow verbatim into a\nplugin that depends on ponder — the template alone will not resolve the\ndependency.\n\n## related\n\n[[testing-and-ci]] covers the build and test side. both live in\n[[dpc-conventions]].\n", "title": "Release Automation", "toc": [{"level": 2, "slug": "the-workflow", "text": "The workflow"}, {"level": 2, "slug": "why-drafts-matter", "text": "Why drafts matter"}, {"level": 2, "slug": "why-it-is-a-convention-and-not-a-nicety", "text": "Why it is a convention and not a nicety"}, {"level": 2, "slug": "the-flagship-deviates-for-a-reason", "text": "The flagship deviates, for a reason"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "repository-pattern": {"backlinks": ["faction", "jooq-persistence", "moc-dans-plugins-community", "moc-medieval-factions", "moc-plugin-architecture", "service-layer", "testing-and-ci", "value-class-identifier"], "html": "<p>Every persisted record type in <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> has two files: an interface named <code>Mf&lt;Thing&gt;Repository</code> and an implementation named <code>JooqMf&lt;Thing&gt;Repository</code>. The naming convention is the whole convention — the technology appears in the implementation's name and nowhere else.</p>\n<h2 id=\"what-the-interface-says\">What the interface says</h2>\n<p><code>MfFactionRepository</code> declares six methods: three overloads of <code>getFaction</code>, a <code>getFactions</code>, an <code>upsert</code>, and a <code>delete</code>. There is no <code>save</code>/<code>update</code> split, no query language, no transaction handle, and no <code>Connection</code>. A caller cannot tell from the interface whether the data lives in a database, a flat file, or memory.</p>\n<p>Note <code>upsert</code> rather than separate insert and update. Because domain records are immutable data classes carrying their own <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a>, the caller always has a complete record in hand and never needs to express &quot;change these three columns&quot;.</p>\n<h2 id=\"why-bother\">Why bother</h2>\n<p>Three payoffs, in descending order of how much they actually matter here:</p>\n<ol>\n<li><strong>Testability.</strong> A fake repository is a <code>MutableMap</code> and twenty lines.\n</li>\n<li><strong>Dialect independence.</strong> The interface is what lets H2, MySQL, and PostgreSQL all work — see <a class=\"wl\" href=\"#/jooq-persistence\" data-id=\"jooq-persistence\">jOOQ Persistence</a>.\n</li>\n<li><strong>Replaceability.</strong> In principle the storage could be swapped. In practice nobody has, and this is the weakest of the three arguments.\n</li>\n</ol>\n<h2 id=\"the-mapping-happens-in-the-implementation\">The mapping happens in the implementation</h2>\n<p>The jOOQ classes are where domain records meet columns, including the awkward parts: <a class=\"wl\" href=\"#/faction-role\" data-id=\"faction-role\">Faction Role</a> lists are serialized to a JSON column with Gson, and <a class=\"wl\" href=\"#/value-class-identifier\" data-id=\"value-class-identifier\">Value Class Identifier</a> values are unwrapped to strings. Keeping that in the implementation is what allows the domain model to be shaped for the simulation rather than for the schema.</p>\n<h2 id=\"related\">Related</h2>\n<p>The repository is also where <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> lives, because the version check has to be part of the same statement as the write.</p>", "id": "repository-pattern", "links": ["medieval-factions", "value-class-identifier", "jooq-persistence", "faction-role", "optimistic-locking"], "sourcePath": "notes/concepts/repository-pattern.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/repository-pattern.md", "sources": [{"claim": "The faction repository interface declares only getFaction by id, name and player id, getFactions, upsert and delete, with no SQL or storage concepts.", "label": "Medieval-Factions/MfFactionRepository.kt:5-13", "lines": "5-13", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionRepository.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionRepository.kt#L5-L13"}, {"claim": "The jOOQ implementation of the faction repository is a separate class named after its technology.", "label": "Medieval-Factions/JooqMfFactionRepository.kt:27", "lines": "27", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/JooqMfFactionRepository.kt#L27"}], "summary": "Each domain record gets a storage-agnostic interface plus a jOOQ implementation, so services never name a database.", "tags": ["medieval-factions", "architecture", "persistence"], "text": "repository pattern each domain record gets a storage-agnostic interface plus a jooq implementation, so services never name a database. \nevery persisted record type in [[medieval-factions]] has two files: an interface\nnamed `mf<thing>repository` and an implementation named `jooqmf<thing>repository`.\nthe naming convention is the whole convention — the technology appears in the\nimplementation's name and nowhere else.\n\n## what the interface says\n\n`mffactionrepository` declares six methods: three overloads of `getfaction`, a\n`getfactions`, an `upsert`, and a `delete`. there is no `save`/`update` split,\nno query language, no transaction handle, and no `connection`. a caller cannot\ntell from the interface whether the data lives in a database, a flat file, or\nmemory.\n\nnote `upsert` rather than separate insert and update. because domain records are\nimmutable data classes carrying their own [[value-class-identifier]], the caller\nalways has a complete record in hand and never needs to express \"change these\nthree columns\".\n\n## why bother\n\nthree payoffs, in descending order of how much they actually matter here:\n\n1. **testability.** a fake repository is a `mutablemap` and twenty lines.\n2. **dialect independence.** the interface is what lets h2, mysql, and\n   postgresql all work — see [[jooq-persistence]].\n3. **replaceability.** in principle the storage could be swapped. in practice\n   nobody has, and this is the weakest of the three arguments.\n\n## the mapping happens in the implementation\n\nthe jooq classes are where domain records meet columns, including the awkward\nparts: [[faction-role]] lists are serialized to a json column with gson, and\n[[value-class-identifier]] values are unwrapped to strings. keeping that in the\nimplementation is what allows the domain model to be shaped for the simulation\nrather than for the schema.\n\n## related\n\nthe repository is also where [[optimistic-locking]] lives, because the version\ncheck has to be part of the same statement as the write.\n", "title": "Repository Pattern", "toc": [{"level": 2, "slug": "what-the-interface-says", "text": "What the interface says"}, {"level": 2, "slug": "why-bother", "text": "Why bother"}, {"level": 2, "slug": "the-mapping-happens-in-the-implementation", "text": "The mapping happens in the implementation"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "service-layer": {"backlinks": ["faction", "faction-events", "law", "locked-block", "main-thread-safety", "map-integration", "medieval-factions", "moc-dans-plugins-community", "moc-faction-domain-model", "moc-medieval-factions", "moc-plugin-architecture", "optimistic-locking", "ponder"], "html": "<p>Every domain area in <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> gets a service. The service owns the in-memory copy of that area's data, applies the rules, fires <a class=\"wl\" href=\"#/faction-events\" data-id=\"faction-events\">Faction Events</a>, and delegates persistence to a repository. Nothing else in the plugin should touch a repository directly.</p>\n<h2 id=\"one-registry\">One registry</h2>\n<p><code>Services</code> is a plain class with fifteen constructor properties — player, faction, law, relationship, claim, lock, interaction, notification, gate, chat, duel, potion, teleport, map, and approval request. It is constructed once during <code>onEnable</code> and hung off the plugin instance as <code>plugin.services</code>.</p>\n<p>There is no dependency-injection framework. Wiring is a hundred lines of <code>onEnable</code> constructing repositories and passing them into services, which for a plugin of this size is easier to follow than a container would be.</p>\n<p><code>mapService</code> is the only nullable entry: it exists only when an optional <a class=\"wl\" href=\"#/map-integration\" data-id=\"map-integration\">Map Integration</a> plugin is installed. Its type carries that fact, so callers must handle absence rather than discovering it at runtime.</p>\n<h2 id=\"failures-are-values\">Failures are values</h2>\n<p>Mutating methods return <code>Result4k&lt;T, ServiceFailure&gt;</code> rather than throwing. <code>ServiceFailure</code> carries a <code>type</code>, a <code>message</code>, and the underlying <code>cause</code>, and <code>ServiceFailureType</code> distinguishes nine cases — <code>NOT_FOUND</code>, <code>BAD_REQUEST</code>, <code>BAD_RESPONSE</code>, <code>AUTHENTICATION_REQUIRED</code>, <code>AUTHORIZATION</code>, <code>RULES_VIOLATION</code>, <code>DUPLICATE</code>, <code>CONFLICT</code>, and <code>GENERAL</code>.</p>\n<p>Each service maps exceptions to types in a small private helper — an <a class=\"wl\" href=\"#/optimistic-locking\" data-id=\"optimistic-locking\">Optimistic Locking</a> failure becomes <code>CONFLICT</code>, everything else becomes <code>GENERAL</code>. A command can then branch on <code>CONFLICT</code> and tell the player to try again, which is a very different message from an internal error.</p>\n<h2 id=\"read-from-memory-write-through\">Read from memory, write through</h2>\n<p><code>MfFactionService</code> is the fullest example: it loads every <a class=\"wl\" href=\"#/faction\" data-id=\"faction\">Faction</a> into a <code>ConcurrentHashMap</code> at startup, serves reads from that map, and on write both persists through the <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> and updates the cache. After that one bulk load, ordinary reads never reach the database — only writes do.</p>\n<h2 id=\"related\">Related</h2>\n<p>The variation between services is mostly how much caching they do. <code>MfLawService</code> caches nothing and takes only a repository — the minimum a service can be while still owning the failure mapping.</p>", "id": "service-layer", "links": ["medieval-factions", "faction-events", "map-integration", "optimistic-locking", "faction", "repository-pattern"], "sourcePath": "notes/concepts/service-layer.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/service-layer.md", "sources": [{"claim": "A single Services class holds fifteen services, one per domain area, and the map service is nullable because it depends on an optional plugin.", "label": "Medieval-Factions/Services.kt:19-35", "lines": "19-35", "path": "src/main/kotlin/com/dansplugins/factionsystem/service/Services.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/service/Services.kt#L19-L35"}, {"claim": "A service failure carries a type, message and cause, and the failure type enum has nine values including NOT_FOUND, CONFLICT, RULES_VIOLATION and GENERAL.", "label": "Medieval-Factions/ServiceFailure.kt:3-19", "lines": "3-19", "path": "src/main/kotlin/com/dansplugins/factionsystem/failure/ServiceFailure.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/failure/ServiceFailure.kt#L3-L19"}], "summary": "Services own in-memory state, enforce the rules, fire events, and return typed failures — commands and listeners talk only to them.", "tags": ["medieval-factions", "architecture"], "text": "service layer services own in-memory state, enforce the rules, fire events, and return typed failures — commands and listeners talk only to them. \nevery domain area in [[medieval-factions]] gets a service. the service owns the\nin-memory copy of that area's data, applies the rules, fires [[faction-events]],\nand delegates persistence to a repository. nothing else in the plugin should\ntouch a repository directly.\n\n## one registry\n\n`services` is a plain class with fifteen constructor properties — player,\nfaction, law, relationship, claim, lock, interaction, notification, gate, chat,\nduel, potion, teleport, map, and approval request. it is constructed once during\n`onenable` and hung off the plugin instance as `plugin.services`.\n\nthere is no dependency-injection framework. wiring is a hundred lines of\n`onenable` constructing repositories and passing them into services, which for a\nplugin of this size is easier to follow than a container would be.\n\n`mapservice` is the only nullable entry: it exists only when an optional\n[[map-integration]] plugin is installed. its type carries that fact, so callers\nmust handle absence rather than discovering it at runtime.\n\n## failures are values\n\nmutating methods return `result4k<t, servicefailure>` rather than throwing.\n`servicefailure` carries a `type`, a `message`, and the underlying `cause`, and\n`servicefailuretype` distinguishes nine cases — `not_found`, `bad_request`,\n`bad_response`, `authentication_required`, `authorization`, `rules_violation`,\n`duplicate`, `conflict`, and `general`.\n\neach service maps exceptions to types in a small private helper — an\n[[optimistic-locking]] failure becomes `conflict`, everything else becomes\n`general`. a command can then branch on `conflict` and tell the player to try\nagain, which is a very different message from an internal error.\n\n## read from memory, write through\n\n`mffactionservice` is the fullest example: it loads every [[faction]] into a\n`concurrenthashmap` at startup, serves reads from that map, and on write both\npersists through the [[repository-pattern]] and updates the cache. after that\none bulk load, ordinary reads never reach the database — only writes do.\n\n## related\n\nthe variation between services is mostly how much caching they do.\n`mflawservice` caches nothing and takes only a repository — the minimum a\nservice can be while still owning the failure mapping.\n", "title": "Service Layer", "toc": [{"level": 2, "slug": "one-registry", "text": "One registry"}, {"level": 2, "slug": "failures-are-values", "text": "Failures are values"}, {"level": 2, "slug": "read-from-memory-write-through", "text": "Read from memory, write through"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "testing-and-ci": {"backlinks": ["dpc-conventions", "dpc-mc-server", "moc-conventions-and-process", "release-automation"], "html": "<p>Testing a Bukkit plugin is awkward: the server API is not available outside a running server, and most interesting behaviour involves it. DPC's answer is two tiers.</p>\n<h2 id=\"unit-tests-with-bukkit-mocked\">Unit tests, with Bukkit mocked</h2>\n<p>Gradle is the build tool and the test runner. <code>./gradlew clean test</code> is the command in every repository, and tests live in <code>src/test/</code> mirroring the main source tree. <code>Player</code>, <code>World</code>, and <code>Server</code> are stubbed with a mocking library.</p>\n<p>The architectural payoff of <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> shows up here: a service can be tested against a fake repository with no database and no server, which is why that indirection earns its keep even though the storage has never actually been swapped.</p>\n<h2 id=\"integration-tests-with-a-real-server\">Integration tests, with a real server</h2>\n<p>Anything that cannot be isolated gets a real Spigot server in Docker. Each repository ships a <code>compose.yml</code>, a <code>sample.env</code> to copy to <code>.env</code>, and <code>up.sh</code> and <code>down.sh</code> scripts. The flow is: build the jar with Gradle, bring the container up, and the plugin is loaded into a real server.</p>\n<p>The honest reading of the convention is that the mocking tier has limits, and rather than pretending otherwise it names the fallback: &quot;when behaviour cannot be unit-tested in isolation, cover it with integration tests in the Docker-based test server instead.&quot;</p>\n<h2 id=\"the-whole-ecosystem-tier\">The whole-ecosystem tier</h2>\n<p><a class=\"wl\" href=\"#/dpc-mc-server\" data-id=\"dpc-mc-server\">DPC Minecraft Server</a> extends the same idea across plugins — a container running the curated set together, which is where interactions between <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">expansions</a> and the flagship actually get exercised.</p>\n<h2 id=\"related\">Related</h2>\n<p><a class=\"wl\" href=\"#/release-automation\" data-id=\"release-automation\">Release Automation</a> is the other half of the CI story.</p>", "id": "testing-and-ci", "links": ["repository-pattern", "dpc-mc-server", "expansion-plugin", "release-automation"], "sourcePath": "notes/concepts/testing-and-ci.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/testing-and-ci.md", "sources": [{"claim": "DPC plugins use Gradle as build tool and test runner, run tests with ./gradlew clean test, mock Bukkit types with a library such as Mockito, and provide a Docker Compose Spigot server for integration testing.", "label": "dpc-conventions/TESTING_AND_CI.md", "lines": "", "path": "docs/TESTING_AND_CI.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/docs/TESTING_AND_CI.md"}, {"claim": "The flagship ships the Docker Compose test server the convention describes, alongside up.sh and down.sh helper scripts.", "label": "Medieval-Factions/compose.yml", "lines": "", "path": "compose.yml", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/compose.yml"}], "summary": "Gradle for unit tests with Bukkit mocked out, plus a Docker Compose Spigot server for anything that cannot be isolated.", "tags": ["dpc", "conventions", "ci", "testing"], "text": "testing and ci gradle for unit tests with bukkit mocked out, plus a docker compose spigot server for anything that cannot be isolated. \ntesting a bukkit plugin is awkward: the server api is not available outside a\nrunning server, and most interesting behaviour involves it. dpc's answer is two\ntiers.\n\n## unit tests, with bukkit mocked\n\ngradle is the build tool and the test runner. `./gradlew clean test` is the\ncommand in every repository, and tests live in `src/test/` mirroring the main\nsource tree. `player`, `world`, and `server` are stubbed with a mocking library.\n\nthe architectural payoff of [[repository-pattern]] shows up here: a service can\nbe tested against a fake repository with no database and no server, which is why\nthat indirection earns its keep even though the storage has never actually been\nswapped.\n\n## integration tests, with a real server\n\nanything that cannot be isolated gets a real spigot server in docker. each\nrepository ships a `compose.yml`, a `sample.env` to copy to `.env`, and `up.sh`\nand `down.sh` scripts. the flow is: build the jar with gradle, bring the\ncontainer up, and the plugin is loaded into a real server.\n\nthe honest reading of the convention is that the mocking tier has limits, and\nrather than pretending otherwise it names the fallback: \"when behaviour cannot\nbe unit-tested in isolation, cover it with integration tests in the docker-based\ntest server instead.\"\n\n## the whole-ecosystem tier\n\n[[dpc-mc-server]] extends the same idea across plugins — a container running the\ncurated set together, which is where interactions between\n[[expansion-plugin|expansions]] and the flagship actually get exercised.\n\n## related\n\n[[release-automation]] is the other half of the ci story.\n", "title": "Testing and CI", "toc": [{"level": 2, "slug": "unit-tests-with-bukkit-mocked", "text": "Unit tests, with Bukkit mocked"}, {"level": 2, "slug": "integration-tests-with-a-real-server", "text": "Integration tests, with a real server"}, {"level": 2, "slug": "the-whole-ecosystem-tier", "text": "The whole-ecosystem tier"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "two-tier-documentation": {"backlinks": ["dpc-conventions", "medieval-factions", "moc-conventions-and-process", "moc-medieval-factions"], "html": "<p>DPC splits documentation by <em>volatility</em>, not by audience. Anything that must match the code exactly lives in the repository; anything that changes on its own schedule lives in the wiki.</p>\n<h2 id=\"what-goes-where\">What goes where</h2>\n<p><strong>In the repository</strong> (required): <code>README.md</code>, <code>CONTRIBUTING.md</code>, <code>USER_GUIDE.md</code>, <code>COMMANDS.md</code>, <code>CONFIG.md</code>. Recommended: <code>CHANGELOG.md</code>. When applicable: a flags reference such as <code>FACTION_FLAGS.md</code>, and <code>DATABASE_QUERYING.md</code>.</p>\n<p><strong>In the wiki</strong>: Guide, FAQ, Placeholders, Developer Notes, External API documentation.</p>\n<h2 id=\"the-reason-for-the-line\">The reason for the line</h2>\n<p><code>COMMANDS.md</code> and <code>CONFIG.md</code> are the test case. A command's syntax and a config key's default are facts about a specific version of the code. Put them in a wiki and they describe whatever the latest release happens to be — which is wrong for everyone running anything else, and impossible to fix in a pull request.</p>\n<p>In the repository, they are versioned: they change in the same commit as the code, review together, and a user reading the docs for the tag they installed gets the truth.</p>\n<p>The wiki gets what benefits from <em>not</em> being versioned — a narrative guide, an FAQ that grows as questions arrive, community-maintained pages that would otherwise need a maintainer's review for a typo.</p>\n<h2 id=\"the-line-is-not-perfectly-held\">The line is not perfectly held</h2>\n<p>The convention places FAQ in the wiki, but <a class=\"wl\" href=\"#/medieval-factions\" data-id=\"medieval-factions\">Medieval Factions</a> now also carries an in-repo <code>FAQ.md</code> linked from its README. Whether that is the convention drifting or the flagship leading it is not recorded anywhere; note only that the two currently disagree.</p>\n<h2 id=\"applied-here\">Applied here</h2>\n<p>This zettelkasten sits on the same side of the line as <code>COMMANDS.md</code>: its claims are about specific commits, so they are pinned to SHAs rather than left to track <code>main</code>. See the <a href=\"../../docs/NOTE_FORMAT.md\">note format</a>.</p>\n<h2 id=\"related\">Related</h2>\n<p>The rule is enforced by review rather than tooling — <a class=\"wl\" href=\"#/dpc-conventions\" data-id=\"dpc-conventions\">DPC Conventions</a> describes the shape, and an audit is a matter of checking which files exist.</p>", "id": "two-tier-documentation", "links": ["medieval-factions", "dpc-conventions"], "sourcePath": "notes/concepts/two-tier-documentation.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/two-tier-documentation.md", "sources": [{"claim": "DPC plugins use a two-tier model in which README, CONTRIBUTING, USER_GUIDE, COMMANDS and CONFIG are required in the repository root while Guide, FAQ, Placeholders and Developer Notes pages live in the wiki.", "label": "dpc-conventions/DOCUMENTATION_PRACTICES.md", "lines": "", "path": "docs/DOCUMENTATION_PRACTICES.md", "ref": "9dc9aa37e9ed58722d86a914c563b5ceeaa07bec", "repo": "Dans-Plugins/dpc-conventions", "shortRef": "9dc9aa3", "url": "https://github.com/Dans-Plugins/dpc-conventions/blob/9dc9aa37e9ed58722d86a914c563b5ceeaa07bec/docs/DOCUMENTATION_PRACTICES.md"}, {"claim": "The flagship README links to in-repo USER_GUIDE, COMMANDS, CONFIG, FACTION_FLAGS and DATABASE_QUERYING documents alongside external wiki pages.", "label": "Medieval-Factions/README.md", "lines": "", "path": "README.md", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/README.md"}], "summary": "Reference documents live in the repository and are versioned with the code; narrative and community content lives in the GitHub wiki.", "tags": ["dpc", "conventions", "documentation"], "text": "two-tier documentation reference documents live in the repository and are versioned with the code; narrative and community content lives in the github wiki. \ndpc splits documentation by *volatility*, not by audience. anything that must\nmatch the code exactly lives in the repository; anything that changes on its own\nschedule lives in the wiki.\n\n## what goes where\n\n**in the repository** (required): `readme.md`, `contributing.md`,\n`user_guide.md`, `commands.md`, `config.md`. recommended: `changelog.md`. when\napplicable: a flags reference such as `faction_flags.md`, and\n`database_querying.md`.\n\n**in the wiki**: guide, faq, placeholders, developer notes, external api\ndocumentation.\n\n## the reason for the line\n\n`commands.md` and `config.md` are the test case. a command's syntax and a\nconfig key's default are facts about a specific version of the code. put them in\na wiki and they describe whatever the latest release happens to be — which is\nwrong for everyone running anything else, and impossible to fix in a pull\nrequest.\n\nin the repository, they are versioned: they change in the same commit as the\ncode, review together, and a user reading the docs for the tag they installed\ngets the truth.\n\nthe wiki gets what benefits from *not* being versioned — a narrative guide, an\nfaq that grows as questions arrive, community-maintained pages that would\notherwise need a maintainer's review for a typo.\n\n## the line is not perfectly held\n\nthe convention places faq in the wiki, but [[medieval-factions]] now also carries\nan in-repo `faq.md` linked from its readme. whether that is the convention\ndrifting or the flagship leading it is not recorded anywhere; note only that the\ntwo currently disagree.\n\n## applied here\n\nthis zettelkasten sits on the same side of the line as `commands.md`: its claims\nare about specific commits, so they are pinned to shas rather than left to track\n`main`. see the [note format](../../docs/note_format.md).\n\n## related\n\nthe rule is enforced by review rather than tooling — [[dpc-conventions]]\ndescribes the shape, and an audit is a matter of checking which files exist.\n", "title": "Two-Tier Documentation", "toc": [{"level": 2, "slug": "what-goes-where", "text": "What goes where"}, {"level": 2, "slug": "the-reason-for-the-line", "text": "The reason for the line"}, {"level": 2, "slug": "the-line-is-not-perfectly-held", "text": "The line is not perfectly held"}, {"level": 2, "slug": "applied-here", "text": "Applied here"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "value-class-identifier": {"backlinks": ["approval-request", "currencies", "expansion-plugin", "faction", "moc-medieval-factions", "moc-plugin-architecture", "repository-pattern"], "html": "<p><code>MfFactionId</code>, <code>MfPlayerId</code>, <code>MfLawId</code>, <code>MfGateId</code>, <code>MfLockedBlockId</code>, <code>MfDuelId</code>, <code>MfFactionRoleId</code>, <code>MfApprovalRequestId</code>, <code>MfFactionRelationshipId</code> — all nine identifiers in the plugin are <code>@JvmInline value class</code> wrappers around a <code>String</code>, with no exceptions.</p>\n<h2 id=\"what-it-buys\">What it buys</h2>\n<p>At compile time these are distinct types: a function taking an <code>MfFactionId</code> cannot be handed an <code>MfPlayerId</code>, even though both are strings underneath. In a codebase where nearly every method signature takes at least one identifier, that is the difference between a compiler error and a bug that only appears when two UUIDs get swapped.</p>\n<p>At runtime, Kotlin erases the wrapper. An <code>MfFactionId</code> in a local variable <em>is</em> a <code>String</code> — no allocation, no indirection. The safety is free.</p>\n<h2 id=\"where-the-boundary-lives\">Where the boundary lives</h2>\n<p>Each id class owns its own conversions, which keeps the awkward casts in one place:</p>\n<ul>\n<li><code>MfFactionId.generate()</code> produces a fresh random UUID string.\n</li>\n<li><code>MfPlayerId.fromBukkitPlayer()</code> and <code>.toBukkitPlayer()</code> bridge to Bukkit's <code>OfflinePlayer</code>, so the rest of the plugin can pass a player identity around without depending on the Bukkit API.\n</li>\n</ul>\n<p>That second pair is the more interesting one: it means the domain model refers to players by a value it owns, not by a Bukkit object whose lifecycle the server controls.</p>\n<h2 id=\"the-catch\">The catch</h2>\n<p>Value classes and Java interoperation do not always agree, which is why domain classes are peppered with <code>@get:JvmName(&quot;getId&quot;)</code>. Without it, Kotlin mangles the getter name for a value-class-typed property, and Java callers — including <a class=\"wl\" href=\"#/expansion-plugin\" data-id=\"expansion-plugin\">expansions</a> written in Java such as <a class=\"wl\" href=\"#/fiefs\" data-id=\"fiefs\">Fiefs</a> — cannot see it. The annotation is the tax for keeping the public API usable from Java.</p>\n<h2 id=\"related\">Related</h2>\n<p>The unwrapping to a plain column value happens in the <a class=\"wl\" href=\"#/repository-pattern\" data-id=\"repository-pattern\">Repository Pattern</a> implementations, so the database sees only strings.</p>", "id": "value-class-identifier", "links": ["expansion-plugin", "fiefs", "repository-pattern"], "sourcePath": "notes/concepts/value-class-identifier.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/value-class-identifier.md", "sources": [{"claim": "A faction id is a JvmInline value class wrapping a String, with a generate function producing a random UUID string.", "label": "Medieval-Factions/MfFactionId.kt:5-10", "lines": "5-10", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionId.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFactionId.kt#L5-L10"}, {"claim": "A player id is a value class over a String that converts to and from a Bukkit OfflinePlayer, using the player's unique id as its value.", "label": "Medieval-Factions/MfPlayerId.kt:7-14", "lines": "7-14", "path": "src/main/kotlin/com/dansplugins/factionsystem/player/MfPlayerId.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/player/MfPlayerId.kt#L7-L14"}], "summary": "Every record's id is a Kotlin inline value class wrapping a UUID string, making identifiers type-safe at compile time and free at runtime.", "tags": ["medieval-factions", "architecture", "kotlin"], "text": "value class identifier every record's id is a kotlin inline value class wrapping a uuid string, making identifiers type-safe at compile time and free at runtime. \n`mffactionid`, `mfplayerid`, `mflawid`, `mfgateid`, `mflockedblockid`,\n`mfduelid`, `mffactionroleid`, `mfapprovalrequestid`,\n`mffactionrelationshipid` — all nine identifiers in the plugin are\n`@jvminline value class` wrappers around a `string`, with no exceptions.\n\n## what it buys\n\nat compile time these are distinct types: a function taking an `mffactionid`\ncannot be handed an `mfplayerid`, even though both are strings underneath. in a\ncodebase where nearly every method signature takes at least one identifier, that\nis the difference between a compiler error and a bug that only appears when two\nuuids get swapped.\n\nat runtime, kotlin erases the wrapper. an `mffactionid` in a local variable *is*\na `string` — no allocation, no indirection. the safety is free.\n\n## where the boundary lives\n\neach id class owns its own conversions, which keeps the awkward casts in one\nplace:\n\n- `mffactionid.generate()` produces a fresh random uuid string.\n- `mfplayerid.frombukkitplayer()` and `.tobukkitplayer()` bridge to bukkit's\n  `offlineplayer`, so the rest of the plugin can pass a player identity around\n  without depending on the bukkit api.\n\nthat second pair is the more interesting one: it means the domain model refers\nto players by a value it owns, not by a bukkit object whose lifecycle the server\ncontrols.\n\n## the catch\n\nvalue classes and java interoperation do not always agree, which is why domain\nclasses are peppered with `@get:jvmname(\"getid\")`. without it, kotlin mangles\nthe getter name for a value-class-typed property, and java callers — including\n[[expansion-plugin|expansions]] written in java such as [[fiefs]] — cannot see\nit. the annotation is the tax for keeping the public api usable from java.\n\n## related\n\nthe unwrapping to a plain column value happens in the [[repository-pattern]]\nimplementations, so the database sees only strings.\n", "title": "Value Class Identifier", "toc": [{"level": 2, "slug": "what-it-buys", "text": "What it buys"}, {"level": 2, "slug": "where-the-boundary-lives", "text": "Where the boundary lives"}, {"level": 2, "slug": "the-catch", "text": "The catch"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}, "vassalage": {"backlinks": ["claimed-chunk", "demesne-limit", "faction-flag", "faction-power", "faction-relationship", "medieval-factions", "moc-faction-domain-model", "moc-medieval-factions"], "html": "<p>Vassalage is the liege/vassal half of <a class=\"wl\" href=\"#/faction-relationship\" data-id=\"faction-relationship\">Faction Relationship</a>, and the only diplomatic state that changes a faction's numbers. It is what makes the game medieval rather than merely territorial.</p>\n<h2 id=\"the-bargain\">The bargain</h2>\n<p>A liege adds a share of each vassal's <a class=\"wl\" href=\"#/faction-power\" data-id=\"faction-power\">Faction Power</a> to its own, scaled by <code>factions.vassalPowerContributionMultiplier</code>. That contribution lifts the liege's <a class=\"wl\" href=\"#/demesne-limit\" data-id=\"demesne-limit\">Demesne Limit</a>, letting it hold land its own membership could not support.</p>\n<p>The vassal, in exchange, keeps its own identity, its own land, and its own roster — and typically gains the protection of the <code>vassalageTreeCanInteractWithLand</code> and <code>liegeChainCanInteractWithLand</code> <a class=\"wl\" href=\"#/faction-flag\" data-id=\"faction-flag\">Faction Flag</a> settings, which let the hierarchy build inside each other's claims.</p>\n<h2 id=\"the-condition-that-keeps-it-honest\">The condition that keeps it honest</h2>\n<p>Vassal power is added <em>only</em> when the liege's own member power is at least half of its maximum. Below that threshold the contribution is not reduced — it is removed entirely.</p>\n<p>This single clause is what prevents the obvious exploit. Without it, a one-player faction could accumulate vassals and hold an enormous demesne on borrowed strength. With it, an empire is capped by the activity of its own core: let the capital go quiet and the whole structure snaps back to what its own members can carry.</p>\n<h2 id=\"a-tree-not-a-list\">A tree, not a list</h2>\n<p><code>MfVassalNode</code> is recursive — a faction id plus a list of child nodes — so a faction can have vassals which themselves have vassals, and the whole subtree can be searched or flattened with <code>contains</code>, <code>map</code> and <code>flatMap</code>. Its counterpart <code>MfLiegeNode</code> points the other way, holding a single optional liege, because looking <em>up</em> the hierarchy is a chain rather than a tree.</p>\n<p>Power contribution is computed from the direct vassals of a faction, and each of those factions has already folded in its own vassals' contribution — subject, at each level, to that level's own half-strength test.</p>\n<h2 id=\"related\">Related</h2>\n<p>Becoming someone's vassal is a consequential, mutual act, which is why it is one of the three <a class=\"wl\" href=\"#/approval-request\" data-id=\"approval-request\">Approval Request</a> types.</p>", "id": "vassalage", "links": ["faction-relationship", "faction-power", "demesne-limit", "faction-flag", "approval-request"], "sourcePath": "notes/concepts/vassalage.md", "sourceUrl": "https://github.com/Dans-Plugins/dpc-zettelkasten/blob/main/notes/concepts/vassalage.md", "sources": [{"claim": "A faction's vassal power sums each vassal's power scaled by a configured multiplier, and is only added to the faction's power when member power is at least half of max member power.", "label": "Medieval-Factions/MfFaction.kt:37-47", "lines": "37-47", "path": "src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/faction/MfFaction.kt#L37-L47"}, {"claim": "Vassal relationships are modelled as a recursive tree node holding a faction id and a list of child nodes, with recursive contains, map and flatMap helpers.", "label": "Medieval-Factions/MfVassalNode.kt", "lines": "", "path": "src/main/kotlin/com/dansplugins/factionsystem/relationship/MfVassalNode.kt", "ref": "3a51c55366b544d31429fae8bcb64efaf1878e15", "repo": "Dans-Plugins/Medieval-Factions", "shortRef": "3a51c55", "url": "https://github.com/Dans-Plugins/Medieval-Factions/blob/3a51c55366b544d31429fae8bcb64efaf1878e15/src/main/kotlin/com/dansplugins/factionsystem/relationship/MfVassalNode.kt"}], "summary": "The feudal hierarchy — a liege draws power from its vassals, but only while its own members remain strong.", "tags": ["medieval-factions", "domain-model", "diplomacy"], "text": "vassalage the feudal hierarchy — a liege draws power from its vassals, but only while its own members remain strong. \nvassalage is the liege/vassal half of [[faction-relationship]], and the only\ndiplomatic state that changes a faction's numbers. it is what makes the game\nmedieval rather than merely territorial.\n\n## the bargain\n\na liege adds a share of each vassal's [[faction-power]] to its own, scaled by\n`factions.vassalpowercontributionmultiplier`. that contribution lifts the\nliege's [[demesne-limit]], letting it hold land its own membership could not\nsupport.\n\nthe vassal, in exchange, keeps its own identity, its own land, and its own\nroster — and typically gains the protection of the\n`vassalagetreecaninteractwithland` and `liegechaincaninteractwithland`\n[[faction-flag]] settings, which let the hierarchy build inside each other's\nclaims.\n\n## the condition that keeps it honest\n\nvassal power is added *only* when the liege's own member power is at least half\nof its maximum. below that threshold the contribution is not reduced — it is\nremoved entirely.\n\nthis single clause is what prevents the obvious exploit. without it, a\none-player faction could accumulate vassals and hold an enormous demesne on\nborrowed strength. with it, an empire is capped by the activity of its own core:\nlet the capital go quiet and the whole structure snaps back to what its own\nmembers can carry.\n\n## a tree, not a list\n\n`mfvassalnode` is recursive — a faction id plus a list of child nodes — so a\nfaction can have vassals which themselves have vassals, and the whole subtree can\nbe searched or flattened with `contains`, `map` and `flatmap`. its counterpart\n`mfliegenode` points the other way, holding a single optional liege, because\nlooking *up* the hierarchy is a chain rather than a tree.\n\npower contribution is computed from the direct vassals of a faction, and each of\nthose factions has already folded in its own vassals' contribution — subject, at\neach level, to that level's own half-strength test.\n\n## related\n\nbecoming someone's vassal is a consequential, mutual act, which is why it is one\nof the three [[approval-request]] types.\n", "title": "Vassalage", "toc": [{"level": 2, "slug": "the-bargain", "text": "The bargain"}, {"level": 2, "slug": "the-condition-that-keeps-it-honest", "text": "The condition that keeps it honest"}, {"level": 2, "slug": "a-tree-not-a-list", "text": "A tree, not a list"}, {"level": 2, "slug": "related", "text": "Related"}], "type": "concept", "updated": "2026-08-07"}};
const META = {"citationCount": 90, "conceptCount": 38, "home": "moc-dans-plugins-community", "linkCount": 291, "mocCount": 7, "noteCount": 45, "repos": ["Dans-Plugins/Currencies", "Dans-Plugins/Dans-Plugin-Manager", "Dans-Plugins/Fiefs", "Dans-Plugins/Mailboxes", "Dans-Plugins/Medieval-Factions", "Dans-Plugins/Ponder", "Dans-Plugins/dansplugins-dot-com", "Dans-Plugins/dpc-conventions", "Dans-Plugins/dpc-mc-server"], "updated": "2026-08-07"};

const $ = (sel) => document.querySelector(sel);
const ids = Object.keys(NOTES);
const byTitle = (a, b) => NOTES[a].title.localeCompare(NOTES[b].title);

/* ------------------------------------------------------------------ nav */
function renderNav(filter) {
  const q = (filter || "").trim().toLowerCase();
  const match = q ? ids.filter((id) => NOTES[id].text.includes(q)) : ids;
  const mocs = match.filter((id) => NOTES[id].type === "moc").sort(byTitle);
  const concepts = match.filter((id) => NOTES[id].type !== "moc").sort(byTitle);

  const group = (label, list) => {
    if (!list.length) return "";
    let html = `<div class="sec-title">${label}<span class="count">${list.length}</span></div><ul>`;
    for (const id of list) {
      const cls = (NOTES[id].type === "moc" ? "moc " : "") + (id === current ? "on" : "");
